[project]
authors = [{ name = "Neve Nincs", email = "hello@neve.md" }]
dependencies = ["vaultspec-core>=0.1.36"]
description = "A local web interface for browsing Vaultspec records, source files, and Git history."
keywords = ["dashboard", "mcp", "observability", "rag", "ui", "vaultspec"]
license = { file = "LICENSE" }
name = "vaultspec-dashboard"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

  [project.urls]
  "Bug Tracker" = "https://github.com/nevenincs/vaultspec-dashboard/issues"
  Documentation = "https://github.com/nevenincs/vaultspec-dashboard/tree/main/README.md"
  Homepage = "https://github.com/nevenincs/vaultspec-dashboard"
  Repository = "https://github.com/nevenincs/vaultspec-dashboard"

# The published Python wheel (src/vaultspec_dashboard) was retired: the dashboard
# is the Rust engine (engine/) plus the TypeScript SPA (frontend/). This manifest
# now exists ONLY to manage the uv-provided dev toolchain — the vaultspec-core CLI,
# vaultspec-rag semantic search, and the markdown + pre-commit tooling — so it is a
# uv virtual project (not a package, never built or published).
[tool.uv]
package = false

[dependency-groups]
# Local dev tooling only (PEP 735). vaultspec-rag (semantic search) and its torch
# backend live here so they never become runtime or published dependencies. The
# cu130 torch source pin in [tool.uv.sources] applies because torch arrives through
# vaultspec-rag in this group.
dev = [
  "identify>=2.0.0",
  "mdformat>=1.0.0",
  "mdformat-frontmatter>=2.0.10",
  "mdformat-gfm>=1.0.0",
  "prek>=0.3.2",
  "pymarkdownlnt>=0.9.0",
  # Declared, not inherited. The guards parse the release workflows to check
  # that every `runs-on` reaches the preflight's selector derivation, and PyYAML
  # was already importable here only as a transitive dependency of several
  # others. The dependency-declaration guard refuses that - a package that
  # arrives by accident leaves on the same terms, and the first sign is a guard
  # that cannot import on a clean checkout.
  "pyyaml>=6.0",
  "pytest>=9.1.1",
  "rich>=15.0.0",
  "torch>=2.4",
  "vaultspec-rag[mcp]>=0.3.8",
]

# The only Python tests in this repository are the repository-health guards in
# `dev/guards`, whose subject is this checkout's own configuration rather than a
# product. `testpaths` names the harness so a bare `pytest` finds them. The cache
# provider is disabled outright: a root `.pytest_cache` has been created
# read-only by another process in this shared worktree, after which every run
# emitted access-denied warnings, and the guards gain nothing from a cache.
[tool.pytest.ini_options]
# The fleet-standard reporting set, stated once here rather than retyped on
# every guard lane: a lane passes only what SELECTS it - paths and markers -
# never how pytest reports.
#
# `-ra` is the load-bearing entry. pytest's default `-r` value is `fE`, so a
# run reports failures and errors and stays SILENT about skips; under `-q`
# that makes a guard lane which skipped everything read exactly like one that
# passed. `--strict-markers` and `--strict-config` turn a typo into an error
# rather than a silent empty selection that exits 5 and looks clean.
addopts = [
  "-q",
  "-ra",
  "--tb=short",
  "--durations=10",
  "--strict-markers",
  "--strict-config",
  "--capture=sys",
  "-p",
  "no:cacheprovider",
]
testpaths = ["dev"]
# `--strict-markers` above means every marker must be declared. `unit` names a
# pure test with no network and no subprocess; the dependency-audit gate's
# guards carry it so the same test file is identical in every repository.
markers = ["unit: pure test - no network, no subprocess, no external tool"]
# No `timeout`/`timeout_func_only` here: pytest-timeout is not in this
# repository's dev group, and `--strict-config` correctly refuses an ini key
# no installed plugin owns. The guards are pure-stdlib and sub-second.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

  [[tool.uv.index]]
  explicit = true
  name = "pytorch-cu130"
  url = "https://download.pytorch.org/whl/cu130"

  [tool.uv.sources]
  torch = [{ index = "pytorch-cu130" }]
