# Injected into every dist build job (engine/dist-workspace.toml
# `github-build-setup`): the release binary is built with the embed-spa
# feature, which compiles frontend/dist into the executable - so the SPA
# production bundle must exist before cargo runs (dashboard-packaging D2).
- name: Give the job a writable HOME (containerised runners only)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    # `Install dist` runs an installer that writes into $HOME, and on a
    # containerised runner the image's HOME belongs to another user: the
    # aarch64-unknown-linux-gnu leg of v0.1.5 died on
    # `mkdir: cannot create directory '/home/runner/.config/fish': Permission
    # denied` before a single artifact was built. Only redirect when HOME is
    # genuinely unwritable, so a normal runner keeps its own caches.
    if [ -n "${HOME:-}" ] && mkdir -p "$HOME/.config" 2>/dev/null; then
      echo "HOME is writable at $HOME"
    else
      writable="$RUNNER_TEMP/home"
      mkdir -p "$writable"
      echo "HOME=$writable" >> "$GITHUB_ENV"
      echo "::warning::HOME (${HOME:-unset}) is not writable on this runner - redirecting to $writable for this job"
    fi
- name: Verify the compile cache cannot block the release
  shell: bash
  run: |
    # Same backstop the gate carries in engine-ci.yml, for the same reason: the
    # wrapper is wired at the runner level, so cargo routes even its `rustc -vV`
    # probe through it and the FIRST cargo invocation dies if it cannot answer.
    # The release lane lacked this, so when the Windows runner's
    # the wrapper binary went missing from the shared cargo bin directory,
    # `cargo metadata` failed and v0.1.5 shipped no Windows artifact at all.
    # A compile cache must
    # never be able to block a release either - drop it, warn, and build
    # uncached rather than not building.
    set +e
    if [ -z "${RUSTC_WRAPPER:-}" ]; then
      echo "No RUSTC_WRAPPER on this runner - nothing to verify."
      exit 0
    fi
    probe=$("$RUSTC_WRAPPER" "$(rustup which rustc)" -vV 2>&1)
    rc=$?
    if [ "$rc" -ne 0 ]; then
      echo "$probe"
      echo "::warning::Compile cache unreachable via $RUSTC_WRAPPER (exit $rc) - continuing WITHOUT it. The build is slower and complete."
      echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
    else
      echo "Compile cache reachable via $RUSTC_WRAPPER"
    fi
- name: Ensure WiX Toolset is on PATH (MSI build, Windows only)
  if: runner.os == 'Windows'
  shell: pwsh
  run: |
    # WiX v3 is pre-installed on windows-2022 hosted runners and typically on
    # developer workstations. Ensure candle.exe is reachable before dist runs;
    # self-hosted runners may have WiX installed but not on PATH.
    if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
      $candidates = @(
        'C:\Program Files (x86)\WiX Toolset v3.14\bin',
        'C:\Program Files (x86)\WiX Toolset v3.11\bin'
      )
      $found = $false
      foreach ($dir in $candidates) {
        if (Test-Path "$dir\candle.exe") {
          "$dir" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX found at $dir — added to PATH"
          $found = $true
          break
        }
      }
      if (-not $found) {
        Write-Warning "WiX Toolset not found at known paths — MSI artifact will not be produced"
      }
    }
- name: Install Node
  uses: actions/setup-node@v4
  with:
    node-version: 22
    cache: npm
    cache-dependency-path: frontend/package-lock.json
- name: Build the SPA bundle for embedding
  # bash on every matrix runner: pwsh only checks native exit codes at script
  # end, so a failed `npm ci` would not halt before the build (P03 review).
  # The bundle is staged INSIDE the api crate (distribution-channels ADR:
  # boundary-clean embed) — the rust-embed folder is crate-relative and a
  # feature-on build without staging is a compile error.
  shell: bash
  run: |
    set -euo pipefail
    npm --prefix frontend ci
    npm --prefix frontend run build
    rm -rf engine/crates/vaultspec-api/assets/spa
    mkdir -p engine/crates/vaultspec-api/assets
    cp -r frontend/dist engine/crates/vaultspec-api/assets/spa
