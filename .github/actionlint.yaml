# actionlint configuration — the enumerated set of runner labels this repository
# schedules onto.
#
# WHAT THIS FILE DOES, PRECISELY. actionlint's `runner-label` check already
# rejects an unrecognised `runs-on:` out of the box: it ships knowledge of
# `self-hosted`, `linux`, `macos`, `windows`, `x64`, `arm`, `arm64` and the
# hosted `*-latest`/dated images, compares case-insensitively, and errors on
# anything else. This file does not make that check stricter — it ADMITS labels
# actionlint could not otherwise know about, by appending them to the known set.
#
# Two of the labels below are in that category and are genuinely load-bearing:
# `linux-x64` and `linux-arm64` are custom labels this repository mints, and a
# workflow naming one would fail the lint gate if it were not listed here. The
# rest are auto-assigned labels actionlint already recognises, listed so that
# one reviewed file states which machines this pipeline can reach, resolved out
# of the matrices rather than grepped for.
#
# THE FLEET. Four machines, one per shipped target:
#
#   self-hosted, Windows, X64                →  x86_64-pc-windows-msvc
#   self-hosted, Linux,   X64,   linux-x64   →  x86_64-unknown-linux-gnu
#   self-hosted, Linux,   ARM64, linux-arm64 →  aarch64-unknown-linux-gnu
#   self-hosted, macOS,   ARM64              →  aarch64-apple-darwin
#
# Every job in this repository runs on that self-hosted fleet; no workflow
# schedules onto a GitHub-hosted runner. That is a standing choice, not a
# constraint: this repository is PUBLIC, so hosted runners — including the
# native `ubuntu-24.04-arm` image — would be free for it.
#
# WHY EVERY LINUX JOB SELECTS ON ARCHITECTURE. The Actions runner gives every
# self-hosted Linux machine the auto-assigned label `Linux` regardless of its
# instruction set. Two Linux runners are registered, one x86-64 and one ARM64,
# so a bare `runs-on: Linux` names BOTH and the scheduler is free to pick
# either. That is not a style problem. A shipped product tree contains a
# PyInstaller-frozen runtime, and PyInstaller freezes only for the architecture
# it runs on — it has no target flag — so `aarch64-unknown-linux-gnu` built on
# the x86-64 machine would carry an x86_64 runtime inside an artifact labelled
# aarch64. Nothing downstream catches that: the manifest is truthful about bytes
# and silent about instruction set, and every later check verifies the tree
# against itself. It fails on a user's machine and nowhere earlier.
#
# So every `runs-on:` here names an architecture, written as a label list —
# `[self-hosted, Linux, X64]`, `[self-hosted, Linux, ARM64]` — and the
# matrix-driven jobs carry an `arch:` key alongside `os:` and compose
# `[self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]`. A bare `Linux` left
# anywhere is a latent wrong-architecture landing, and putting one back is the
# single easiest way to reintroduce the defect the arch guards exist to refuse.
#
# The three arch guards — in product-release.yml, a2a-product-contract.yml and
# a2a-product-certification.yml — compare `uname -m` against the target triple
# and are retained. With the labels above they now pass truthfully on every leg
# rather than refusing one; they are kept as the backstop on the SCHEDULING,
# which is the part that drifts.
#
# WHY TWO OF THESE LABELS ARE CUSTOM. `dist` holds one label STRING per target
# in `[dist.github-custom-runners]` and emits it verbatim into
# `runs-on: ${{ matrix.runner }}` in the generated release workflow. It cannot
# express a label list — a TOML array there does not error, it silently keeps
# only the first element — so the two Linux targets need a label that is
# architecture-specific on its own. `linux-x64` and `linux-arm64` are carried by
# the respective runners in ADDITION to their auto-assigned labels; the
# hand-written workflows do not use them, preferring the auto-assigned list
# form. dist-workspace.toml MUST stay in agreement with this list: a label no
# machine carries schedules a build that queues silently rather than failing.
#
# WHERE EACH LABEL IS REACHED FROM. Several jobs schedule through
# `[self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]`, so a grep for
# literal labels under-reports; the matrix `include:` blocks are part of the
# enumeration:
#
#   Windows / X64    literal  a2a-channel-feasibility, a2a-product-certification,
#                             ci-runner-probe, product-release, winget-publish
#                    matrix   engine-ci, a2a-product-certification,
#                             a2a-product-contract, product-release,
#                             release (dist-planned matrix.runner)
#   Linux / X64      literal  a2a-channel-feasibility, a2a-product-certification,
#                             channel-publish-gate, ci-runner-probe,
#                             product-release, quality-gates, release-please,
#                             release, scoop-bump
#                    matrix   the same five matrices as above
#   Linux / ARM64    literal  ci-runner-probe ONLY
#                    matrix   a2a-product-certification, a2a-product-contract,
#                             product-release, release
#   macOS / ARM64    literal  ci-runner-probe ONLY
#                    matrix   a2a-product-certification, a2a-product-contract,
#                             product-release, release
#
# The two ARM legs are reached by no literal `runs-on:` outside the probe, which
# is exactly why the probe exists: an absent or mislabelled runner on those legs
# presents as a job that queues forever rather than one that fails — no log, no
# annotation, no conclusion. `ci-runner-probe.yml` is dispatch-only and asserts
# `uname -m` on each leg, so the label-to-machine mapping is proven rather than
# assumed.
#
# `.github/release-build-setup.yml` is deliberately absent from this accounting:
# it is a bare step-list fragment injected into dist's generated build jobs, not
# a workflow and not a composite action. It declares no `runs-on:`, and
# actionlint cannot parse it standalone (it has no `on:`/`jobs:` sections), so it
# is neither linted nor a source of labels.
self-hosted-runner:
  labels:
    # OS labels — auto-assigned by the runner application.
    - Windows
    - Linux
    - macOS
    # Architecture labels — auto-assigned, and part of every `runs-on:` here.
    - X64
    - ARM64
    # Auto-assigned to every self-hosted machine.
    - self-hosted
    # Custom labels, minted only because dist's per-target runner value is a
    # single string and the two Linux machines share the `Linux` label. Carried
    # in addition to the auto-assigned labels above; see dist-workspace.toml.
    - linux-x64
    - linux-arm64
