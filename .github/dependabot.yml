# Dependabot version updates, one entry per manifest this repository ships.
#
# Every update PR runs on the self-hosted fleet, so minor and patch bumps are
# grouped per ecosystem and the open-PR count is capped: a weekly batch, not a
# queue that crowds out real work. Security updates are not grouped and are
# not subject to these limits.
#
# The PR lint lane runs on every Dependabot push; the merge gate still needs
# a maintainer to add `ci:full` before the bump can merge.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/engine"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The just installer is pinned fleet-wide by the CI contract
      # (dev/ci_contract.py, shared across the runner fleet); a bump here alone
      # would fail that contract. It moves when the shared contract moves.
      - dependency-name: "taiki-e/install-action"
