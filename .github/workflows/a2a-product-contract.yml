# Producer build check: builds the dashboard-bundled A2A runtime as a frozen
# PyInstaller onedir from the producer repository at the dashboard's pinned
# commit, then runs the binary's own dispatch smoke gate. This replaces the
# former capsule-manifest contract check: A2A no longer emits a capsule manifest
# — it ships clean gateway source plus an in-repo PyInstaller freeze recipe, and
# the dashboard builds and bundles the binary itself
# (see the `a2a-product-provisioning` decision, 2026-07-24).
#
# The `build_binary.py` entry drives the versioned onedir spec and smoke-tests
# the frozen dispatch surface (version, help, run-module allowlist refusal); a
# green run proves the pinned producer source freezes and boots its CLI.
#
# NOTE: PyInstaller does not cross-compile — each target's onedir must build on a
# runner of the matching OS/arch. The onedir lands at `dist/onedir/vaultspec-a2a/`.
name: a2a-product-contract

on:
  workflow_dispatch:
    inputs:
      producer_ref:
        description: >-
          Candidate vaultspec-a2a commit/ref to build instead of the pinned
          lock commit (pre-repin validation only; leave empty to build the
          committed lock as-is).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: a2a-product-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + smoke onedir (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macOS
          - target: aarch64-unknown-linux-gnu
            runner: Linux
          - target: x86_64-unknown-linux-gnu
            runner: Linux
          - target: x86_64-pc-windows-msvc
            runner: Windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Resolve producer commit
        id: producer
        shell: bash
        run: |
          if [ -n "${{ inputs.producer_ref }}" ]; then
            echo "ref=${{ inputs.producer_ref }}" >> "$GITHUB_OUTPUT"
          else
            pinned=$(jq -r '.a2a_source.commit' dashboard/packaging/a2a-component.lock.json)
            echo "ref=$pinned" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout A2A producer
        uses: actions/checkout@v4
        with:
          repository: nevenincs/vaultspec-a2a
          ref: ${{ steps.producer.outputs.ref }}
          path: producer
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        working-directory: producer
        run: uv python install 3.13

      - name: Install producer's locked freeze environment
        working-directory: producer
        run: uv sync --locked --no-default-groups --group freeze

      - name: Build + smoke the frozen onedir
        shell: bash
        working-directory: producer
        run: |
          uv run --no-sync --frozen python scripts/build_binary.py --dist dist/onedir

      - name: Upload the built onedir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-onedir-${{ matrix.target }}
          path: producer/dist/onedir/vaultspec-a2a
          if-no-files-found: error
          retention-days: 7
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f 'target/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf dashboard/engine/target 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force dashboard\engine\target -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
