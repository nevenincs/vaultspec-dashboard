# A2A onedir build proof: builds the dashboard-bundled a2a runtime binary
# from the producer repository at the dashboard's pinned commit, per target,
# using a2a's own in-repo freeze recipe (`scripts/build_binary.py`, which
# drives the versioned PyInstaller onedir spec and then smoke-tests the
# produced binary's dispatch surface: version, help tree, and the run-module
# allowlist refusing an unlisted module).
#
# This replaces the retired producer-consumer capsule contract proof
# (2026-07-24 a2a-product-provisioning decision, D2): a2a no longer emits a
# capsule or a component manifest, so there is nothing to cross-validate with
# a manifest parser. The proof that matters under the dashboard-built-onedir
# model is that the pinned source FREEZES and its frozen dispatch surface
# WORKS on each target - exactly what the release pipeline runs before
# composition (D3).
#
# NOT a push/PR gate: dispatch-only, like its predecessor. PyInstaller cannot
# cross-compile, so each target must run on a native-architecture runner.
#
# The pinned producer commit lives in `packaging/a2a-component.lock.json`
# (`a2a_source.commit`); `producer_ref` overrides it for pre-pin rehearsal
# against a candidate a2a commit.
name: a2a-product-contract

on:
  workflow_dispatch:
    inputs:
      producer_ref:
        description: >-
          Candidate vaultspec-a2a commit/ref to build instead of the pinned
          lock commit (pre-repin validation only; leave empty to build the
          committed lock as-is).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: a2a-product-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Build + smoke onedir (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macOS
          - target: aarch64-unknown-linux-gnu
            runner: Linux
          - target: x86_64-unknown-linux-gnu
            runner: Linux
          - target: x86_64-pc-windows-msvc
            runner: Windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Resolve producer commit
        id: producer
        shell: bash
        run: |
          if [ -n "${{ inputs.producer_ref }}" ]; then
            echo "ref=${{ inputs.producer_ref }}" >> "$GITHUB_OUTPUT"
          else
            pinned=$(jq -r '.a2a_source.commit' dashboard/packaging/a2a-component.lock.json)
            echo "ref=$pinned" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout A2A producer
        uses: actions/checkout@v4
        with:
          repository: nevenincs/vaultspec-a2a
          ref: ${{ steps.producer.outputs.ref }}
          path: producer
          persist-credentials: false

      # Not `astral-sh/setup-uv`: that Node action aborts during teardown on the
      # Windows runner with a libuv assertion AFTER reporting success. This
      # matrix includes a Windows target, so it would fail there having already
      # done its job. uv is provisioned on the fleet; require it instead.
      - name: Require uv on the runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            echo "::error::uv is not on PATH for this runner; the frozen onedir cannot be built without it" >&2
            exit 1
          fi
          uv --version

      - name: Install Python
        working-directory: producer
        run: uv python install 3.13

      - name: Install producer's locked freeze environment
        working-directory: producer
        run: uv sync --locked --no-default-groups --group freeze

      # PyInstaller freezes for the architecture it RUNS on and has no target
      # flag. This matrix maps aarch64-unknown-linux-gnu onto the x86_64 Linux
      # runner, so without this the proof would smoke an x86_64 onedir while
      # claiming to prove the aarch64 one — a green that certifies the wrong
      # binary. Refuse instead; the same guard already fences the release build.
      - name: Refuse to freeze for an architecture this runner is not
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-*) want=arm64 ;;
            x86_64-*)  want=x64 ;;
            *) echo "::error::unhandled target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            aarch64|arm64) have=arm64 ;;
            x86_64|amd64)  have=x64 ;;
            *) have="$(uname -m)" ;;
          esac
          if [ "$want" != "$have" ]; then
            echo "::error::${{ matrix.target }} needs a $want runner; this one is $have. The frozen runtime cannot be cross-compiled, so this proof would smoke a $have binary while claiming $want." >&2
            exit 1
          fi
          echo "runner architecture $have matches ${{ matrix.target }}"
      - name: Build + smoke the frozen onedir
        shell: bash
        working-directory: producer
        run: |
          uv run --no-sync --frozen python scripts/build_binary.py \
            --dist dist/binary

      - name: Write built onedir inventory
        if: always()
        shell: bash
        working-directory: producer
        run: |
          # An inventory (not the multi-hundred-MB tree): the file list is
          # enough to diagnose a hidden-import or data-file miss from the log.
          if [ -d dist/binary/vaultspec-a2a ]; then
            find dist/binary/vaultspec-a2a -type f \
              | sort > onedir-inventory-${{ matrix.target }}.txt
          fi

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-onedir-inventory-${{ matrix.target }}
          path: producer/onedir-inventory-${{ matrix.target }}.txt
          if-no-files-found: ignore
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf dashboard/engine/target 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force dashboard\engine\target -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
