#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that a GitHub Release with this tag is assumed to exist as a draft
# with the appropriate title/body, and will be undrafted for you.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      # The installer puts `dist` in $CARGO_HOME/bin, and this fleet's runners set
      # CARGO_HOME to a shared cache (/home/hello/.ci-shared/cargo), so the
      # generated `path: ~/.cargo/bin/dist` matched nothing. `if-no-files-found`
      # defaults to `warn`, so the upload produced no artifact SILENTLY and the
      # failure surfaced two jobs later as
      # `Artifact not found for name: cargo-dist-cache` in build-global-artifacts
      # — which blocks `host`, and therefore blocks every asset upload.
      # Stage it at a fixed path first so the upload cannot depend on where the
      # toolchain happens to live.
      - name: Stage dist for caching
        shell: bash
        run: |
          set -euo pipefail
          src="${CARGO_HOME:-$HOME/.cargo}/bin/dist"
          test -x "$src" || { echo "::error::dist not found at $src"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist-cache"
          cp "$src" "$RUNNER_TEMP/dist-cache/dist"
          echo "staged $src"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-cache/dist
          # Never let this go missing quietly again.
          if-no-files-found: error
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Trust the checkout inside the build container
        if: ${{ matrix.container }}
        shell: bash
        run: |
          # The two Linux legs build inside a manylinux image as root, against a
          # workspace the runner created as another user. Git refuses to operate on a
          # tree it considers dubiously owned, and while actions/checkout marks its
          # own clone safe, the build reaches git again afterwards - the version
          # stamp and cargo's own metadata both do - so mark it once for the job.
          # Guarded on `matrix.container` and not `runner.os == 'Linux'`: the
          # uncontainerised legs run as their own user and need no such override.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Ensure WiX Toolset is on PATH (MSI build, Windows only)"
        if: "runner.os == 'Windows'"
        run: |
          # WiX v3 is pre-installed on windows-2022 hosted runners and typically on
          # developer workstations. Ensure candle.exe is reachable before dist runs;
          # self-hosted runners may have WiX installed but not on PATH.
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $candidates = @(
              'C:\Program Files (x86)\WiX Toolset v3.14\bin',
              'C:\Program Files (x86)\WiX Toolset v3.11\bin'
            )
            $found = $false
            foreach ($dir in $candidates) {
              if (Test-Path "$dir\candle.exe") {
                "$dir" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
                Write-Host "WiX found at $dir — added to PATH"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Warning "WiX Toolset not found at known paths — MSI artifact will not be produced"
            }
          }
        shell: "pwsh"
      - name: "Install Node"
        uses: "actions/setup-node@v4"
        with:
          "cache": "npm"
          "cache-dependency-path": "frontend/package-lock.json"
          "node-version": 22
      - name: "Build the SPA bundle for embedding"
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          rm -rf engine/crates/vaultspec-api/assets/spa
          mkdir -p engine/crates/vaultspec-api/assets
          cp -r frontend/dist engine/crates/vaultspec-api/assets/spa
        shell: "bash"
      # `Install dist` writes into $HOME, and on a containerised runner the
      # image's HOME belongs to another user: the aarch64-unknown-linux-gnu leg
      # of v0.1.5 and v0.1.6 both died on `mkdir: cannot create directory
      # '/home/runner/.config/fish': Permission denied` before building
      # anything. Only redirect when HOME is genuinely unwritable, so an
      # ordinary runner keeps its own caches.
      - name: Give the job a writable HOME (containerised runners only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Probe the EXACT path the installer needs, not its parent.
          # `mkdir -p` on an existing directory returns 0 whatever its
          # permissions, and /home/runner/.config DOES exist on the container -
          # which is why the failure names `.config/fish` and not `.config`. So
          # `mkdir -p "$HOME/.config"` succeeds, the redirect is skipped, and
          # `Install dist` dies on the same line as v0.1.5 and v0.1.6.
          # cargo-dist-installer.sh v0.32.0 line 957 runs exactly this mkdir, so
          # probe and prediction cannot disagree. Creating it early is harmless:
          # the installer's own mkdir -p is then a no-op.
          if [ -n "${HOME:-}" ] && mkdir -p "$HOME/.config/fish/conf.d" 2>/dev/null; then
            echo "HOME is writable at $HOME"
          else
            writable="$RUNNER_TEMP/home"
            mkdir -p "$writable"
            echo "HOME=$writable" >> "$GITHUB_ENV"
            echo "::warning::HOME (${HOME:-unset}) is not writable on this runner - redirecting to $writable for this job"
            # A redirected HOME must not take the toolchain with it. rustup and
            # cargo live under the ORIGINAL home, and dist resolves cargo through
            # them, so moving HOME alone makes the build fail later with
            # `cargo, required to run this task, is missing` - one step further
            # on than the failure this redirect exists to fix, which is a worse
            # place to discover it. Pin both homes to where the toolchain
            # actually is, and keep its bin dir on PATH, unless the runner has
            # already set them.
            if [ -z "${CARGO_HOME:-}" ] && [ -d "${HOME:-}/.cargo" ]; then
              echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
            fi
            if [ -z "${RUSTUP_HOME:-}" ] && [ -d "${HOME:-}/.rustup" ]; then
              echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
            fi
            if [ -d "${CARGO_HOME:-$HOME/.cargo}/bin" ]; then
              echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            fi
          fi
      # The compile cache is wired as a RUSTC_WRAPPER at the runner level, so
      # cargo routes even its `rustc -vV` probe through it and the FIRST cargo
      # invocation dies if it cannot answer. engine-ci.yml has carried this
      # backstop since a squatted port broke the gate; the release lane needs it
      # for the same reason - a compile cache must never be able to block a
      # release. Probe it as cargo does; if it cannot answer, drop it and build
      # uncached rather than not building.
      - name: Verify the compile cache cannot block the release
        shell: bash
        run: |
          set +e
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "No RUSTC_WRAPPER on this runner - nothing to verify."
            exit 0
          fi
          probe=$("$RUSTC_WRAPPER" "$(rustup which rustc)" -vV 2>&1)
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "$probe"
            echo "::warning::Compile cache unreachable via $RUSTC_WRAPPER (exit $rc) - continuing WITHOUT it. The build is slower and complete."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          else
            echo "Compile cache reachable via $RUSTC_WRAPPER"
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f 'target/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf target engine/target 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force target, engine\target -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf target/distrib 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # If we're editing a release in place, we need to upload things ahead of time
          gh release upload "${{ needs.plan.outputs.tag }}" artifacts/*

          # PRERELEASE_FLAG is deliberately UNQUOTED. It holds either
          # `--prerelease` or the empty string, and the empty case must expand to
          # NO argument at all; quoting it would hand `gh release edit` a literal
          # empty argument and break every stable (non-prerelease) release. This
          # is intentional word-removal, not an oversight — do not "fix" it.
          # shellcheck disable=SC2086
          gh release edit "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --draft=false
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  # Hand-added; not produced by `dist generate-ci`. Re-apply if that regenerates
  # this file.
  #
  # release-please publishes the GitHub Release as soon as its PR merges, and
  # this workflow attaches the artifacts afterwards. So any failure between
  # those two points leaves a published, non-draft, asset-less release serving
  # as `releases/latest` - which is where every badge, install instruction and
  # package-manager manifest points. v0.1.4 sat that way for six weeks because
  # five TypeScript errors failed the SPA bundle on every build leg, `host`
  # skipped, and nothing said so.
  #
  # Draft-until-attached is not available as a fix: GitHub does not create the
  # tag ref for a draft release, and this workflow triggers on that tag push, so
  # drafting would deadlock the release rather than protect it.
  #
  # This job runs on every terminal outcome and makes the two states honest -
  # publish only what actually carries artifacts, and demote what does not so
  # `latest` falls back to the previous good release instead of advertising an
  # empty one.
  verify-release-assets:
    name: Verify the release carries artifacts
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.outputs.publishing == 'true' }}
    # HOSTED. This job's whole purpose is to demote a release whose build just
    # failed - and a build fails most often when the fleet is congested or
    # down, which is exactly when a self-hosted job will not be scheduled.
    #
    # v0.1.7 proved it. Every Compose leg failed, and this guard then sat
    # QUEUED for over an hour behind the single Linux/X64 runner it shares with
    # the build, while the empty release went on serving as `latest`. It had to
    # be demoted by hand - the guard's one job, done by a person because the
    # guard could not get a machine.
    #
    # Nothing here needs a fleet capability: the job calls `gh release view`
    # and `gh release edit` and nothing else. The preflight in
    # product-release.yml is hosted for this same reason.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      HOST_RESULT: ${{ needs.host.result }}
      # Whether this version is *meant* to be a prerelease. Demotion below
      # reuses the prerelease flag as a "not latest" marker, so promotion must
      # consult the plan rather than assume every release wants to be latest -
      # otherwise a genuine -rc tag gets promoted into `latest` by this job.
      PLANNED_PRERELEASE: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
    steps:
      - name: Require artifacts on the published release
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          echo "release ${TAG} carries ${assets} asset(s); host=${HOST_RESULT}"

          if [ "$HOST_RESULT" = "success" ] && [ "$assets" -gt 0 ]; then
            exit 0
          fi

          # Demote so `releases/latest` resolves to the last release that has
          # artifacts. A prerelease keeps the tag, the notes and the URL intact
          # and reachable - it only stops this one answering as `latest`.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            echo "::notice::demoted ${TAG} to a prerelease so latest skips it"
          fi

          echo "::error::${TAG} has ${assets} assets (host=${HOST_RESULT}). A \
          release with no artifacts must not serve as latest; it has been \
          demoted to a prerelease. Fix the build and re-run this workflow for \
          this tag - the last step promotes it back once artifacts attach."
          exit 1

      - name: Promote a repaired release back to latest
        if: ${{ needs.host.result == 'success' && !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # A re-run after a fixed build must undo an earlier demotion, or the
          # repaired release stays invisible to `latest` forever. Only reached
          # when host succeeded, the asset check above passed, and the plan says
          # this version was meant to be a full release.
          test "$PLANNED_PRERELEASE" = "false"
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
            echo "::notice::promoted ${TAG} back to a full release"
          fi

  custom-scoop-bump:
    needs:
      - plan
      - announce
    uses: ./.github/workflows/scoop-bump.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
