#
# CI that:
#
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to the tag's DRAFT GitHub Release
#
# Hand-adapted for the fleet release chain; re-apply if `dist generate-ci`
# regenerates this file. It is not triggered by a tag: the release orchestrator
# (product-release.yml) calls it after the merge gate has measured the tagged
# tree, and the orchestrator alone decides when the draft becomes visible. This
# workflow never publishes, promotes or demotes a release.

name: Dashboard Release Archives
permissions:
  contents: read

# Dispatched or called with the release TAG, and run AT that tag
# (`gh workflow run ... --ref <tag>`, or a caller dispatched the same way), so
# every checkout below is the tagged tree. `inputs.tag` names the release dist
# announces; the orchestrator's ref check proves the two agree.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build archives for (e.g. v0.1.13)."
        required: true
        type: string
    secrets:
      FLEET_PREFLIGHT_TOKEN:
        description: "PAT with Administration:read, for the runner preflight."
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build archives for (e.g. v0.1.13). Dispatch with --ref set to the same tag."
        required: true
        type: string

concurrency:
  # KEYED BY VERSION, not by ref. An unkeyed or ref-keyed release group means
  # GitHub holds one running and one pending run, so a third release silently
  # CANCELS the queued one - and a cancelled run reports `cancelled`, not
  # `failed`, so a release that never happened raises no alarm.
  group: release-archives-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
  #
  # Refuse to start a release whose runners cannot serve it.
  #
  # v0.1.9 is why. It was tagged at 23:58 and became `releases/latest` with zero
  # assets; `build-local-artifacts (aarch64-apple-darwin)` then sat QUEUED until
  # 04:44 - 4h46m - waiting on a host that serves runners only on AC. Nothing
  # timed it out, because a queued job is not bounded by `timeout-minutes`. The
  # installers fetch from the release, so for that whole window they resolved to
  # nothing.
  #
  # The failure is silent and MISATTRIBUTABLE, which is the real cost: a queued
  # job and a busy fleet look identical from the outside, and this queue was read
  # as fleet contention for over an hour before anyone opened the run.
  #
  # HOSTED, deliberately: a preflight that needs the fleet cannot report that the
  # fleet is down. It is the only job in this file that does not run on it.
  # DERIVATION ONLY. What this workflow schedules onto is repo-specific and
  # stays here; the CHECK is one implementation shared by the whole runner
  # fleet and rendered in below. This file used to carry a second copy
  # of that check as a local composite action - the copy that never gets the
  # fix is the one that ships the bug.
  derive-selectors:
    timeout-minutes: 15
    name: "Check: Runner selectors (Linux)"
    # ON THE FLEET. This job derives the selectors the preflight below
    # checks, and it was left hosted when that preflight was migrated -
    # two adjacent jobs, one moved and one missed. It needs nothing the
    # fleet lacks: a checkout and an awk.
    runs-on: [self-hosted, Linux, X64]
    outputs:
      selectors: ${{ steps.derive.outputs.selectors }}
    steps:
      # Only what the steps below read, only this commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: .sparse-derive-selectors
          sparse-checkout: |
            .github/workflows/release.yml
            dist-workspace.toml
          sparse-checkout-cone-mode: false

      - name: Derive the selectors this workflow schedules onto
        id: derive
        shell: bash
        # The sparse checkout above lives in its own directory so its sparse
        # state never reaches the runner's shared workspace (the fleet's
        # checkout audit); the paths below are relative to it.
        working-directory: .sparse-derive-selectors
        run: |
          set -uo pipefail
          workflow=".github/workflows/release.yml"
          config="dist-workspace.toml"
          for f in "${workflow}" "${config}"; do
            [ -f "${f}" ] || { echo "::error::${f} not checked out; cannot derive selectors" >&2; exit 1; }
          done

          # DERIVED, not hand-listed. A list that must be edited in lockstep with
          # a matrix eventually is not: the sibling project shipped a hand-kept
          # list that outlived its matrix twice, and the second time it reported
          # a false partial on a release every leg could serve.
          #
          # Two sources, because there are two KINDS of selector here and only
          # one of them is in this file:
          #
          #   1. The build matrix. dist takes each leg's runner KEY verbatim
          #      from the github-custom-runners table in dist-workspace.toml, so
          #      that table IS the matrix; the build job's `runs-on` then
          #      translates each key into its standard fleet label set. Read the
          #      keys from the file dist reads, and the translation from the one
          #      line that applies it - never from a second copy.
          #   2. Every other job, which carries a literal label list right here.
          #
          # Both readings assume a shape, so both assert it. A derivation that
          # silently describes something the file no longer says is worse than no
          # derivation, because it still prints a confident ok.
          #
          # The braces below are escaped so this stays a bash string: Actions
          # expands a bare expression inside `run:` before bash ever sees it, and
          # the guard would then be matching the empty string against itself.
          translation=$(grep -E '^[[:space:]]*runs-on:[[:space:]]*\$\{\{[[:space:]]*fromJSON\(matrix\.runner ==' "${workflow}")
          [ "$(printf '%s\n' "${translation}" | grep -c .)" -eq 1 ] || {
            echo "::error::${workflow} no longer selects its build matrix through exactly one matrix.runner translation; the dist-workspace.toml table may no longer be the matrix. Re-check this derivation." >&2
            exit 1
          }
          # key<TAB>label,set - lowercased, as every other selector here is.
          declare -A label_set=()
          while IFS=$'\t' read -r key labels; do
            [ -n "${key}" ] && label_set["${key}"]="${labels}"
          done < <(
            printf '%s\n' "${translation}" |
              grep -oE "matrix\.runner == '[^']+' && '\[[^]]*\]'" |
              sed -E "s/^matrix\.runner == '([^']+)' \&\& '\[([^]]*)\]'\$/\1\t\2/" |
              tr -d '" ' | tr '[:upper:]' '[:lower:]'
          )
          [ "${#label_set[@]}" -gt 0 ] || {
            echo "::error::read no key -> label-set pair out of ${workflow}'s matrix.runner translation" >&2
            exit 1
          }
          grep -qE '^[[:space:]]*\[dist\.github-custom-runners\]' "${config}" || {
            echo "::error::${config} has no [dist.github-custom-runners] table; dist would emit its default hosted runners and this derivation would miss every build leg." >&2
            exit 1
          }

          # The dist keys, and each one's translation. A key the translation
          # does not name would be scheduled onto a label no runner carries;
          # refuse it here, by name, rather than let the preflight find it.
          mapfile -t dist_keys < <(
              # The dist table, in BOTH of the forms it accepts: the short
              # `<target> = "<label>"` directly under the table, and the expanded
              # `[dist.github-custom-runners.<target>]` sub-table, where the
              # label is `runner` and the neighbouring `host` and `container`
              # keys must not be mistaken for one. Both forms are in use here -
              # the Linux legs moved to the expanded form when they gained
              # digest-pinned manylinux containers.
              awk '
                function value(s) {
                  sub(/^[^=]*=[[:space:]]*/, "", s)
                  sub(/[[:space:]]*#.*$/, "", s)
                  gsub(/"/, "", s)
                  gsub(/[[:space:]]/, "", s)
                  return tolower(s)
                }
                /^[[:space:]]*\[dist\.github-custom-runners\][[:space:]]*$/ { mode = "short"; next }
                /^[[:space:]]*\[dist\.github-custom-runners\./              { mode = "expanded"; next }
                /^[[:space:]]*\[/                                           { mode = ""; next }
                mode == "short" && /^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=/ { v = value($0); if (length(v)) print v; next }
                mode == "expanded" && /^[[:space:]]*runner[[:space:]]*=/       { v = value($0); if (length(v)) print v; next }
              ' "${config}"
          )
          dist_selectors=()
          for key in "${dist_keys[@]}"; do
            [ -n "${label_set[${key}]:-}" ] || {
              echo "::error::dist runner key '${key}' in ${config} has no translation in ${workflow}'s build-job runs-on; add it there as a standard label set" >&2
              exit 1
            }
            dist_selectors+=("${label_set[${key}]}")
          done

          mapfile -t selectors < <(
            {
              # Literal label lists. Templated ones are skipped - parsing one
              # would yield a selector containing an unexpanded expression, which
              # matches no runner and reads as a real failure.
              grep -vE '\$\{\{' "${workflow}" |
                awk -F'[][]' '/^[[:space:]]*runs-on:[[:space:]]*\[/ && NF > 2 {print $2}' |
                tr -d ' ' | tr '[:upper:]' '[:lower:]'
              # The dist legs, translated above into their standard label sets.
              printf '%s\n' "${dist_selectors[@]}"
            } | sort -u
          )
          if [ "${#selectors[@]}" -eq 0 ]; then
            echo "::error::derived no runner selector from ${workflow} or ${config}; refusing to pass vacuously" >&2
            exit 1
          fi
          {
            echo "selectors<<SELECTORS_EOF"
            printf '%s\n' "${selectors[@]}"
            echo "SELECTORS_EOF"
          } >> "${GITHUB_OUTPUT}"

  # HOSTED, DELIBERATELY, and that decision now lives with the check itself: a
  # preflight that needs the fleet cannot report that the fleet is down.
  #
  # The token is passed with NO fallback. GITHUB_TOKEN can never read
  # `actions/runners` - that endpoint needs Administration:read, which no
  # `permissions:` value grants it - so the old `|| secrets.GITHUB_TOKEN`
  # guaranteed a 403 wherever the PAT was absent. A reusable workflow enforces
  # `required: true` on a secret; a composite action does not, which is the
  # second reason this moved.
  preflight:
    timeout-minutes: 15
    name: "Check: Preflight runners (Linux)"
    needs: derive-selectors
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Every required selector has an online runner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FLEET_PREFLIGHT_TOKEN }}
          TARGET_REPO: ${{ github.event.repository.name }}
          SELECTORS: ${{ needs.derive-selectors.outputs.selectors }}
          ALLOW_GATED: false
        run: |
          # BEGIN generated runner preflight - do not edit here
          # THE canonical runner preflight. One implementation for the whole fleet.
          #
          # WHY THIS IS A SCRIPT AND NOT A REUSABLE WORKFLOW. It was one, and every
          # consumer's call was rejected before a single job started: its source
          # repository is PRIVATE and all six consuming repos are PUBLIC, and a public repository
          # cannot call a reusable workflow from a private one. GitHub reports that as a
          # run with zero jobs and "this run likely failed because of a workflow file
          # issue", which is why it survived actionlint, survived review, and would have
          # surfaced first on a release.
          #
          # So the sharing model is DEPLOYMENT, not runtime resolution: this file is the
          # source, it is rendered into each consumer's workflow, and a parity check
          # fails when a rendered copy drifts from it.
          #
          # Contract - the caller sets these, all required:
          #   GH_TOKEN     PAT with Administration:read. NEVER the default GITHUB_TOKEN:
          #                it cannot read actions/runners at any `permissions:` value.
          #   TARGET_REPO  repository name, without the owner
          #   SELECTORS    newline-separated, each a comma-joined label set
          #   ALLOW_GATED  "true" tolerates registered-but-offline runners

          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::fleet_token is empty. This check needs a PAT with Administration:read; GITHUB_TOKEN cannot read actions/runners." >&2
            exit 1
          fi

          # GitHub-HOSTED runners are not in `actions/runners`, which lists only
          # self-hosted ones. A hosted label is therefore indistinguishable from
          # a self-hosted label nobody registered, so checking one would fail
          # every run for a runner that is always available. Two legs on this
          # fleet are hosted BY DECISION - the aarch64 Linux builds, because the
          # ARM machine cannot host a `container:` job - and this check must not
          # contradict that decision.
          #
          # The prefixes are GitHub's hosted-image vocabulary, not ours, and a
          # hosted image label always carries a version or channel suffix
          # (`ubuntu-latest`, `ubuntu-24.04-arm`, `windows-2022`, `macos-15`).
          # Fleet labels carry no such suffix and are checked normally. Never
          # name a fleet label `windows-<something>`: it would be skipped here
          # and go unchecked.
          checkable=""
          while IFS= read -r selector; do
            [ -n "${selector}" ] || continue
            case "${selector}" in
              ubuntu-*|windows-*|macos-*)
                echo "hosted    [${selector}] -> GitHub-hosted, not in the self-hosted list; not checked"
                ;;
              *) checkable+="${selector}"$'\n' ;;
            esac
          done <<< "${SELECTORS}"

          if [ -z "${checkable}" ]; then
            echo "every selector is GitHub-hosted; nothing to check against the fleet."
            exit 0
          fi

          runners=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}/actions/runners" \
            --jq '.runners[] | [.status, ([.labels[].name] | map(ascii_downcase) | join(","))] | @tsv')

          if [ -z "${runners}" ]; then
            echo "::error::${TARGET_REPO} has no registered self-hosted runners at all" >&2
            exit 1
          fi

          failed=0
          while IFS= read -r selector; do
            [ -n "${selector}" ] || continue
            # Normalise: lowercase, strip spaces. GitHub matches labels
            # case-insensitively, and a selector written `Linux` must match a
            # runner advertising `linux`.
            want=$(printf '%s' "${selector}" | tr '[:upper:]' '[:lower:]' | tr -d ' ')

            online=0; registered=0
            while IFS=$'\t' read -r status labels; do
              missing=0
              IFS=',' read -ra parts <<< "${want}"
              for part in "${parts[@]}"; do
                case ",${labels}," in
                  *",${part},"*) ;;
                  *) missing=1; break ;;
                esac
              done
              [ "${missing}" -eq 0 ] || continue
              registered=$((registered + 1))
              [ "${status}" = "online" ] && online=$((online + 1))
            done <<< "${runners}"

            if [ "${online}" -gt 0 ]; then
              echo "ok        [${want}] -> ${online} online"
            elif [ "${registered}" -eq 0 ]; then
              echo "::error::[${want}] is carried by NO registered runner. A job dispatched to it queues until GitHub cancels it." >&2
              failed=1
            elif [ "${ALLOW_GATED}" = "true" ]; then
              echo "::warning::[${want}] matches ${registered} runner(s), all offline. Continuing because allow_gated is set."
            else
              echo "::error::[${want}] matches ${registered} registered runner(s) but NONE are online. On this fleet that usually means the power-gated host is on battery; a job dispatched now would queue rather than fail." >&2
              failed=1
            fi
          done <<< "${checkable}"

          if [ "${failed}" -ne 0 ]; then
            echo "::error::preflight refused to start work that cannot be scheduled" >&2
            exit 1
          fi
          echo "preflight passed: every required selector has an online runner"
          # END generated runner preflight
  plan:
    name: "Build: Release plan (Linux)"
    timeout-minutes: 30
    needs: preflight
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ inputs.tag }}
      tag-flag: ${{ format('--tag={0}', inputs.tag) }}
      publishing: "true"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      # The installer puts `dist` in $CARGO_HOME/bin, and this fleet's runners set
      # CARGO_HOME to a shared cache (/home/hello/.ci-shared/cargo), so the
      # generated `path: ~/.cargo/bin/dist` matched nothing. `if-no-files-found`
      # defaults to `warn`, so the upload produced no artifact SILENTLY and the
      # failure surfaced two jobs later as
      # `Artifact not found for name: cargo-dist-cache` in build-global-artifacts
      # — which blocks `host`, and therefore blocks every asset upload.
      # Stage it at a fixed path first so the upload cannot depend on where the
      # toolchain happens to live.
      - name: Stage dist for caching
        shell: bash
        run: |
          set -euo pipefail
          src="${CARGO_HOME:-$HOME/.cargo}/bin/dist"
          test -x "$src" || { echo "::error::dist not found at $src"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist-cache"
          cp "$src" "$RUNNER_TEMP/dist-cache/dist"
          echo "staged $src"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-cache/dist
          # Never let this go missing quietly again.
          if-no-files-found: error
      - id: plan
        name: Plan the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Every later job receives this tag through the plan outputs, so it
          # is validated here, once, before anything else reads it.
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${TAG}' is not a release tag (v<major>.<minor>.<patch>[-pre])" >&2
            exit 1
          fi
          dist host --steps=create --tag="${TAG}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: "Build: CLI archive (${{ join(matrix.targets, ', ') }})"
    timeout-minutes: 120
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    # HAND-MAINTAINED TRANSLATION, not dist output (allow-dirty = ["ci"]; keep
    # it across any `dist generate-ci` diff). dist 0.32.0 - the latest release -
    # models a runner as ONE label string (`GithubRunner`, a String newtype), so
    # dist-workspace.toml can only name a symbolic key per target. The fleet
    # standard allows labels for OS/arch plus {gpu, cuda, build, dev-runner}
    # only, so no runner carries a key like `linux-x64`: each key is translated
    # here into its standard label set. An unmapped key becomes a label no
    # runner carries, which the preflight refuses by name before a leg queues;
    # derive-selectors reads this very line, and
    # dev/guards/test_preflight_coverage.py fails on a dist key it lacks.
    runs-on: ${{ fromJSON(matrix.runner == 'linux-x64' && '["self-hosted","Linux","X64"]' || matrix.runner == 'linux-arm64' && '["self-hosted","Linux","ARM64"]' || matrix.runner == 'macOS' && '["self-hosted","macOS","ARM64"]' || matrix.runner == 'Windows' && '["self-hosted","Windows","X64"]' || format('["unmapped-dist-runner-{0}"]', matrix.runner)) }}
    # The images are pinned by digest in dist-workspace.toml; dist plans them
    # into the matrix, so the pin is not visible here.
    container: ${{ matrix.container && matrix.container.image || null }} # zizmor: ignore[unpinned-images]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Trust the checkout inside the build container
        if: ${{ matrix.container }}
        shell: bash
        run: |
          # The two Linux legs build inside a manylinux image as root, against a
          # workspace the runner created as another user. Git refuses to operate on a
          # tree it considers dubiously owned, and while actions/checkout marks its
          # own clone safe, the build reaches git again afterwards - the version
          # stamp and cargo's own metadata both do - so mark it once for the job.
          # Guarded on `matrix.container` and not `runner.os == 'Linux'`: the
          # uncontainerised legs run as their own user and need no such override.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Ensure WiX Toolset is on PATH (MSI build, Windows only)"
        if: "runner.os == 'Windows'"
        run: |
          # WiX v3 is pre-installed on windows-2022 hosted runners and typically on
          # developer workstations. Ensure candle.exe is reachable before dist runs;
          # self-hosted runners may have WiX installed but not on PATH.
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $candidates = @(
              'C:\Program Files (x86)\WiX Toolset v3.14\bin',
              'C:\Program Files (x86)\WiX Toolset v3.11\bin'
            )
            $found = $false
            foreach ($dir in $candidates) {
              if (Test-Path "$dir\candle.exe") {
                "$dir" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
                Write-Host "WiX found at $dir — added to PATH"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Warning "WiX Toolset not found at known paths — MSI artifact will not be produced"
            }
          }
        shell: "pwsh"
      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          "cache": "npm"
          "cache-dependency-path": "frontend/package-lock.json"
          "node-version": 22
      - name: "Build the SPA bundle for embedding"
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          rm -rf engine/crates/vaultspec-api/assets/spa
          mkdir -p engine/crates/vaultspec-api/assets
          cp -r frontend/dist engine/crates/vaultspec-api/assets/spa
        shell: "bash"
      # `Install dist` writes into $HOME, and on a containerised runner the
      # image's HOME belongs to another user: the aarch64-unknown-linux-gnu leg
      # of v0.1.5 and v0.1.6 both died on `mkdir: cannot create directory
      # '/home/runner/.config/fish': Permission denied` before building
      # anything. Only redirect when HOME is genuinely unwritable, so an
      # ordinary runner keeps its own caches.
      - name: Give the job a writable HOME (containerised runners only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Probe the EXACT path the installer needs, not its parent.
          # `mkdir -p` on an existing directory returns 0 whatever its
          # permissions, and /home/runner/.config DOES exist on the container -
          # which is why the failure names `.config/fish` and not `.config`. So
          # `mkdir -p "$HOME/.config"` succeeds, the redirect is skipped, and
          # `Install dist` dies on the same line as v0.1.5 and v0.1.6.
          # cargo-dist-installer.sh v0.32.0 line 957 runs exactly this mkdir, so
          # probe and prediction cannot disagree. Creating it early is harmless:
          # the installer's own mkdir -p is then a no-op.
          if [ -n "${HOME:-}" ] && mkdir -p "$HOME/.config/fish/conf.d" 2>/dev/null; then
            echo "HOME is writable at $HOME"
          else
            writable="$RUNNER_TEMP/home"
            mkdir -p "$writable"
            echo "HOME=$writable" >> "$GITHUB_ENV"
            echo "::warning::HOME (${HOME:-unset}) is not writable on this runner - redirecting to $writable for this job"
            # A redirected HOME must not take the toolchain with it. rustup and
            # cargo live under the ORIGINAL home, and dist resolves cargo through
            # them, so moving HOME alone makes the build fail later with
            # `cargo, required to run this task, is missing` - one step further
            # on than the failure this redirect exists to fix, which is a worse
            # place to discover it. Pin both homes to where the toolchain
            # actually is, and keep its bin dir on PATH, unless the runner has
            # already set them.
            if [ -z "${CARGO_HOME:-}" ] && [ -d "${HOME:-}/.cargo" ]; then
              echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
            fi
            if [ -z "${RUSTUP_HOME:-}" ] && [ -d "${HOME:-}/.rustup" ]; then
              echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
            fi
            if [ -d "${CARGO_HOME:-$HOME/.cargo}/bin" ]; then
              echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            fi
          fi
      # The compile cache is wired as a RUSTC_WRAPPER at the runner level, so
      # cargo routes even its `rustc -vV` probe through it and the FIRST cargo
      # invocation dies if it cannot answer. merge-gate.yml has carried this
      # backstop since a squatted port broke the gate; the release lane needs it
      # for the same reason - a compile cache must never be able to block a
      # release. Probe it as cargo does; if it cannot answer, drop it and build
      # uncached rather than not building.
      - name: Verify the compile cache cannot block the release
        shell: bash
        run: |
          set +e
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "No RUSTC_WRAPPER on this runner - nothing to verify."
            exit 0
          fi
          probe=$("$RUSTC_WRAPPER" "$(rustup which rustc)" -vV 2>&1)
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "$probe"
            echo "::warning::Compile cache unreachable via $RUSTC_WRAPPER (exit $rc) - continuing WITHOUT it. The build is slower and complete."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          else
            echo "Compile cache reachable via $RUSTC_WRAPPER"
          fi
      - name: Install dist
        # dist plans this command from committed config; it is not user input.
        run: ${{ matrix.install_dist.run }} # zizmor: ignore[template-injection]
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: | # zizmor: ignore[template-injection] dist plans this from committed config
          ${{ matrix.packages_install }}
      # Both expansions come from the plan job: dist's argv for this leg, and
      # the release tag that job validated. They stay inline because this step
      # runs under both bash and pwsh, which split an env var differently.
      - name: Build artifacts
        run: | # zizmor: ignore[template-injection]
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f 'target/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf target engine/target 2>/dev/null || true
          fi
          # HAND THE TREE BACK. Since the Linux legs build inside a pinned
          # manylinux image, everything cargo writes is owned by the container's
          # root. The removal above only happens when the job FAILED, so a
          # SUCCESSFUL leg leaves engine/target root-owned - and the next job on
          # this shared machine is an ordinary non-root checkout that cannot
          # clean what it does not own. It dies in `actions/checkout` with
          # `EACCES: permission denied, unlink .../engine/target/...` and then
          # `fatal: not a git repository`.
          #
          # `--reference=/__w` copies the owner the runner itself uses rather
          # than naming a uid, and /__w exists only on a containerised job, so
          # this is a no-op on a normal runner.
          if [ -d /__w ]; then
            chown -R --reference=/__w "$GITHUB_WORKSPACE" 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force target, engine\target -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    name: "Build: Global artifacts (Linux)"
    timeout-minutes: 120
    needs:
      - plan
      - build-local-artifacts
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
  # Determines if we should publish/announce
  host:
    name: "Build: Release upload (Linux)"
    timeout-minutes: 120
    # The only job that writes to the release: it uploads to the draft.
    permissions:
      contents: write
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
    runs-on: [self-hosted, Linux, X64]
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Upload to the draft GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # The release stays a DRAFT here. Only the orchestrator publishes it,
          # and only after every gate has passed.
          gh release upload "${{ needs.plan.outputs.tag }}" artifacts/* --clobber

          # PRERELEASE_FLAG is deliberately UNQUOTED. It holds either
          # `--prerelease` or the empty string, and the empty case must expand to
          # NO argument at all; quoting it would hand `gh release edit` a literal
          # empty argument and break every stable (non-prerelease) release. This
          # is intentional word-removal, not an oversight — do not "fix" it.
          # shellcheck disable=SC2086
          gh release edit "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG
      # Hand-set for the self-hosted fleet; re-apply if `dist generate-ci` regenerates this file.
  # Hand-added; not produced by `dist generate-ci`. Re-apply if that regenerates
  # this file.
  #
  # `host` can succeed while uploading nothing - a build leg that produced no
  # archive, or a manifest that listed none - and a release that goes live in
  # that state is the empty `latest` v0.1.4 served for six weeks. This refuses
  # the run, so the orchestrator never publishes the draft.
  verify-release-assets:
    timeout-minutes: 30
    name: "Check: Release archives attached (Linux)"
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      HOST_RESULT: ${{ needs.host.result }}
    steps:
      - name: Require artifacts on the draft release
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[] | select(.name | startswith("vaultspec-cli-"))] | length')
          echo "release ${TAG} carries ${assets} CLI archive asset(s); host=${HOST_RESULT}"
          if [ "$HOST_RESULT" = "success" ] && [ "$assets" -gt 0 ]; then
            exit 0
          fi
          echo "::error::${TAG} carries ${assets} CLI archive(s) (host=${HOST_RESULT}); the draft must not be published."
          exit 1
