# Post-announce scoop-manifest bump: dist calls
# this AFTER the GitHub Release publishes (`post-announce-jobs` in
# dist-workspace.toml). `scoop update` reads the COMMITTED manifest — scoop's
# checkver/autoupdate stanzas only serve maintainer tooling — so each release
# must land one bump commit. The released tag is read from the dist plan
# (passed as the `plan` workflow_call input); the hash comes from the
# published per-asset .sha256. The commit type is changelog-hidden (`chore`)
# so release-please treats it as noise.
#
# Recovery note: if a post-release PR merge clobbers the bump commit (a
# long-lived branch whose manifest commit predates the bump is merged
# without rebasing), the bucket silently regresses. Recover by triggering this
# workflow via workflow_dispatch with the plan JSON from the release run's
# "plan" artifact (copy the `manifest` output field).

name: scoop-bump

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      plan:
        description: 'dist manifest JSON from the release run (plan artifact manifest field)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: scoop-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail-closed publication gate. The Scoop manifest bump is a
  # PUBLICATION act, so it must not proceed until the Scoop channel has earned
  # publication per the support matrix + phase-zero reversibility proof. Today
  # this fails closed (matrix marks scoop `feasibility_gated`), which is the
  # correct honest state until the phase-zero proof flips it to `supported`.
  gate:
    uses: ./.github/workflows/channel-publish-gate.yml
    with:
      channel: scoop

  bump:
    needs: gate
    runs-on: [self-hosted, Linux, X64]
    steps:
      # The channel root is an ORGANISATION resource, not a per-repo one. A
      # package manager resolves ONE bucket for all of nevenincs, so a manifest
      # committed to this repository's own `bucket/` is published nowhere a
      # user's Scoop can see. Check out the org distribution repo and commit
      # there. The deploy key authenticates that push; the checkout below is
      # the only writable handle this job has on the channel root.
      - uses: actions/checkout@v6
        with:
          repository: nevenincs/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}
      - name: Bump the org bucket manifest to the released version
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          TAG=$(printf '%s' "$PLAN" | jq -r '.announcement_tag')
          VERSION="${TAG#v}"
          # Bump to the COMPLETE product archive (the whole offline
          # tree), never the binary-only vaultspec-cli archive.
          ASSET="vaultspec-${VERSION}-x86_64-pc-windows-msvc.zip"
          # The manifest is generated from scratch below, so its prose lives
          # here rather than surviving in a committed file nobody re-reads.
          DESCRIPTION="The complete vaultspec dashboard product: the dashboard, the copied external updater, the bundled A2A runtime, and the signed release manifest, licenses, and SBOM - installed as one offline-complete tree. Only the vaultspec dashboard command is shimmed onto PATH; the companion files stay in the install directory."
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          HASH=$(curl --proto '=https' --tlsv1.2 -sSfL "${URL}.sha256" | cut -d' ' -f1)
          # One check per line, deliberately. Written as
          # `test -n "$A" && test -n "$B"`, this guard does NOT trip `set -e`:
          # bash exempts every command in an && list except the one following
          # the final &&, so a failure in any earlier position is ignored.
          # That exact shape let vaultspec-core-v0.1.60 publish a Scoop
          # manifest with empty hashes out of a green run. The digest
          # comparison below would also catch an empty HASH here, but a guard
          # that does not guard is worth removing rather than leaning on the
          # backstop that happens to sit behind it.
          : "${VERSION:?refusing to bump: no version parsed from the tag}"
          : "${HASH:?refusing to bump: no digest fetched from the sidecar}"
          # Verify the published digest: download the archive and confirm its own
          # SHA-256 matches the sibling .sha256, so a corrupt or mismatched asset
          # never lands in the manifest.
          curl --proto '=https' --tlsv1.2 -sSfL "$URL" -o /tmp/complete.zip
          ACTUAL=$(sha256sum /tmp/complete.zip | cut -d' ' -f1)
          if [ "$ACTUAL" != "$HASH" ]; then
            echo "complete archive digest mismatch: sidecar ${HASH}, actual ${ACTUAL}"
            exit 1
          fi
          # Reversible downgrade: the url is version-parameterised and every bump is
          # its own commit, so `scoop install vaultspec@<older>` re-fetches that
          # version's complete archive from the retained release + git history — a
          # downgrade is always to a real, previously-published complete tree.
          # Guard: refuse to bump the manifest to a version older than what is
          # already committed. This catches the case where a stale branch merge
          # clobbered a prior bump and this job is re-run for an older release.
          # No manifest is committed until this job first succeeds (see
          # bucket/README.md), so an absent file is a first publication rather
          # than a regression and must not be read as version "null".
          if [ -f channels/bucket/vaultspec.json ]; then
            CURRENT_VERSION=$(jq -r '.version' channels/bucket/vaultspec.json)
            if [ "$(printf '%s\n' "$CURRENT_VERSION" "$VERSION" | sort -V | tail -1)" = "$CURRENT_VERSION" ] && \
               [ "$CURRENT_VERSION" != "$VERSION" ]; then
              echo "bucket is at ${CURRENT_VERSION}, refusing to bump backward to ${VERSION}"
              exit 1
            fi
          fi
          # Generated whole with `jq -n`, not rewritten in place. An in-place
          # edit needs a committed file to read, which no longer exists before
          # the first publication, and it is how a stale field survives a bump
          # unnoticed - the failure mode this repository shipped for four
          # releases.
          # The channel root may carry no bucket/ yet; a first publication must
          # be able to create the directory it publishes into.
          mkdir -p channels/bucket
          jq -n --arg v "$VERSION" --arg u "$URL" --arg h "$HASH" \
            --arg home "https://github.com/${GITHUB_REPOSITORY}" \
            --arg desc "$DESCRIPTION" \
            '{
              version: $v,
              description: $desc,
              homepage: $home,
              license: "MIT",
              url: $u,
              hash: $h,
              bin: "bin/vaultspec.exe",
              checkver: "github",
              autoupdate: {
                url: ($home + "/releases/download/v$version/vaultspec-$version-x86_64-pc-windows-msvc.zip"),
                hash: { url: "$url.sha256" }
              }
            }' > channels/bucket/vaultspec.json
          cd channels
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then ask whether anything changed. `git diff` reports
          # only TRACKED paths, so before the first publication - when the
          # manifest does not yet exist in the channel root - it sees no change
          # and this job exits zero having published nothing. Staging first
          # makes the first publication visible to the check.
          git add -- bucket/vaultspec.json
          if git diff --cached --quiet -- bucket/vaultspec.json; then
            echo "manifest already at ${VERSION}; nothing to bump"
            exit 0
          fi
          git commit -m "chore(scoop): bump vaultspec-dashboard manifest to ${TAG}"
          git push origin main
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -f /tmp/complete.zip 2>/dev/null || true
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1
