# Acquisition: prove the PUBLISHED binary loads on the platforms the README promises.
#
# Every other check in this repository reads the source tree. This one reads the
# release page - it downloads the asset a user would download, on a machine
# older than the one that built it, and asks the dynamic loader to accept it.
# That is the only question a build-side floor check cannot answer: the build
# environment enforces what the binary MAY require, and this enforces what a
# user's machine can actually run.
#
# v0.1.8 is why it exists. Its Linux binary required glibc 2.39, and measured
# against the distributions the README named as supported it loads on almost
# none of them:
#
#   almalinux:8           glibc 2.28   REJECTED  needs GLIBC_2.29 (libm)
#   ubuntu:22.04          glibc 2.35   REJECTED  needs GLIBC_2.39
#   debian:bookworm-slim  glibc 2.36   REJECTED  needs GLIBC_2.39
#   ubuntu:24.04          glibc 2.39   accepted
#
# Nothing reported that. The release was green, the assets attached, and the
# failure was reserved for whoever downloaded it - where it surfaces as the
# loader naming a missing symbol version, which reads like a corrupt download
# rather than an unsupported platform.
#
# NOT ON push OR pull_request, deliberately. There is nothing published to
# acquire for a branch, so a PR run could only ever test the PREVIOUS release
# and would fail on every PR until a new one was cut - a red check nobody can
# act on, which is a check people learn to ignore.
name: Acquisition

on:
  release:
    types: [published]
  # WEEKLY, because the answer can change without a release. Nothing in this
  # repository was scheduled before this - no workflow used `schedule` at all -
  # so every check here answered only for the commit that triggered it, and a
  # release that stopped being installable after it was published had nothing
  # watching. Three ways that happens without a commit: the release is yanked or
  # an asset renamed, so the download 404s; a container base image moves and the
  # floor we test against is no longer the floor we thought; or a published asset
  # is replaced in place. Both sibling projects run this weekly for the same
  # reason.
  #
  # Monday early, so a failure is waiting at the start of the week rather than
  # arriving during it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to acquire (defaults to the latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: acquisition-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    name: acquire ${{ matrix.arch }} on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # almalinux:8 IS THE FLOOR ITSELF - glibc 2.28 exactly, the same
          # version manylinux_2_28 provides. It is the only leg that can tell
          # the floor being met from the floor being exceeded by luck, so a
          # green run here is the whole claim and the others are breadth.
          - image: almalinux:8
            setup: dnf install -y -q tar xz
            arch: x86_64
            runner: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
          - image: almalinux:8
            setup: dnf install -y -q tar xz
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # The enterprise LTS releases the README names, which 2.39 excluded.
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: x86_64
            runner: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: x86_64
            runner: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    # The ARM legs run on the GitHub-hosted ARM64 runner, not the fleet's. The
    # fleet's ARM64 Linux runner is itself a colima container with no reachable
    # docker daemon, so a container job there dies in `Initialize containers`
    # before any step runs.
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install what acquisition itself needs
        shell: bash
        run: |
          set -eux
          ${{ matrix.setup }}

      # THE TRIPLE COMES FROM THE MATRIX AND IS PASSED THROUGH `env:`. Written
      # inline, the download URL would carry whichever triple was typed first,
      # and the aarch64 legs would quietly download the x86_64 archive onto an
      # ARM64 machine - where the loader rejects it for being the wrong
      # ARCHITECTURE while the job reports a glibc failure. The leg stays red,
      # so nothing looks broken, and it tests nothing.
      - name: Resolve the release and the asset this leg needs
        shell: bash
        env:
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
              | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)
          fi
          if [ -z "${tag}" ]; then
            echo "::error::could not determine a release tag to acquire" >&2
            exit 1
          fi
          archive="vaultspec-cli-${TRIPLE}.tar.xz"
          {
            echo "TAG=${tag}"
            echo "ARCHIVE=${archive}"
            echo "ASSET_URL=https://github.com/${REPO}/releases/download/${tag}/${archive}"
          } >> "$GITHUB_ENV"
          echo "resolved ${archive} on ${tag}"

      # `release: published` FIRES BEFORE THE ASSETS EXIST. The release object is
      # created and published by release-please; the archives are uploaded later
      # by the Release workflow's `host` job, which has to build four targets
      # first. So this workflow is started, by design, against a release that is
      # still empty.
      #
      # v0.1.9 is what that looks like. The release published at 23:58:15, this
      # workflow started at 23:58:16, and the Release run that would upload the
      # assets started at 23:58:17 - one second AFTER the consumer went looking
      # for its output. All three aarch64 legs failed on the download; the three
      # x86_64 legs had not been scheduled yet and so were never affected.
      #
      # That split is the tell, and it is worth stating because it looks like an
      # architecture bug and is not one: the aarch64 legs run on GitHub-hosted
      # runners and start immediately, while the x86_64 legs queue behind a
      # single self-hosted machine. The hosted legs lose the race precisely
      # BECAUSE they are fast. Whether this workflow passed would otherwise
      # depend on how deep the runner queue happened to be, which is not a
      # property of the release at all.
      #
      # WAIT ON THE ASSET ITSELF, not on a proxy for it. The condition this leg
      # depends on is "the file I am about to download is fetchable", so the
      # honest test is to ask for it - a ranged GET of the first byte, through
      # the real download URL, following the same redirect the download follows.
      # Waiting on the Release workflow's run status instead would be a proxy
      # that can report success before an upload is visible, and a fixed sleep
      # answers a question nobody asked. A sibling project reached this the long
      # way, through two proxies that each passed while the artefact was still
      # unresolvable.
      #
      # THE BUDGET RUNNING OUT IS A FAILURE, not a skip. An asset that never
      # arrives means publication did not complete or the release is genuinely
      # bad, and both are things this workflow exists to report. The message
      # names the asset so the leg cannot be misread as a timeout in the check.
      - name: Wait for the asset to be published
        shell: bash
        run: |
          set -u
          # Long enough to cover a full four-target release build on a queue this
          # workflow does not control. The reported duration is MEASURED rather
          # than restated from this constant, so the message cannot drift out of
          # agreement with the budget it describes.
          budget=2700
          started=$(date +%s)
          deadline=$(( started + budget ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --range 0-0 "${ASSET_URL}" 2>/dev/null || echo "000")
            # 206 for a served range, 200 for a server that ignores Range.
            if [ "${code}" = "206" ] || [ "${code}" = "200" ]; then
              echo "${ARCHIVE} is published (HTTP ${code}, attempt ${attempt})"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              waited=$(( ($(date +%s) - started) / 60 ))
              echo "::error::${ARCHIVE} never appeared on ${TAG} (last HTTP ${code}, ${attempt} attempts over ${waited}m). Either the Release workflow did not finish uploading it, or this release does not carry it." >&2
              exit 1
            fi
            echo "waiting for ${ARCHIVE} on ${TAG} (HTTP ${code}, attempt ${attempt})"
            sleep 30
          done

      - name: Acquire the published archive
        shell: bash
        run: |
          set -euo pipefail
          echo "acquiring ${ARCHIVE} from ${TAG}"
          mkdir -p /opt/acq
          curl -fsSL -o "/opt/acq/${ARCHIVE}" "${ASSET_URL}"
          tar -xf "/opt/acq/${ARCHIVE}" -C /opt/acq
          # The archive expands into a directory named for the asset; the binary
          # inside is plainly `vaultspec`, which is what a user ends up running.
          find /opt/acq -type f -name vaultspec -exec cp {} /opt/acq/vaultspec \; -quit
          chmod +x /opt/acq/vaultspec
          test -x /opt/acq/vaultspec

      # `ldd` exiting 0 is not sufficient on its own: it reports a missing
      # symbol version on stdout and still exits 0 on some distributions, which
      # is exactly how a floor regression would pass a laxer check. Both the
      # exit status AND the absence of `not found` are asserted.
      - name: The loader must accept it
        shell: bash
        run: |
          set -u
          # Probed in two steps, not one pipeline. `ldd --version | head -1`
          # kills ldd with SIGPIPE, so under `pipefail` the substitution reports
          # failure even though it captured the version - and a `|| echo
          # unknown` fallback then appends to a value that was already correct,
          # putting "2.28\nunknown" into the error message a reader has to trust.
          glibc_line=$(ldd --version 2>/dev/null | head -1 || true)
          glibc=$(printf '%s' "${glibc_line}" | grep -oE '[0-9]+\.[0-9]+$' || echo "unknown")
          echo "container glibc: ${glibc}"
          if ! out=$(ldd /opt/acq/vaultspec 2>&1); then
            echo "${out}"
            echo "::error::the loader rejected vaultspec on ${{ matrix.image }} (glibc ${glibc})" >&2
            exit 1
          fi
          if printf '%s' "${out}" | grep -q 'not found'; then
            printf '%s' "${out}" | grep 'not found'
            echo "::error::vaultspec does not load on ${{ matrix.image }} (glibc ${glibc}): a required symbol version is missing" >&2
            exit 1
          fi
          echo "vaultspec loads on ${{ matrix.image }} (glibc ${glibc})"

      # A binary can satisfy the loader and still be unable to start. `--version`
      # is the cheapest real execution the CLI offers - it prints and exits
      # without touching a worktree, a seat, or the network. Only a LOADER
      # diagnostic fails the leg: anything else this early is a product bug for
      # another workflow, and acquisition should not be the job that reports it.
      - name: It must also run
        shell: bash
        run: |
          set -u
          if out=$(/opt/acq/vaultspec --version 2>&1); then
            echo "${out}"
            exit 0
          fi
          echo "${out}"
          if printf '%s' "${out}" | grep -Eq 'GLIBC_|not found|cannot execute|No such file or directory'; then
            echo "::error::vaultspec could not start on ${{ matrix.image }} for a loader reason" >&2
            exit 1
          fi
          echo "::warning::vaultspec --version exited non-zero for a non-loader reason; acquisition covers the loader only"
