# Acquisition: prove the PUBLISHED binary loads on the platforms the README promises.
#
# Every other check in this repository reads the source tree. This one reads the
# release page - it downloads the asset a user would download, on a machine
# older than the one that built it, and asks the dynamic loader to accept it.
# That is the only question a build-side floor check cannot answer: the build
# environment enforces what the binary MAY require, and this enforces what a
# user's machine can actually run.
#
# v0.1.8 is why it exists. Its Linux binary required glibc 2.39, and measured
# against the distributions the README named as supported it loads on almost
# none of them:
#
#   almalinux:8           glibc 2.28   REJECTED  needs GLIBC_2.29 (libm)
#   ubuntu:22.04          glibc 2.35   REJECTED  needs GLIBC_2.39
#   debian:bookworm-slim  glibc 2.36   REJECTED  needs GLIBC_2.39
#   ubuntu:24.04          glibc 2.39   accepted
#
# Nothing reported that. The release was green, the assets attached, and the
# failure was reserved for whoever downloaded it - where it surfaces as the
# loader naming a missing symbol version, which reads like a corrupt download
# rather than an unsupported platform.
#
# NOT ON push OR pull_request, deliberately. There is nothing published to
# acquire for a branch, so a PR run could only ever test the PREVIOUS release
# and would fail on every PR until a new one was cut - a red check nobody can
# act on, which is a check people learn to ignore.
name: Acquisition

on:
  # TRIGGERED BY THE PRODUCER FINISHING, not by the release being created.
  #
  # `release: published` fires when release-please publishes the release object,
  # which is BEFORE the Release workflow has built or uploaded anything. On
  # v0.1.9 that ordering was: release published at 23:58:15, this workflow
  # started at 23:58:16, and the run that uploads the assets started at
  # 23:58:17. The consumer went looking one second before the producer began.
  #
  # Waiting on the asset (below) fixes the correctness of that, but not the
  # cost: on this fleet the Release run can sit QUEUED for hours behind one
  # self-hosted machine, so a wait long enough to be reliable is a wait long
  # enough to be useless, and a check that goes red on every release because of
  # queue depth is a check people stop reading.
  #
  # So the trigger waits for Release to COMPLETE, and the asset probe below
  # still decides whether to proceed. The `workflow_run` event is only choosing
  # WHEN TO START LOOKING; it is never the authority on whether the artefact is
  # there. That distinction is the whole design - a proxy used as a scheduler is
  # sound, a proxy used as evidence is not.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # WEEKLY, because the answer can change without a release. Nothing in this
  # repository was scheduled before this - no workflow used `schedule` at all -
  # so every check here answered only for the commit that triggered it, and a
  # release that stopped being installable after it was published had nothing
  # watching. Three ways that happens without a commit: the release is yanked or
  # an asset renamed, so the download 404s; a container base image moves and the
  # floor we test against is no longer the floor we thought; or a published asset
  # is replaced in place. Both sibling projects run this weekly for the same
  # reason.
  #
  # Monday early, so a failure is waiting at the start of the week rather than
  # arriving during it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to acquire (defaults to the latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: acquisition-${{ github.event.workflow_run.head_branch || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    name: acquire ${{ matrix.arch }} on ${{ matrix.image }}
    # A FAILED Release IS NOT THIS WORKFLOW'S FINDING TO REPORT. `workflow_run`
    # fires on completion whatever the conclusion, so without this gate a
    # Release that failed to build would be followed by six legs reporting that
    # an asset "never appeared" - attributing a build failure to distribution,
    # in six red legs, next to the one red run that already said it properly.
    # A release whose build failed has no assets by definition, and
    # `verify-release-assets` in release.yml is what reports an empty release.
    # The schedule and manual dispatch are unaffected, which is what keeps a
    # deliberate look at a known-bad release available.
    #
    # AND ONLY FOR A TAG'S RUN. `workflow_run` fires for EVERY Release run,
    # including the ones dist executes on pull-request branches, which publish
    # nothing. On v0.1.10 that is exactly what happened: the Release run for
    # branch `fix/breadcrumb-waits-for-the-listing` completed at 05:22:46, this
    # workflow started at 05:22:48, and it then hunted for assets on v0.1.10
    # whose upload job did not even START until 05:55. All six Linux legs failed
    # on `never appeared ... (last HTTP 404, 21 attempts over 10m)` -- a red that
    # says nothing about the release and everything about which run woke it.
    #
    # A tag-triggered run carries the tag in `head_branch`, so requiring the `v`
    # prefix keeps the producer-finished design while discarding the runs that
    # produce no release. Schedule and manual dispatch are unaffected.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # almalinux:8 IS THE FLOOR ITSELF - glibc 2.28 exactly, the same
          # version manylinux_2_28 provides. It is the only leg that can tell
          # the floor being met from the floor being exceeded by luck, so a
          # green run here is the whole claim and the others are breadth.
          - image: almalinux:8
            setup: dnf install -y -q tar xz
            arch: x86_64
            runner: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
          - image: almalinux:8
            setup: dnf install -y -q tar xz
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # The enterprise LTS releases the README names, which 2.39 excluded.
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: x86_64
            runner: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: x86_64
            runner: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq curl xz-utils
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    # The ARM legs run on the GitHub-hosted ARM64 runner, not the fleet's. The
    # fleet's ARM64 Linux runner is itself a colima container with no reachable
    # docker daemon, so a container job there dies in `Initialize containers`
    # before any step runs.
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install what acquisition itself needs
        shell: bash
        run: |
          set -eux
          ${{ matrix.setup }}

      # THE TRIPLE COMES FROM THE MATRIX AND IS PASSED THROUGH `env:`. Written
      # inline, the download URL would carry whichever triple was typed first,
      # and the aarch64 legs would quietly download the x86_64 archive onto an
      # ARM64 machine - where the loader rejects it for being the wrong
      # ARCHITECTURE while the job reports a glibc failure. The leg stays red,
      # so nothing looks broken, and it tests nothing.
      - name: Resolve the release and the asset this leg needs
        shell: bash
        env:
          REPO: ${{ github.repository }}
          # For a Release run started by a tag push, `head_branch` carries the
          # TAG, which is the release this acquisition is about. It is remote
          # input either way, so it is shape-checked below before it reaches a
          # URL rather than trusted for being ours.
          EVENT_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          # A Release run can be started by something other than a tag push - a
          # dispatch, or a pull request under `pr-run-mode` - and then
          # `head_branch` is a branch name, not a release. Falling back to the
          # latest release is right for those: it is the release a user would
          # get today, which is the thing worth proving loads.
          #
          # Character check FIRST, shape check second, and the order is the
          # point. A shell glob's `*` matches slashes and dots, so a version
          # shape alone admits `v0.1.9/../../x` - which is a path traversal into
          # a URL this step is about to build. Rejecting anything outside the
          # safe set closes that before the shape is even considered.
          case "${tag}" in
            *[!0-9A-Za-z.+-]*) tag="" ;;
          esac
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) tag="" ;;
          esac
          if [ -z "${tag}" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
              | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)
          fi
          if [ -z "${tag}" ]; then
            echo "::error::could not determine a release tag to acquire" >&2
            exit 1
          fi
          archive="vaultspec-cli-${TRIPLE}.tar.xz"
          {
            echo "TAG=${tag}"
            echo "ARCHIVE=${archive}"
            echo "ASSET_URL=https://github.com/${REPO}/releases/download/${tag}/${archive}"
          } >> "$GITHUB_ENV"
          echo "resolved ${archive} on ${tag}"

      # ASK FOR THE ASSET, do not infer it. The trigger established that the
      # producer finished; it did not establish that this file exists. A green
      # Release that uploaded nothing looks identical, from the trigger's side,
      # to one that uploaded everything - and an empty release is precisely what
      # this workflow is here to catch rather than assume away.
      #
      # The condition each leg depends on is "the file I am about to download is
      # fetchable", so the test is to ask for it: a ranged GET of the first byte,
      # through the real download URL, following the same redirect the download
      # follows. Not a HEAD against a different path, not a listing that agrees
      # with it, not a sleep. A sibling project arrived here the long way,
      # through two proxies that each reported success while the artefact was
      # still unresolvable.
      #
      # One thing this must never do is fail per-architecture for a reason that
      # is not architectural. Before the trigger changed, the aarch64 legs failed
      # this download while the x86_64 legs did not - not because of the
      # binaries, but because the aarch64 legs run on hosted runners and start
      # immediately while the x86_64 legs queue behind one self-hosted machine.
      # The hosted legs lost the race by being fast. Any future change here
      # should keep the timing question separate from the loader question below,
      # so a scheduling artefact can never be read as a floor regression.
      #
      # THE BUDGET RUNNING OUT IS A FAILURE, not a skip. An asset that never
      # arrives means publication did not complete or the release is genuinely
      # bad, and both are things this workflow exists to report. The message
      # names the asset so the leg cannot be misread as a timeout in the check.
      - name: Wait for the asset to be published
        shell: bash
        run: |
          set -u
          # A BACKSTOP FOR VISIBILITY LAG, not a wait for the build. The trigger
          # already waits for Release to finish, so by the time this runs the
          # upload has happened and the only gap left is the seconds between an
          # upload completing and the asset being fetchable. Ten minutes is
          # generous for that and short enough that a genuine absence is
          # reported promptly rather than after most of an hour.
          #
          # It is deliberately still here. The trigger says the producer
          # finished; only this says the artefact exists, and a green Release
          # that uploaded nothing is exactly the failure this must catch rather
          # than infer away.
          #
          # The reported duration is MEASURED rather than restated from this
          # constant, so the message cannot drift out of agreement with it.
          budget=600
          started=$(date +%s)
          deadline=$(( started + budget ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            # `-w` writes the status itself, including `000` when the request
            # never got one, so curl's exit status is not consulted. An earlier
            # `|| echo "000"` did consult it and CONCATENATED onto what -w had
            # already written, reporting "HTTP 206000" for a perfectly good 206.
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --range 0-0 "${ASSET_URL}" 2>/dev/null)
            [ -n "${code}" ] || code="000"
            # 206 for a served range, 200 for a server that ignores Range.
            if [ "${code}" = "206" ] || [ "${code}" = "200" ]; then
              echo "${ARCHIVE} is published (HTTP ${code}, attempt ${attempt})"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              waited=$(( ($(date +%s) - started) / 60 ))
              echo "::error::${ARCHIVE} never appeared on ${TAG} (last HTTP ${code}, ${attempt} attempts over ${waited}m). Either the Release workflow did not finish uploading it, or this release does not carry it." >&2
              exit 1
            fi
            echo "waiting for ${ARCHIVE} on ${TAG} (HTTP ${code}, attempt ${attempt})"
            sleep 30
          done

      - name: Acquire the published archive
        shell: bash
        run: |
          set -euo pipefail
          echo "acquiring ${ARCHIVE} from ${TAG}"
          mkdir -p /opt/acq
          curl -fsSL -o "/opt/acq/${ARCHIVE}" "${ASSET_URL}"
          tar -xf "/opt/acq/${ARCHIVE}" -C /opt/acq
          # The archive expands into a directory named for the asset; the binary
          # inside is plainly `vaultspec`, which is what a user ends up running.
          find /opt/acq -type f -name vaultspec -exec cp {} /opt/acq/vaultspec \; -quit
          chmod +x /opt/acq/vaultspec
          test -x /opt/acq/vaultspec

      # `ldd` exiting 0 is not sufficient on its own: it reports a missing
      # symbol version on stdout and still exits 0 on some distributions, which
      # is exactly how a floor regression would pass a laxer check. Both the
      # exit status AND the absence of `not found` are asserted.
      - name: The loader must accept it
        shell: bash
        run: |
          set -u
          # Probed in two steps, not one pipeline. `ldd --version | head -1`
          # kills ldd with SIGPIPE, so under `pipefail` the substitution reports
          # failure even though it captured the version - and a `|| echo
          # unknown` fallback then appends to a value that was already correct,
          # putting "2.28\nunknown" into the error message a reader has to trust.
          glibc_line=$(ldd --version 2>/dev/null | head -1 || true)
          glibc=$(printf '%s' "${glibc_line}" | grep -oE '[0-9]+\.[0-9]+$' || echo "unknown")
          echo "container glibc: ${glibc}"
          if ! out=$(ldd /opt/acq/vaultspec 2>&1); then
            echo "${out}"
            echo "::error::the loader rejected vaultspec on ${{ matrix.image }} (glibc ${glibc})" >&2
            exit 1
          fi
          if printf '%s' "${out}" | grep -q 'not found'; then
            printf '%s' "${out}" | grep 'not found'
            echo "::error::vaultspec does not load on ${{ matrix.image }} (glibc ${glibc}): a required symbol version is missing" >&2
            exit 1
          fi
          echo "vaultspec loads on ${{ matrix.image }} (glibc ${glibc})"

      # A binary can satisfy the loader and still be unable to start. `--version`
      # is the cheapest real execution the CLI offers - it prints and exits
      # without touching a worktree, a seat, or the network. Only a LOADER
      # diagnostic fails the leg: anything else this early is a product bug for
      # another workflow, and acquisition should not be the job that reports it.
      - name: It must also run
        shell: bash
        run: |
          set -u
          if out=$(/opt/acq/vaultspec --version 2>&1); then
            echo "${out}"
            exit 0
          fi
          echo "${out}"
          if printf '%s' "${out}" | grep -Eq 'GLIBC_|not found|cannot execute|No such file or directory'; then
            echo "::error::vaultspec could not start on ${{ matrix.image }} for a loader reason" >&2
            exit 1
          fi
          echo "::warning::vaultspec --version exited non-zero for a non-loader reason; acquisition covers the loader only"

      # HAND THE WORKSPACE BACK. These legs run a container on the shared
      # self-hosted runner, so every file the job touches ends up owned by the
      # container's root. The next job scheduled on that machine is a normal
      # non-root checkout, and it cannot clean what it does not own: it dies in
      # `actions/checkout` with `EACCES: permission denied, unlink
      # .../engine/target/...` and then `fatal: not a git repository`.
      #
      # That is not hypothetical. The v0.1.9 acquisition run left the workspace
      # root-owned at 23:58 and unrelated jobs on the same runner failed that
      # way from 00:40 — three checks on a workflow-only PR, none of them caused
      # by its diff.
      #
      # `--reference=/__w` copies the owner the runner itself uses rather than
      # naming a uid, so it is correct on any host in the fleet. `always()`
      # because a failed leg poisons the workspace exactly as a passing one does,
      # and `|| true` because failing to tidy up must not turn a green
      # acquisition red.
      - name: Return the workspace to the runner's user
        if: always()
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE" || true
