# Rendered from dev/devserver.py by the devservers repository (`just sync`) and
# identical in every enrolled repo; `just dev check` fails when it drifts.
name: Dev server
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devserver:
    name: 'Check: Dev server'
    # A pull request runs on the self-hosted fleet only from this repository
    # and only by the owner or a collaborator: Dependabot and other authors
    # push branches here too, and the fork refusal never stops them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          prune-cache: false
      - run: just dev ci
