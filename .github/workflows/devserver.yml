# Rendered from dev/devserver.py by the devservers repository (`just sync`) and
# identical in every enrolled repo; `just dev check` fails when it drifts.
name: Dev server
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devserver:
    name: 'Check: Dev server'
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.user.login == 'nevenincs-release[bot]') &&
      ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
      github.event.sender.type == 'User') ||
      github.event.pull_request.draft == false))
    runs-on: [self-hosted, Linux, X64]
    # The fleet admits this job inside it, so the timeout covers up to two hours
    # of waiting for the host as well as the 20-minute budget its steps get.
    timeout-minutes: 140
    env:
      CI_EXEC_BUDGET_MINUTES: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          prune-cache: false
      - run: just dev ci
