name: Windows compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-main-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Main Windows compatibility
    timeout-minutes: 60
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68
        with:
          tool: just@1.38.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - name: Initialize dependencies
        run: just init
      - name: Put vaultspec-core on PATH
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Link every shipped MSVC binary and resource
        run: just build-rust
      - name: Native Windows runtime and integration tests
        run: just test-rust
      - name: Reclaim runner disk
        if: always()
        shell: pwsh
        run: |
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
