# Engine workspace CI: build, lint, test on every push
# and pull request touching the engine or its toolchain.

name: engine-ci

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # Architecture is selected explicitly, not left to the OS label. Two Linux
    # runners are registered — one x86-64, one ARM64 — and both carry the
    # auto-assigned `Linux` label, so a bare `runs-on: Linux` would dispatch to
    # either one nondeterministically. This job is not architecture-specific,
    # but it must still land somewhere predictable.
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, arch: X64 }
          - { os: Windows, arch: X64 }
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      # Pin CI to the repo toolchain (engine/rust-toolchain.toml) instead of
      # floating stable: the action exports RUSTUP_TOOLCHAIN, which overrides
      # the file, so the pin must be read and passed explicitly
      # (dashboard-packaging reproducibility fix).
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Build reuse on the persistent runners comes from the runner-level shared
      # cargo target directory, NOT from an uploaded cache: a checkout cleans the
      # workspace (ignored files included), so a workspace-local `engine/target`
      # never survives a run, while a shared directory outside the workspace
      # does. Report which one is in force — a "not found" or an unexpected full
      # rebuild is otherwise undiagnosable on a runner nobody can shell into.
      - name: Report the build output directory
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps \
            | sed -n 's/.*"target_directory":"\([^"]*\)".*/cargo builds into: \1/p'
          if [ -z "${CARGO_TARGET_DIR:-}" ]; then
            echo "::warning::CARGO_TARGET_DIR is unset on this runner, so builds land inside the workspace and the next checkout cleans them — every run rebuilds from scratch"
          fi
      # A compile cache must never be able to block the gate. sccache is wired in
      # as a RUSTC_WRAPPER at the runner level, so cargo routes even its
      # `rustc -vV` probe through it: if the sccache server is unreachable the
      # FIRST cargo invocation dies and nothing compiles. Not hypothetical — on
      # 2026-07-31 WSL's localhost relay (wslrelay.exe) held sccache's default
      # port 4226 on the Windows runner, and every Rust step failed with
      # "failed to fill whole buffer" before a single crate was checked. The
      # server port is now pinned away from the contended range in the runner
      # environment; this step is the backstop. Probe the wrapper exactly the way
      # cargo does, and if it cannot answer, drop the wrapper for the rest of the
      # job so the gate still runs — uncached and loudly warned, never skipped.
      #
      # `sccache --show-stats` is NOT a usable health check: against a squatted
      # port it exits 0 and prints default-valued stats without ever reaching a
      # server. Only the real wrapper invocation distinguishes the two.
      - name: Verify the compile cache cannot block the gate
        shell: bash
        run: |
          set +e
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo "No RUSTC_WRAPPER on this runner — nothing to verify."
            exit 0
          fi
          probe=$("$RUSTC_WRAPPER" "$(rustup which rustc)" -vV 2>&1)
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "$probe"
            echo "::warning::Compile cache unreachable on port ${SCCACHE_SERVER_PORT:-4226} (exit $rc) — continuing WITHOUT it. Builds are slower; clippy and the tests still run in full."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          else
            echo "Compile cache reachable on port ${SCCACHE_SERVER_PORT:-4226} via $RUSTC_WRAPPER"
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      # The e2e + declared-tier integration tests spawn `vaultspec-core` from
      # PATH (the engine shells out to it for the declared tier); install it so
      # those tests run for real instead of failing with "program not found".
      # `astral-sh/setup-uv` is a Node action, and on the Windows runner it
      # aborts during TEARDOWN with a libuv assertion
      # (!(handle->flags & UV_HANDLE_CLOSING), src\win\async.c:94) AFTER it has
      # logged "Successfully installed uv". The step therefore fails having done
      # its job, and takes the whole gate with it — observed on 2 of 3 runs, so
      # frequent rather than rare. Both runners are provisioned with uv already
      # (Windows 0.12.0, Linux 0.11.29), so the action bought nothing and cost
      # the gate. Assert the tool instead of installing it, and fail loudly if a
      # runner is ever missing it rather than silently skipping the e2e
      # dependency below.
      - name: Require uv on the runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            echo "::error::uv is not on PATH for this runner. It is expected to be provisioned on the fleet; this workflow deliberately no longer installs it via a Node action that crashes on teardown." >&2
            exit 1
          fi
          uv --version
      - name: Install vaultspec-core (e2e + declared-tier dependency)
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Test (unit + integration + e2e + bench)
        run: cargo test --workspace
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force engine\target, frontend\node_modules -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
