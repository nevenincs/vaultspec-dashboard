# The release orchestrator: measure the tagged tree, build and verify every
# release artifact, and only then let the release be seen.
#
# THE ORDERING IS THE CONTRACT. release-please creates the release as a DRAFT
# with its tag and dispatches this workflow at that tag. From there:
#
#   1. Check    - the ref is the tag, and the tagged tree passes the full merge
#                 gate (the same job set that guards `main`), while a watchdog
#                 over this run's own jobs cancels it if the work cannot start.
#   2. Build    - the dist CLI archives (release.yml) and the complete product
#                 tree per target, both uploaded to the DRAFT.
#   3. Check    - every leg extracts its archive and runs the shipped verifier
#                 and executable natively; then the cohort digest, the Python
#                 harness on both supported versions, the draft carrying
#                 archives, and the phase-zero channel feasibility proof.
#   4. Publish  - the draft becomes a PRERELEASE: public, installable by tag,
#                 and not `latest`.
#   5. Test     - acquisition downloads the published binaries on the oldest
#                 supported loaders.
#   6. Promote  - only now does the release become `latest`.
#   7. Channels - Homebrew and Scoop publish, each behind its own fail-closed
#                 publication gate.
#
# A failure before step 4 leaves an invisible draft; a failure at step 5 leaves
# a prerelease that `latest` never points at. The previous ordering published
# first and gated afterwards, which shipped v0.1.5 through v0.1.12 public with
# their channel gates red.
#
# This workflow is SEPARATE from the dist-generated release.yml, which it calls
# for the CLI archives; Dist is retained only for target planning, checksums and
# those archives. The product tree is composed here: per target it builds the
# dashboard + copied updater and runs `product-build` to compose and
# self-verify the tree, archived as `vaultspec-<version>-<target>.{tar.gz,zip}`
# with a sibling `.sha256`.
#
# The A2A runtime is deliberately NOT built or bundled here. The compose step
# below carries the reason and the condition that brings it back; read it there
# before adding a freeze leg to this workflow.
#
# Runners are selected by OS *and* architecture because every release member is
# extracted, verified, and launched on its declared native target. An OS-only
# selector could place an ARM artifact on x86-64 (or the reverse) and produce no
# valid runtime evidence.

name: Dashboard Release

on:
  # Dispatched by release-please with `--ref <tag>`, or by hand the same way:
  #   gh workflow run product-release.yml --ref v0.1.13 -f tag=v0.1.13
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.13). Dispatch with --ref set to the same tag."
        required: true
        type: string
      validation_only:
        description: "Build and validate the release artifacts without touching the release"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dashboard-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Everything below trusts that the checked-out tree IS the tag, and that the
  # tag has an unpublished release to fill. Prove both before any runner is
  # spent on a build.
  prove-ref:
    name: "Check: Prove ref commit (Linux)"
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prove.outputs.version }}
    steps:
      - name: The run is at the tag, and the tag has an unpublished release
        id: prove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          set -euo pipefail
          # Strict, because the version derived from this tag reaches later
          # scripts: a glob would admit shell metacharacters between the digits.
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${TAG}' is not a release tag (v<major>.<minor>.<patch>[-pre])" >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/tags/${TAG}" ]; then
            echo "::error::this run is at ${GITHUB_REF}, not refs/tags/${TAG}. Dispatch with --ref ${TAG} so every checkout is the tagged tree." >&2
            exit 1
          fi
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          if [ "${tagged}" != "${GITHUB_SHA}" ]; then
            echo "::error::${TAG} resolves to ${tagged}, but this run is at ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ "${VALIDATION_ONLY}" = "true" ]; then
            echo "validation run: ${TAG} at ${tagged}; the release object is not read or changed"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A held prerelease is re-runnable: that is the state a failed
          # acquisition leaves, and a re-run after the fix must be able to
          # promote it. A release that is already fully public is not.
          state=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease \
            --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "published" end')
          echo "release ${TAG} at ${tagged} is ${state}"
          if [ "${state}" = "published" ]; then
            echo "::error::${TAG} is already published; the release chain only fills a draft or re-runs a held prerelease" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # The tagged tree passes the same full job set that guards `main`.
  merge-gate:
    name: "Check: Merge gate (Linux)"
    needs: prove-ref
    uses: ./.github/workflows/merge-gate.yml
    permissions:
      checks: read
      contents: read
      pull-requests: write

  # A job dispatched to a selector with no ONLINE runner does not fail: it
  # QUEUES, and `timeout-minutes` bounds how long a job RUNS, not how long it
  # waits to start. v0.1.9 spent 4h46m that way while the release served as
  # `latest` with no assets attached, and GitHub then reports `cancelled`,
  # which is not red anywhere.
  #
  # This watchdog reads THIS RUN's own jobs - the work this repository asked
  # for - and never the fleet's inventory. When a job is still queued after the
  # budget, it cancels the run so the outcome is a bounded, legible failure
  # instead of a day of silence.
  queue-watchdog:
    name: "Check: Queue watchdog (Linux)"
    timeout-minutes: 90
    needs: prove-ref
    runs-on: [self-hosted, Linux, X64]
    permissions:
      actions: write
    steps:
      - name: Cancel the run if its work cannot start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # How long a job may sit queued before this run is abandoned. Long
          # enough for an ordinary busy fleet, far short of GitHub's 24h ceiling.
          BUDGET_MINUTES: "45"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          while :; do
            queued=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate \\
              --jq '[.jobs[] | select(.status == "queued") | .name] | join(", ")' | tr -d '\\n')
            if [ -z "${queued}" ]; then
              echo "no job is waiting for a runner; watchdog done"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::still waiting for a runner after ${BUDGET_MINUTES}m: ${queued}. Cancelling this run rather than queueing to GitHub's 24h ceiling."
              gh run cancel "${RUN_ID}" --repo "${REPO}"
              exit 1
            fi
            echo "waiting for a runner: ${queued}"
            sleep 60
          done

  # The dist CLI archives, uploaded to the draft by release.yml's own host job.
  archives:
    name: "Build: CLI archives"
    if: ${{ !inputs.validation_only }}
    needs: [prove-ref, merge-gate]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write

  build-product-tree:
    timeout-minutes: 120
    needs: [prove-ref, merge-gate]
    name: "Build: Product tree (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: Windows, arch: X64, platform: Windows X64, constrained_arm: false, ext: zip }
          - { target: x86_64-unknown-linux-gnu, os: Linux, arch: X64, platform: Linux X64, constrained_arm: false, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: Linux, arch: ARM64, platform: Linux ARM64, constrained_arm: true, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macOS, arch: ARM64, platform: macOS ARM64, constrained_arm: true, ext: tar.gz }
    # Selection is by OS *and* architecture, and DETERMINISTIC SCHEDULING is the
    # whole of the reason. Two Linux runners are registered and both carry the
    # auto-assigned `Linux` label, so an OS-only selection would send the two
    # Linux targets to machines nondeterministically — the same target landing
    # on a different box run to run, and two legs able to collide on one.
    #
    # It is no longer a correctness requirement. It was, while this job froze a
    # PyInstaller onedir per target: that cannot cross-compile, so an
    # x86_64-scheduled aarch64 leg produced a mislabelled artifact. Nothing in
    # this job is architecture-bound now — the cargo builds cross-compile from
    # whatever host they land on — so a mis-scheduled leg would build correctly,
    # just not where it was meant to. Keep the label anyway; scheduling that is
    # reproducible is worth having on its own.
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    # The constrained native ARM capabilities are serialized because concurrent
    # full release builds exceed the available capacity. Other targets use a
    # per-run, per-target group and retain useful parallelism.
    concurrency:
      group: ${{ matrix.constrained_arm && 'vaultspec-native-arm-release' || format('{0}-{1}-{2}', github.workflow, github.run_id, matrix.target) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up packaging Python
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.13"
          activate-environment: true
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # Name the directory the builds below land in. The runners share one
      # persistent cargo target directory outside the workspace; a runner
      # without that variable builds into `engine/target`. Resolving it here
      # keeps every built-binary reference in this job correct in both cases —
      # an unset variable would otherwise abort the composition steps (they run
      # under `set -u`) or, worse, compose a path with an empty root.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${{ needs.prove-ref.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Build the dashboard, updater, and product builder
        shell: bash
        working-directory: engine
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} \
            -p vaultspec-cli -p vaultspec-updater --bin vaultspec --bin vaultspec-updater
          cargo build --release -p vaultspec-product --bin product_build
      - name: Compose + self-verify the product tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          target="${{ matrix.target }}"
          suffix=""; [ "${{ matrix.ext }}" = "zip" ] && suffix=".exe"
          gen_root="${PWD}/out/generations/0001"
          # The full-tree SBOM, generated here from the two lockfiles that
          # define this build: the engine's Cargo.lock and the frontend's
          # package-lock.json. It is emitted per target but is byte-identical
          # across all four by construction (no wall clock, sorted output), so
          # `cohort-digest` still agrees. It lands under out/ beside the
          # generation root rather than in the tracked packaging/ tree: it is a
          # build product, and a generated file sitting in a source directory is
          # one `git add -A` from being committed.
          python3 packaging/gen-sbom.py \
            --version "$version" --commit "$(git rev-parse HEAD)" \
            --cargo-lock "${PWD}/engine/Cargo.lock" \
            --npm-lock "${PWD}/frontend/package-lock.json" \
            --out "${PWD}/out/sbom.cdx.json"
          # THE A2A RUNTIME IS DELIBERATELY ABSENT FROM THIS TREE. What gets
          # composed is the dashboard, the updater, the release manifest, the
          # licenses and the SBOM — 13-15 MB — and not the ~269 MB frozen a2a
          # onedir this job used to build and bundle.
          #
          # It was bundled and INERT. The dashboard resolves its runtime from
          # ~/.vaultspec/a2a/generations/<gen>/, never from the archive, and
          # every lifecycle op that would populate that directory returns
          # OpEffect::PendingImplementation. Nothing in the product could reach
          # the bundled bytes, so shipping them bought 269 MB of download for a
          # capability that does not exist yet.
          #
          # The absence is STATED, not faked. There is no stub a2a/ directory,
          # no empty slot and no manifest entry: assemble-build-spec.py omits
          # `sources.a2a` outright when the pair is not passed, and gen-sbom
          # above is passed no --uv-lock because this build resolves no Python
          # ecosystem to report.
          #
          # WHAT BRINGS IT BACK: runtime adoption — the lifecycle ops above
          # populating the generation directory from a bundled onedir instead
          # of returning PendingImplementation. Then restore the freeze steps
          # (git history has them), pass --a2a-runtime with --lock here and
          # --uv-lock to gen-sbom, and restore the native-architecture guard,
          # because PyInstaller cannot cross-compile. Until adoption lands,
          # adding the onedir back only re-adds the 269 MB.
          #
          # (LICENSE is a release input — the repo LICENSE, sourced here as
          # ${PWD}/LICENSE. The SBOM is the file generated immediately above.)
          python3 packaging/assemble-build-spec.py \
            --target "$target" --version "$version" \
            --commit "$(git rev-parse HEAD)" --cohort-id "release-${version}" \
            --generation-root "$gen_root" \
            --dashboard "${ENGINE_TARGET_DIR}/${target}/release/vaultspec${suffix}" \
            --updater "${ENGINE_TARGET_DIR}/${target}/release/vaultspec-updater${suffix}" \
            --sbom "${PWD}/out/sbom.cdx.json" \
            --license vaultspec MIT "${PWD}/LICENSE" \
            > build-spec.json
          "${ENGINE_TARGET_DIR}/release/product_build" build-spec.json
          echo "GEN_ROOT=${gen_root}" >> "$GITHUB_ENV"
      - name: Archive + checksum
        shell: bash
        run: |
          set -euo pipefail
          name="vaultspec-${{ steps.version.outputs.value }}-${{ matrix.target }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd "$GEN_ROOT" && 7z a -tzip "${GITHUB_WORKSPACE}/${name}.zip" .) \
              || (cd "$GEN_ROOT" && zip -r "${GITHUB_WORKSPACE}/${name}.zip" .)
          else
            tar -czf "${GITHUB_WORKSPACE}/${name}.tar.gz" -C "$GEN_ROOT" .
          fi
          archive="${name}.${{ matrix.ext }}"
          ( sha256sum "$archive" || shasum -a 256 "$archive" ) | awk '{print $1}' > "${archive}.sha256"
          # The member manifest (release.json) drives the S166 cohort digest.
          cp "$GEN_ROOT/release.json" "release-${{ matrix.target }}.json"
      # Every member is proven where it will run: extracted into fresh staging
      # and verified and launched by its own shipped binary on its native
      # target.
      - name: Extract and validate the native release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          archive="vaultspec-${VERSION}-${TARGET}.${EXT}"
          stage="${RUNNER_TEMP}/vaultspec-release-${TARGET}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ "${EXT}" = "zip" ]; then
            7z x "$archive" "-o${stage}" -y
          else
            tar -xzf "$archive" -C "$stage"
          fi
          executable="$stage/bin/vaultspec"
          [ "${EXT}" = "zip" ] && executable="${executable}.exe"
          "$executable" verify-release "$stage"
          "$executable" --version
      - name: Upload the release-set member
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-${{ matrix.target }}
          path: |
            vaultspec-*-${{ matrix.target }}.${{ matrix.ext }}
            vaultspec-*-${{ matrix.target }}.${{ matrix.ext }}.sha256
            release-${{ matrix.target }}.json
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target out 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force engine\target, out -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize

  cohort-digest:
    timeout-minutes: 30
    name: "Build: Cohort digest (Linux)"
    needs: build-product-tree
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # See the compose job: name the directory the build below lands in.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: members
      - name: Aggregate the four verified members + emit the cohort digest
        shell: bash
        run: |
          set -euo pipefail
          # S166: aggregate exactly one verified member per target, enforce the
          # common cohort id / A2A commit / component-lock / release-schema /
          # protocol / state identity across all four, and emit the receipt-bound
          # cohort digest — SHA-256 of the RFC 8785 JCS CohortDescriptor, produced
          # by the cohort-digest verb (serde_jcs, never hand-rolled in shell).
          cargo build --release -p vaultspec-product --bin cohort_digest --manifest-path engine/Cargo.toml
          "${ENGINE_TARGET_DIR}/release/cohort_digest" \
            --lock packaging/a2a-component.lock.json \
            --member aarch64-apple-darwin=members/product-aarch64-apple-darwin/release-aarch64-apple-darwin.json \
            --member aarch64-unknown-linux-gnu=members/product-aarch64-unknown-linux-gnu/release-aarch64-unknown-linux-gnu.json \
            --member x86_64-unknown-linux-gnu=members/product-x86_64-unknown-linux-gnu/release-x86_64-unknown-linux-gnu.json \
            --member x86_64-pc-windows-msvc=members/product-x86_64-pc-windows-msvc/release-x86_64-pc-windows-msvc.json \
            --out cohort-descriptor.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-descriptor
          path: cohort-descriptor.json
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  python-compatibility:
    timeout-minutes: 30
    name: "Check: Python harness (Linux ${{ matrix.python-version }})"
    needs: prove-ref
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Validate the Python development harness
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv sync --frozen --python "${PYTHON_VERSION}"
          just check-python

  # One verdict over every artifact check, so the jobs that touch the release
  # need a single name rather than a list that can drift.
  artifact-correctness:
    timeout-minutes: 15
    name: "Check: Release artifacts (Linux)"
    needs: [build-product-tree, cohort-digest, python-compatibility]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Confirm every artifact check passed
        run: echo "All four native archives, the cohort digest and both supported Python versions passed."

  # Resolve the prior published release, then run the phase-zero channel
  # feasibility proof. The proof writes its outcome into the support matrix,
  # which the channel-publish gate reads before any Scoop/WinGet publication.
  # It fails closed (matrix untouched) until real release inputs make a proof
  # possible, and the release is not published until it passes.
  resolve-version:
    timeout-minutes: 15
    name: "Check: Release version (Linux)"
    needs: prove-ref
    runs-on: [self-hosted, Linux, X64]
    outputs:
      value: ${{ steps.v.outputs.value }}
      prior: ${{ steps.v.outputs.prior }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve the version and the prior published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prove-ref.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          # The highest published release strictly below this one. A
          # manager-owned downgrade can only be proven against a real earlier
          # release; when there is none, this stays empty and the downgrade leg
          # fails closed downstream rather than being skipped.
          #
          # `gh` is REQUIRED here rather than optional, and its absence is a hard
          # error rather than an empty list. A previous form swallowed a missing
          # `gh`, resolved `prior=<none>` while five releases were published,
          # and sent the next reader hunting a downgrade bug that did not exist:
          # a check that MANUFACTURES A FALSE FACT is worse than one that passes.
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh is required to resolve the prior published release; it is not on PATH for this runner" >&2
            exit 1
          fi
          published=$(gh release list --limit 50 --exclude-drafts --json tagName --jq '.[].tagName' | sed 's/^v//')
          prior=$(printf '%s\n%s\n' "${published}" "${version}" \
            | sed '/^$/d' \
            | sort -V -u \
            | grep -x -B1 "${version}" \
            | head -1)
          [ "${prior}" = "${version}" ] && prior=""
          echo "prior=${prior}" >> "$GITHUB_OUTPUT"
          echo "resolved version=${version} prior=${prior:-<none>}"
  channel-feasibility:
    name: "Check: Channel feasibility"
    needs: [resolve-version, attach-to-release]
    uses: ./.github/workflows/a2a-channel-feasibility.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.resolve-version.outputs.value }}
      channels: 'scoop winget'
      prior_version: ${{ needs.resolve-version.outputs.prior }}

  # ATTACH. Without this job the complete product tree is built, composed,
  # self-verified, SBOM'd and digested - and then written only to an
  # Actions artifact bucket, which expires. Every earlier release therefore
  # carried no complete-product archive at all, which is also why scoop-bump has
  # never succeeded: it points at `vaultspec-<version>-x86_64-pc-windows-msvc.zip`
  # ON THE RELEASE, an asset nothing has ever uploaded there.
  #
  # `needs` covers the CLI archives and `artifact-correctness`, which in turn
  # needs every natively verified member, the cohort digest and the Python
  # harness, so a partial cohort cannot be attached.
  attach-to-release:
    timeout-minutes: 45
    name: "Build: Release attachments (Linux)"
    if: ${{ !inputs.validation_only }}
    needs: [archives, artifact-correctness, resolve-version]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: members

      # One aggregated SHA256SUMS beside the per-asset sidecars, in the same
      # sha256sum-compatible grammar vaultspec-core and vaultspec-rag publish.
      # The per-archive `.sha256` files hold a bare digest with no filename
      # column (the installers fetch them individually and compare), so the
      # filename is reattached here rather than concatenating them.
      - name: Aggregate checksums
        id: gather
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find members -type f \
            \( -name 'vaultspec-*.tar.gz' -o -name 'vaultspec-*.zip' \
               -o -name 'vaultspec-*.sha256' -o -name 'release-*.json' \
               -o -name 'cohort-descriptor.json' \) \
            -exec cp -t dist/ {} +

          # THE INSTALLERS SHIP WITH THE TREES THEY INSTALL. They come from the
          # checkout, not from a build artifact, because nothing builds them -
          # and until now nothing published them either, so the release carried
          # archives with no documented way to place one. `dist-workspace.toml`
          # disables dist's own binary-only installers in favour of these two;
          # that swap was made in config years of releases ago and the second
          # half of it, publishing the replacements, was never wired.
          #
          # Attached from the SAME job that attaches the archives, which is what
          # keeps them honest: an installer resolves the newest release and
          # fetches `vaultspec-<version>-<target>` out of it, so a release
          # carrying an installer and no archive would serve a script that 404s.
          # Uploading both here means neither can appear without the other.
          cp packaging/install.sh packaging/install.ps1 dist/

          cd dist
          # Sidecars for the installers, minted here because they are the only
          # assets with no build step to mint them. Every published asset then
          # carries a `.sha256` in one grammar, and the loop below needs no
          # special case for the two that would otherwise lack one.
          for installer in install.sh install.ps1; do
            sha256sum "${installer}" | cut -d' ' -f1 > "${installer}.sha256"
          done

          : > SHA256SUMS
          for asset in vaultspec-*.tar.gz vaultspec-*.zip install.sh install.ps1; do
            [ -e "$asset" ] || continue
            digest=$(cut -d' ' -f1 < "${asset}.sha256")
            if [ -z "${digest}" ]; then
              echo "::error::no digest recorded for ${asset}; refusing to publish an unverifiable asset" >&2
              exit 1
            fi
            printf '%s  %s\n' "${digest}" "${asset}" >> SHA256SUMS
          done

          # A release set with no archive is the failure this job exists to
          # prevent, so it fails loudly rather than uploading a manifest of
          # nothing. Counted over the ARCHIVES alone, deliberately: the two
          # installers are copied from the checkout and are therefore always
          # present, so a count over every line of SHA256SUMS would read 2 on
          # exactly the run where the whole build matrix produced nothing - and
          # this guard would pass on the failure it exists to catch.
          count=$(grep -c . SHA256SUMS || true)
          archives=$(ls vaultspec-*.tar.gz vaultspec-*.zip 2>/dev/null | grep -c . || true)
          if [ "${archives}" -eq 0 ]; then
            echo "::error::no product archives were produced; nothing to attach" >&2
            exit 1
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "### Product release assets (${archives} archives, ${count} verified files)"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # prove-ref already required the release; re-checked here because a
          # draft deleted mid-run would otherwise fail deep inside `upload`.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::no release exists for ${tag}; nothing to attach to" >&2
            exit 1
          fi
          gh release upload "${tag}" dist/* --clobber
          echo "attached ${{ steps.gather.outputs.count }} archive(s) to ${tag}"

  # PUBLISH, BUT NOT AS LATEST. Everything that can condemn the release from
  # the build side has passed: the merge gate, both archive sets, the
  # clean-runner verify, the cohort digest and the channel feasibility proof.
  # The draft now becomes a public prerelease so acquisition can download it
  # exactly as a user would; `latest` still answers with the previous release.
  publish-prerelease:
    timeout-minutes: 15
    name: "Build: Release candidate (Linux)"
    needs: [archives, attach-to-release, channel-feasibility]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Publish the draft as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "${TAG}" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false

  acquisition:
    name: "Test: Published binaries"
    needs: publish-prerelease
    uses: ./.github/workflows/acquisition.yml
    with:
      tag: ${{ inputs.tag }}

  # PROMOTE. The last visibility change, and the reason a defective release can
  # no longer surface as `latest`. If acquisition fails, the release stays a
  # prerelease: reachable by its tag for diagnosis, never the default install.
  promote-release:
    timeout-minutes: 15
    name: "Build: Release promotion (Linux)"
    needs: [publish-prerelease, acquisition]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Promote the release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "${TAG}" --repo "${{ github.repository }}" --prerelease=false --latest

  # POST-PROMOTION CHANNEL PUBLICATION. Both formula and manifest point at the
  # archives ON THE RELEASE and verify each digest by re-downloading, and each
  # is fail-closed behind `channel-publish-gate`, so a run here publishes
  # nothing until the support matrix marks the channel `supported`.
  homebrew-bump:
    name: "Build: Homebrew channel"
    needs: [resolve-version, promote-release]
    uses: ./.github/workflows/homebrew-bump.yml
    with:
      version: ${{ needs.resolve-version.outputs.value }}
    secrets:
      CHANNEL_ROOT_DEPLOY_KEY: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

  scoop-bump:
    name: "Build: Scoop channel"
    needs: [resolve-version, promote-release]
    uses: ./.github/workflows/scoop-bump.yml
    with:
      version: ${{ needs.resolve-version.outputs.value }}
    secrets:
      CHANNEL_ROOT_DEPLOY_KEY: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}
