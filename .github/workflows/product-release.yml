# The product-release workflow: compose, verify, archive, and publish the COMPLETE product tree
# for each of the four release targets.
#
# This is a SEPARATE workflow, NOT an edit of the cargo-dist-autogenerated
# release.yml (Dist regenerates that file on `dist init`; hand edits are fragile).
# Dist is retained only for target planning, checksums, and GitHub release hosting
# (dist-workspace.toml S73); this workflow produces the offline-complete product
# artifacts Dist's binary-only installers do not.
#
# Per target it builds the dashboard + copied updater and runs `product-build`
# to compose + self-verify the tree through the S06 authority. The tree is
# archived as `vaultspec-<version>-<target>.{tar.gz,zip}` + a sibling `.sha256`.
#
# VERIFICATION REALITY: authored here; the real proof is a release-CI run on a
# clean runner (the self-verify job below), not a local green.
#
# The A2A runtime is deliberately NOT built or bundled here. The compose step
# below carries the reason and the condition that brings it back; read it there
# before adding a freeze leg to this workflow.
#
# Runners are selected by OS *and* architecture, and the architecture half is
# there for scheduling determinism alone: both self-hosted Linux runners carry
# the auto-assigned `Linux` label, so an OS-only selector places the two Linux
# targets nondeterministically. Nothing here is architecture-bound any more —
# every build is a cargo build for an explicit `--target`, which succeeds from
# any host — so no leg requires a native-architecture runner.

name: Product Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  # Refuse a release build whose runners cannot serve it.
  #
  # Two of this matrix's four targets land on the power-gated MacBook, which
  # serves runners only on AC. A selector with no ONLINE runner does not fail -
  # it QUEUES, unbounded by timeout-minutes - so without this the release
  # appears to be progressing for up to a day and then reports failed with no
  # assets attached. That is the same silent shape as the six weeks v0.1.4 spent
  # answering as `releases/latest` with nothing on it.
  #
  # It does not fight the gate: stopping runners on battery is correct, and a
  # running job is never killed. It refuses to spend a day discovering it.
  #
  # Hosted, deliberately - a preflight that needs the fleet cannot report that
  # the fleet is down.
  preflight:
    name: Preflight runners
    runs-on: ubuntu-latest
    steps:
      # Only what the steps below read, only this commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/preflight-runners
            .github/workflows/product-release.yml
          sparse-checkout-cone-mode: false

      - name: Derive the selectors this workflow schedules onto
        id: derive
        shell: bash
        run: |
          set -uo pipefail
          workflow=".github/workflows/product-release.yml"
          [ -f "${workflow}" ] || { echo "::error::${workflow} not checked out; cannot derive selectors" >&2; exit 1; }

          # DERIVED, not hand-listed. This job used to carry the four label sets
          # in a literal bash array. That is the defect the sibling project paid
          # for twice: its hand-kept list outlived its matrix, and the first time
          # the named host was down while every real leg was up, it refused a
          # release every leg could serve, citing a target that no longer
          # existed. A list that must be edited in lockstep with a matrix
          # eventually is not, and neither copy of that mistake was caught in
          # review.
          #
          # The staleness is currently harmless only because the check is blind:
          # `actions/runners` needs `administration: read`, the default
          # GITHUB_TOKEN does not have it, and every run so far has taken the 403
          # path and passed. Arming FLEET_PREFLIGHT_TOKEN is exactly what would
          # detonate a stale list, so deriving has to land BEFORE the token does.
          #
          # Two sources, matching the two ways this file selects a runner:
          #   1. The compose matrix, which schedules by OS *and* architecture
          #      through `[self-hosted, os, arch]`.
          #   2. Every other job, which carries a literal label list.
          #
          # Both readings assume a shape, so both assert it. A derivation that
          # silently describes something the file no longer says is worse than no
          # derivation, because it still prints a confident ok.
          # The braces are escaped so this stays a bash string: Actions expands
          # a bare expression inside `run:` before bash ever sees it, and the
          # guard would then be matching the empty string against itself.
          grep -qE 'runs-on:[[:space:]]*\[self-hosted,[[:space:]]*"\$\{\{[[:space:]]*matrix\.os[[:space:]]*\}\}",[[:space:]]*"\$\{\{[[:space:]]*matrix\.arch[[:space:]]*\}\}"\]' "${workflow}" || {
            echo "::error::${workflow} no longer schedules the compose matrix by [self-hosted, os, arch]; this derivation would miss every build leg. Re-check it." >&2
            exit 1
          }

          mapfile -t selectors < <(
            {
              # Literal label lists. Templated ones are handled below; parsing
              # them here would yield a selector containing an unexpanded
              # expression, which matches no runner and reads as a real failure.
              grep -v '\$\{\{' "${workflow}" |
                awk -F'[][]' '/^[[:space:]]*runs-on:[[:space:]]*\[/ && NF > 2 {print $2}' |
                tr -d ' ' | tr '[:upper:]' '[:lower:]'
              # The compose matrix, whose os/arch pairs fill the templated
              # runs-on asserted above.
              awk '/target:/ && /os:/ && /arch:/ {
                     os = ""; arch = ""
                     if (match($0, /os:[[:space:]]*[A-Za-z0-9_-]+/))   { os   = substr($0, RSTART, RLENGTH); sub(/os:[[:space:]]*/, "", os) }
                     if (match($0, /arch:[[:space:]]*[A-Za-z0-9_-]+/)) { arch = substr($0, RSTART, RLENGTH); sub(/arch:[[:space:]]*/, "", arch) }
                     if (length(os) && length(arch)) print tolower("self-hosted," os "," arch)
                   }' "${workflow}"
            } | sort -u
          )
          if [ "${#selectors[@]}" -eq 0 ]; then
            echo "::error::derived no runner selector from ${workflow}; refusing to pass vacuously" >&2
            exit 1
          fi
          {
            echo "selectors<<SELECTORS_EOF"
            printf '%s\n' "${selectors[@]}"
            echo "SELECTORS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/preflight-runners
        with:
          selectors: ${{ steps.derive.outputs.selectors }}
          # A PAT with `administration: read` if one is configured; the default
          # GITHUB_TOKEN otherwise. Without the PAT this check is blind and says
          # so rather than guessing.
          token: ${{ secrets.FLEET_PREFLIGHT_TOKEN || secrets.GITHUB_TOKEN }}
          # Unconditional here: this workflow runs only on a tag push or a
          # deliberate dispatch, and both of those build artifacts on the fleet.
          enforce: "true"

  build-product-tree:
    needs: preflight
    name: Compose ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: Windows, arch: X64, host: windows-x64, ext: zip }
          - { target: x86_64-unknown-linux-gnu, os: Linux, arch: X64, host: linux-x64, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: Linux, arch: ARM64, host: apple-silicon, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macOS, arch: ARM64, host: apple-silicon, ext: tar.gz }
    # Selection is by OS *and* architecture, and DETERMINISTIC SCHEDULING is the
    # whole of the reason. Two Linux runners are registered and both carry the
    # auto-assigned `Linux` label, so an OS-only selection would send the two
    # Linux targets to machines nondeterministically — the same target landing
    # on a different box run to run, and two legs able to collide on one.
    #
    # It is no longer a correctness requirement. It was, while this job froze a
    # PyInstaller onedir per target: that cannot cross-compile, so an
    # x86_64-scheduled aarch64 leg produced a mislabelled artifact. Nothing in
    # this job is architecture-bound now — the cargo builds cross-compile from
    # whatever host they land on — so a mis-scheduled leg would build correctly,
    # just not where it was meant to. Keep the label anyway; scheduling that is
    # reproducible is worth having on its own.
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    # The two ARM legs share one physical machine — the macOS runner and a colima
    # Linux VM on the same Apple Silicon laptop — so scheduling them together
    # runs two full builds against 8 GiB of RAM, 6 GiB of which is reserved by
    # the VM, on a host measured at 7.0 of 8.2 GB of swap in use while idle. This
    # is the heaviest of the four-target matrices; serialise that pair.
    #
    # `host` is the physical machine, not the runner. Only the shared one takes a
    # common group; the other legs get a per-run, per-target group so they never
    # wait. The group name is not scoped to this workflow on purpose: a release
    # and a certification run reaching that laptop together contend for the same
    # RAM.
    #
    # WHAT WOULD RETIRE THIS CONSTRAINT. It is insurance against an UNMEASURED
    # risk, not a measured one, and it should be dropped once that stops being
    # true rather than kept out of habit. a2a-product-contract — the light proof,
    # same two runners, same host — was measured and does NOT serialise: under
    # load its darwin leg added 225 MB of swap over idle and its ARM Linux leg
    # peaked at 11,935 pageouts/15s transiently, with available memory never
    # below 985 MB and host free disk flat. The alarming-looking idle state
    # (~7 of 8 GB swap in use, 6 GiB of 8 GiB reserved by the VM) turned out to
    # be this machine's steady state rather than a machine near its limit.
    #
    # This workflow is heavier — a full cargo release build, the SPA bundle and
    # composition — so that result does not transfer. To retire this: run a
    # four-target dispatch WITHOUT the group, sample the host through it, and
    # confirm the two ARM legs overlapping keep available memory off the floor
    # and pageouts non-degrading. If they do, delete this block and the `host:`
    # matrix keys. Do not delete it on the strength of the contract-proof numbers
    # alone; that is the extrapolation this comment exists to prevent.
    concurrency:
      group: ${{ matrix.host == 'apple-silicon' && 'fleet-apple-silicon-host' || format('{0}-{1}-{2}', github.workflow, github.run_id, matrix.target) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # Name the directory the builds below land in. The runners share one
      # persistent cargo target directory outside the workspace; a runner
      # without that variable builds into `engine/target`. Resolving it here
      # keeps every built-binary reference in this job correct in both cases —
      # an unset variable would otherwise abort the composition steps (they run
      # under `set -u`) or, worse, compose a path with an empty root.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the dashboard, updater, and product builder
        shell: bash
        working-directory: engine
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} \
            -p vaultspec-cli -p vaultspec-updater --bin vaultspec --bin vaultspec-updater
          cargo build --release -p vaultspec-product --bin product_build
      - name: Compose + self-verify the product tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          target="${{ matrix.target }}"
          suffix=""; [ "${{ matrix.ext }}" = "zip" ] && suffix=".exe"
          gen_root="${PWD}/out/generations/0001"
          # The full-tree SBOM, generated here from the two lockfiles that
          # define this build: the engine's Cargo.lock and the frontend's
          # package-lock.json. It is emitted per target but is byte-identical
          # across all four by construction (no wall clock, sorted output), so
          # `cohort-digest` still agrees. It lands under out/ beside the
          # generation root rather than in the tracked packaging/ tree: it is a
          # build product, and a generated file sitting in a source directory is
          # one `git add -A` from being committed.
          python3 packaging/gen-sbom.py \
            --version "$version" --commit "$(git rev-parse HEAD)" \
            --cargo-lock "${PWD}/engine/Cargo.lock" \
            --npm-lock "${PWD}/frontend/package-lock.json" \
            --out "${PWD}/out/sbom.cdx.json"
          # THE A2A RUNTIME IS DELIBERATELY ABSENT FROM THIS TREE. What gets
          # composed is the dashboard, the updater, the release manifest, the
          # licenses and the SBOM — 13-15 MB — and not the ~269 MB frozen a2a
          # onedir this job used to build and bundle.
          #
          # It was bundled and INERT. The dashboard resolves its runtime from
          # ~/.vaultspec/a2a/generations/<gen>/, never from the archive, and
          # every lifecycle op that would populate that directory returns
          # OpEffect::PendingImplementation. Nothing in the product could reach
          # the bundled bytes, so shipping them bought 269 MB of download for a
          # capability that does not exist yet.
          #
          # The absence is STATED, not faked. There is no stub a2a/ directory,
          # no empty slot and no manifest entry: assemble-build-spec.py omits
          # `sources.a2a` outright when the pair is not passed, and gen-sbom
          # above is passed no --uv-lock because this build resolves no Python
          # ecosystem to report.
          #
          # WHAT BRINGS IT BACK: runtime adoption — the lifecycle ops above
          # populating the generation directory from a bundled onedir instead
          # of returning PendingImplementation. Then restore the freeze steps
          # (git history has them), pass --a2a-runtime with --lock here and
          # --uv-lock to gen-sbom, and restore the native-architecture guard,
          # because PyInstaller cannot cross-compile. Until adoption lands,
          # adding the onedir back only re-adds the 269 MB.
          #
          # (LICENSE is a release input — the repo LICENSE, sourced here as
          # ${PWD}/LICENSE. The SBOM is the file generated immediately above.)
          python3 packaging/assemble-build-spec.py \
            --target "$target" --version "$version" \
            --commit "$(git rev-parse HEAD)" --cohort-id "release-${version}" \
            --generation-root "$gen_root" \
            --dashboard "${ENGINE_TARGET_DIR}/${target}/release/vaultspec${suffix}" \
            --updater "${ENGINE_TARGET_DIR}/${target}/release/vaultspec-updater${suffix}" \
            --sbom "${PWD}/out/sbom.cdx.json" \
            --license vaultspec MIT "${PWD}/LICENSE" \
            > build-spec.json
          "${ENGINE_TARGET_DIR}/release/product_build" build-spec.json
          echo "GEN_ROOT=${gen_root}" >> "$GITHUB_ENV"
      - name: Archive + checksum
        shell: bash
        run: |
          set -euo pipefail
          name="vaultspec-${{ steps.version.outputs.value }}-${{ matrix.target }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd "$GEN_ROOT" && 7z a -tzip "${GITHUB_WORKSPACE}/${name}.zip" .) \
              || (cd "$GEN_ROOT" && zip -r "${GITHUB_WORKSPACE}/${name}.zip" .)
          else
            tar -czf "${GITHUB_WORKSPACE}/${name}.tar.gz" -C "$GEN_ROOT" .
          fi
          archive="${name}.${{ matrix.ext }}"
          ( sha256sum "$archive" || shasum -a 256 "$archive" ) | awk '{print $1}' > "${archive}.sha256"
          # The member manifest (release.json) drives the S166 cohort digest.
          cp "$GEN_ROOT/release.json" "release-${{ matrix.target }}.json"
      - name: Upload the release-set member
        uses: actions/upload-artifact@v4
        with:
          name: product-${{ matrix.target }}
          path: |
            vaultspec-*-${{ matrix.target }}.${{ matrix.ext }}
            vaultspec-*-${{ matrix.target }}.${{ matrix.ext }}.sha256
            release-${{ matrix.target }}.json
      - name: Reclaim runner disk (always · unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target out 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
      - name: Reclaim runner disk (always · windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          if ('${{ job.status }}' -eq 'failure') {
            Remove-Item -Recurse -Force engine\target, out -ErrorAction SilentlyContinue
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize

  self-verify:
    name: Clean-runner self-verify
    needs: build-product-tree
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: product-x86_64-pc-windows-msvc
          path: dl
      - name: Extract + verify-release on a clean runner
        shell: bash
        run: |
          set -euo pipefail
          # Extract the composed tree and run the shipped bounded authority against
          # it — the same verify a consumer's installer runs. A tree that composed
          # but does not verify fails the release.
          mkdir -p installed
          archive=$(ls dl/*.zip)
          7z x "$archive" -oinstalled -y
          ./installed/bin/vaultspec.exe verify-release ./installed
      - name: Reclaim runner disk (always)
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Get-Process vaultspec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force installed, dl -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize

  cohort-digest:
    name: Cohort digest
    needs: build-product-tree
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # See the compose job: name the directory the build below lands in.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: members
      - name: Aggregate the four verified members + emit the cohort digest
        shell: bash
        run: |
          set -euo pipefail
          # S166: aggregate exactly one verified member per target, enforce the
          # common cohort id / A2A commit / component-lock / release-schema /
          # protocol / state identity across all four, and emit the receipt-bound
          # cohort digest — SHA-256 of the RFC 8785 JCS CohortDescriptor, produced
          # by the cohort-digest verb (serde_jcs, never hand-rolled in shell).
          cargo build --release -p vaultspec-product --bin cohort_digest --manifest-path engine/Cargo.toml
          "${ENGINE_TARGET_DIR}/release/cohort_digest" \
            --lock packaging/a2a-component.lock.json \
            --member aarch64-apple-darwin=members/product-aarch64-apple-darwin/release-aarch64-apple-darwin.json \
            --member aarch64-unknown-linux-gnu=members/product-aarch64-unknown-linux-gnu/release-aarch64-unknown-linux-gnu.json \
            --member x86_64-unknown-linux-gnu=members/product-x86_64-unknown-linux-gnu/release-x86_64-unknown-linux-gnu.json \
            --member x86_64-pc-windows-msvc=members/product-x86_64-pc-windows-msvc/release-x86_64-pc-windows-msvc.json \
            --out cohort-descriptor.json
      - uses: actions/upload-artifact@v4
        with:
          name: cohort-descriptor
          path: cohort-descriptor.json
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  # Resolve the release version, then run the phase-zero
  # channel feasibility proof over the published complete archive/MSI. The proof
  # writes its outcome into the support matrix (S148), which the channel-publish
  # gate reads before any Scoop/WinGet publication. Runs at release, after the
  # tree is built + self-verified; fails closed (matrix untouched) until the
  # release assets + capsule (#1) + MSI (S76) make a real proof possible.
  resolve-version:
    name: Resolve release version
    runs-on: [self-hosted, Linux, X64]
    outputs:
      value: ${{ steps.v.outputs.value }}
      prior: ${{ steps.v.outputs.prior }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          # The highest published release strictly below this one. A
          # manager-owned downgrade can only be proven against a real earlier
          # release; when there is none, this stays empty and the downgrade leg
          # fails closed downstream rather than being skipped.
          #
          # `gh` is REQUIRED here rather than optional, and its absence is a hard
          # error rather than an empty list. This previously read
          # `... 2>/dev/null | sed 's/^v//' || true`, which swallowed everything:
          # `gh` was not installed on this runner, the failure was discarded, and
          # `published` came back empty. The arithmetic below then resolved
          # `prior` to the version itself, the guard blanked it, and the job
          # cheerfully reported `prior=<none>` — while five releases (v0.1.0
          # through v0.1.4) were in fact published. Downstream, the downgrade leg
          # fails closed citing a reason that is simply untrue, sending the next
          # reader to hunt a downgrade bug that does not exist.
          #
          # That is worse than a check that silently passes: it MANUFACTURES A
          # FALSE FACT. The missing binary was never the real defect — the defect
          # was that its absence was unreportable. So no `|| true`, no fallback
          # default, and a refusal by name so the cause is legible rather than
          # inferred from an arithmetic result.
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh is required to resolve the prior published release; it is not on PATH for this runner" >&2
            exit 1
          fi
          published=$(gh release list --limit 50 --json tagName --jq '.[].tagName' | sed 's/^v//')
          prior=$(printf '%s\n%s\n' "${published}" "${version}" \
            | sed '/^$/d' \
            | sort -V -u \
            | grep -x -B1 "${version}" \
            | head -1)
          [ "${prior}" = "${version}" ] && prior=""
          echo "prior=${prior}" >> "$GITHUB_OUTPUT"
          echo "resolved version=${version} prior=${prior:-<none>}"
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  channel-feasibility:
    name: Phase-zero channel feasibility
    needs: [resolve-version, self-verify]
    uses: ./.github/workflows/a2a-channel-feasibility.yml
    with:
      version: ${{ needs.resolve-version.outputs.value }}
      channels: 'scoop winget'
      prior_version: ${{ needs.resolve-version.outputs.prior }}

  # ATTACH. Without this job the complete product tree is built, composed,
  # self-verified, SBOM'd and digested - and then written only to an
  # Actions artifact bucket, which expires. Every earlier release therefore
  # carried no complete-product archive at all, which is also why scoop-bump has
  # never succeeded: it points at `vaultspec-<version>-x86_64-pc-windows-msvc.zip`
  # ON THE RELEASE, an asset nothing has ever uploaded there.
  #
  # `needs` covers the whole build matrix plus both verification jobs, so a
  # partial cohort cannot be published: `self-verify` and `cohort-digest` each
  # depend on all four members, and attaching before they pass would put an
  # unverified member on a release that `verify-release-assets` would then
  # report as healthy.
  attach-to-release:
    name: Attach the product tree to the release
    needs: [build-product-tree, self-verify, cohort-digest, resolve-version]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: members

      # One aggregated SHA256SUMS beside the per-asset sidecars, in the same
      # sha256sum-compatible grammar vaultspec-core and vaultspec-rag publish.
      # The per-archive `.sha256` files hold a bare digest with no filename
      # column (the installers fetch them individually and compare), so the
      # filename is reattached here rather than concatenating them.
      - name: Aggregate checksums
        id: gather
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find members -type f \
            \( -name 'vaultspec-*.tar.gz' -o -name 'vaultspec-*.zip' \
               -o -name 'vaultspec-*.sha256' -o -name 'release-*.json' \
               -o -name 'cohort-descriptor.json' \) \
            -exec cp -t dist/ {} +

          # THE INSTALLERS SHIP WITH THE TREES THEY INSTALL. They come from the
          # checkout, not from a build artifact, because nothing builds them -
          # and until now nothing published them either, so the release carried
          # archives with no documented way to place one. `dist-workspace.toml`
          # disables dist's own binary-only installers in favour of these two;
          # that swap was made in config years of releases ago and the second
          # half of it, publishing the replacements, was never wired.
          #
          # Attached from the SAME job that attaches the archives, which is what
          # keeps them honest: an installer resolves the newest release and
          # fetches `vaultspec-<version>-<target>` out of it, so a release
          # carrying an installer and no archive would serve a script that 404s.
          # Uploading both here means neither can appear without the other.
          cp packaging/install.sh packaging/install.ps1 dist/

          cd dist
          # Sidecars for the installers, minted here because they are the only
          # assets with no build step to mint them. Every published asset then
          # carries a `.sha256` in one grammar, and the loop below needs no
          # special case for the two that would otherwise lack one.
          for installer in install.sh install.ps1; do
            sha256sum "${installer}" | cut -d' ' -f1 > "${installer}.sha256"
          done

          : > SHA256SUMS
          for asset in vaultspec-*.tar.gz vaultspec-*.zip install.sh install.ps1; do
            [ -e "$asset" ] || continue
            digest=$(cut -d' ' -f1 < "${asset}.sha256")
            if [ -z "${digest}" ]; then
              echo "::error::no digest recorded for ${asset}; refusing to publish an unverifiable asset" >&2
              exit 1
            fi
            printf '%s  %s\n' "${digest}" "${asset}" >> SHA256SUMS
          done

          # A release set with no archive is the failure this job exists to
          # prevent, so it fails loudly rather than uploading a manifest of
          # nothing. Counted over the ARCHIVES alone, deliberately: the two
          # installers are copied from the checkout and are therefore always
          # present, so a count over every line of SHA256SUMS would read 2 on
          # exactly the run where the whole build matrix produced nothing - and
          # this guard would pass on the failure it exists to catch.
          count=$(grep -c . SHA256SUMS || true)
          archives=$(ls vaultspec-*.tar.gz vaultspec-*.zip 2>/dev/null | grep -c . || true)
          if [ "${archives}" -eq 0 ]; then
            echo "::error::no product archives were produced; nothing to attach" >&2
            exit 1
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "### Product release assets (${archives} archives, ${count} verified files)"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # release-please publishes the GitHub Release when its PR merges, so
          # the release normally exists by now. A dispatch run against a tag
          # with no release object would otherwise fail deep inside `upload`
          # with a less obvious message.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::no release exists for ${tag}; nothing to attach to" >&2
            exit 1
          fi
          gh release upload "${tag}" dist/* --clobber
          echo "attached ${{ steps.gather.outputs.count }} archive(s) to ${tag}"

  # POST-ATTACH CHANNEL PUBLICATION. Homebrew's formula points at the three
  # non-Windows archives ON THE RELEASE and verifies each digest by
  # re-downloading, so it can only run once `attach-to-release` has uploaded
  # them - hence `needs`, not a parallel leg. It is itself fail-closed behind
  # `channel-publish-gate`, so a run here publishes nothing until the matrix
  # marks homebrew `supported` on all three targets.
  #
  # The Scoop equivalent hangs off dist's `post-announce-jobs`
  # (`custom-scoop-bump` in release.yml) rather than here, because it was wired
  # before this workflow existed and reads the dist plan JSON for its tag.
  # Homebrew takes the resolved version directly: this is the workflow that
  # attaches the archives it consumes, and `attach-to-release` already tags them
  # `v<version>` from exactly this value.
  homebrew-bump:
    name: Publish the Homebrew formula
    needs: [resolve-version, attach-to-release]
    uses: ./.github/workflows/homebrew-bump.yml
    with:
      version: ${{ needs.resolve-version.outputs.value }}
    secrets: inherit
