# L0 runner-foundation probe. Verifies each self-hosted runner is
# correctly based BEFORE anything is built on it: shell:bash resolves and runs
# (Git Bash, not WSL bash, on Windows), pwsh runs, and a third-party bash-using
# action (dtolnay/rust-toolchain — the exact one that failed on WSL bash) succeeds.
# Dispatch-only; not part of the gating CI.
name: ci-runner-probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-linux-x64:
    name: probe (Linux x86-64)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: bash resolves + a bash temp-script runs
        shell: bash
        run: |
          echo "bash at: $(command -v bash)"
          echo "uname: $(uname -sm)"
          bash -c 'echo "nested-bash-ok cwd=$PWD"'
      - name: runner is genuinely x86-64
        # Two Linux runners are registered and both carry the auto-assigned
        # `Linux` label; only the architecture label separates them. Asserting
        # here proves the label actually selected the machine we meant, rather
        # than the selection happening to work on the day it was written.
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: $arch"
          if [ "$arch" != "x86_64" ] && [ "$arch" != "amd64" ]; then
            echo "::error::the [self-hosted, Linux, X64] selection landed on a $arch machine" >&2
            exit 1
          fi
      - name: third-party bash-using action
        uses: dtolnay/rust-toolchain@stable
      - run: cargo --version
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: df -h . 2>/dev/null | tail -1 || true

  probe-linux-arm64:
    # The ARM64 Linux runner is the fourth and last leg of the shipped target
    # cohort, and the one whose absence used to make `aarch64-unknown-linux-gnu`
    # unbuildable: PyInstaller freezes only for the architecture it runs on, so
    # that target cannot be produced anywhere else. Like the macOS leg it is
    # reached by no literal `runs-on:` outside this probe — only through release
    # matrix `include:` blocks — so a missing runner presents as a job that
    # queues forever rather than one that fails.
    #
    # The architecture assertion is the point of this job, not a formality. This
    # runner shares the `Linux` label with the x86-64 one, so an architecture
    # label dropped from a `runs-on:` list anywhere would land aarch64 work on
    # the x86-64 box. Proving the selection resolves correctly here is what
    # makes the release arch guards a backstop rather than the only defence.
    name: probe (Linux ARM64)
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: bash resolves + a bash temp-script runs
        shell: bash
        run: |
          echo "bash at: $(command -v bash)"
          echo "uname: $(uname -sm)"
          bash -c 'echo "nested-bash-ok cwd=$PWD"'
      - name: runner is genuinely aarch64
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: $arch"
          if [ "$arch" != "aarch64" ] && [ "$arch" != "arm64" ]; then
            echo "::error::the [self-hosted, Linux, ARM64] selection landed on a $arch machine; aarch64-unknown-linux-gnu cannot be frozen there" >&2
            exit 1
          fi
      - name: third-party bash-using action
        uses: dtolnay/rust-toolchain@stable
      - run: cargo --version
      - name: release prerequisites the service must see
        # Same reasoning as the macOS leg: the release workflow REQUIRES uv and
        # jq rather than installing them, and the runner service does not
        # inherit an interactive login PATH. Proving them inside a real job is
        # the only check that matches how the release will actually run.
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          uv --version
          jq --version
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: df -h . 2>/dev/null | tail -1 || true

  probe-macos:
    # The macOS leg is reached by no literal `runs-on:` anywhere else in the
    # tree — only through release matrix `include:` blocks — so an absent or
    # mislabelled runner shows up as a job that queues forever rather than one
    # that fails. This probe is the cheapest way to prove the machine is really
    # there and really executing, without cutting a tag to find out.
    #
    # It also asserts the architecture, which matters more here than on the
    # other two legs: `aarch64-apple-darwin` is the one target whose frozen
    # runtime cannot be cross-compiled, so a darwin runner that turned out to be
    # x86_64 (or an Apple Silicon machine running the runner under Rosetta)
    # would be refused by the release arch guard. Better to learn that from a
    # dispatch than from a release.
    name: probe (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: bash resolves + a bash temp-script runs
        shell: bash
        run: |
          echo "bash at: $(command -v bash)"
          echo "uname: $(uname -sm)"
          bash -c 'echo "nested-bash-ok cwd=$PWD"'
      - name: runner is genuinely arm64, not Rosetta
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: $arch"
          if [ "$arch" != "arm64" ] && [ "$arch" != "aarch64" ]; then
            echo "::error::macOS runner reports $arch; aarch64-apple-darwin needs an arm64 runner because the frozen runtime cannot be cross-compiled" >&2
            exit 1
          fi
      - name: third-party bash-using action
        uses: dtolnay/rust-toolchain@stable
      - run: cargo --version
      - name: release prerequisites the service must see
        # The release workflow REQUIRES uv rather than installing it, and fails
        # loudly when it is absent. The runner service does not inherit an
        # interactive login PATH, so proving uv here — inside a real job — is
        # the only check that matches how the release will actually run.
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          uv --version
          jq --version
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: df -h . 2>/dev/null | tail -1 || true

  probe-windows:
    name: probe (Windows)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: bash resolves to Git Bash and a temp-script runs
        shell: bash
        run: |
          echo "bash at: $(command -v bash)"
          echo "version: $(bash --version | head -1)"
          bash -c 'echo "nested-bash-ok cwd=$PWD"'
      - name: pwsh runs
        shell: pwsh
        run: |
          Write-Output "pwsh ok $($PSVersionTable.PSVersion)"
      - name: third-party bash-using action (failed on WSL bash before)
        uses: dtolnay/rust-toolchain@stable
      - run: cargo --version
      - name: Reclaim runner disk (always)
        if: always()
        shell: pwsh
        run: (Get-PSDrive C | Select-Object -ExpandProperty Free)
