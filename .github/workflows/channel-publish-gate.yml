# The channel publication gate.
#
# A reusable, FAIL-CLOSED gate that a package-manager channel's publication path
# calls before it publishes any metadata. It answers one question: "has this
# channel earned publication?" and refuses by default.
#
# WHY A SEPARATE WORKFLOW (not a release.yml edit): this gate is nominally
# sited in release.yml, but release.yml is cargo-dist-autogenerated (Dist
# rewrites it on `dist init`; hand edits are fragile). The gate therefore lives
# in its own Dist-safe reusable workflow and is `uses:`-called from the channel
# publication paths (scoop-bump.yml and homebrew-bump.yml today; the WinGet
# publish path when it exists). This preserves the intent — publication is gated — without
# hand-editing the generated file.
#
# THE PROOF-OF-RECORD is packaging/a2a-support-matrix.json. A
# channel is publishable ONLY when its matrix `support_status` is `supported`.
# The phase-zero clean-machine install/upgrade/downgrade/repair/uninstall proof
# `.github/workflows/a2a-channel-feasibility.yml` is what WRITES that status: a
# genuine clean-machine pass flips a channel `feasibility_gated`→`supported`; a
# real reversibility failure
# flips it `→unsupported` with a revisit reason; inputs-pending leaves it
# `feasibility_gated`. Until the proof passes on real runners the matrix stays
# `feasibility_gated` and this gate refuses to publish. That is the rule:
# a channel without a proven reversible adapter is NOT a supported update channel,
# and a failed phase-zero proof reopens the decision rather than certifying on metadata.
#
# HOMEBREW, HONESTLY. The phase-zero proof workflow's legs and its `record`
# job are Windows-target hardcoded, so nothing today can legitimately flip
# homebrew's three targets to `supported`. That is a stated gap, not a reason
# to soften the gate: homebrew is described in the matrix as
# `feasibility_gated` on the three targets it serves, this gate refuses it,
# and homebrew-bump therefore publishes nothing until a real clean-machine
# brew install/upgrade/downgrade/uninstall proof exists and passes.
#
# The gate asserts the proof workflow's PRESENCE as a second fail-closed
# condition, so the matrix can never read `supported` while the proof machinery
# is missing from the tree. Both conditions must hold to publish. Today all
# three channels fail closed (matrix = feasibility_gated; the proof runs release-time
# and no real pass has been recorded).

name: channel-publish-gate

on:
  workflow_call:
    inputs:
      channel:
        description: 'The package-manager channel to gate (scoop | winget | homebrew).'
        required: true
        type: string

concurrency:
  group: channel-publish-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate ${{ inputs.channel }} publication
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - name: Prove the channel earned publication
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          MATRIX=packaging/a2a-support-matrix.json
          # Every gated package-manager channel, with the targets it actually
          # serves. A channel is gated per TARGET, not globally: Scoop and
          # WinGet are Windows-only by construction, while Homebrew serves
          # macOS arm64 and both Linux targets (there is no
          # x86_64-apple-darwin build, so Intel Mac is not in this list, and
          # Homebrew does not serve Windows). Reject anything else outright.
          case "$CHANNEL" in
            scoop|winget) TARGETS="x86_64-pc-windows-msvc" ;;
            homebrew) TARGETS="aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu" ;;
            *) echo "channel-publish-gate: '$CHANNEL' is not a gated package-manager channel"; exit 1 ;;
          esac
          test -f "$MATRIX" || { echo "channel-publish-gate: support matrix $MATRIX is absent — fail closed"; exit 1; }

          # Condition 1 — the phase-zero proof machinery must EXIST. Its absence
          # is a flagged gap; the matrix must not be flippable
          # to `supported` without it.
          PROOF_WF=.github/workflows/a2a-channel-feasibility.yml
          if [ ! -f "$PROOF_WF" ]; then
            echo "channel-publish-gate: phase-zero proof workflow $PROOF_WF is absent — fail closed"
            PROOF_PRESENT=0
          else
            PROOF_PRESENT=1
          fi

          # Condition 2 — the matrix must record this channel as `supported` on
          # EVERY target it serves. `feasibility_gated` means the phase-zero
          # proof has not yet passed; `unsupported` speaks for itself; `absent`
          # means the matrix does not describe this channel on that target at
          # all. Any of the three refuses publication.
          #
          # ALL targets, not any: one manifest or formula serves every platform
          # it names, so a channel proven on one target and unproven on another
          # cannot be published half-way. Publishing the Homebrew formula on a
          # macOS pass while Linux is unproven would ship exactly the Linux
          # install the proof has not cleared.
          echo "channel-publish-gate: proof workflow present = $PROOF_PRESENT"
          for TGT in $TARGETS; do
            STATUS=$(jq -r --arg t "$TGT" --arg c "$CHANNEL" \
              '.targets[$t][$c].support_status // "absent"' "$MATRIX")
            echo "channel-publish-gate: $CHANNEL on $TGT support_status = $STATUS"
            if [ "$STATUS" != "supported" ]; then
              REASON=$(jq -r --arg t "$TGT" --arg c "$CHANNEL" \
                '.targets[$t][$c].unsupported_reason // "phase-zero reversibility proof has not passed (matrix is feasibility_gated)"' "$MATRIX")
              echo "channel-publish-gate: refusing to publish $CHANNEL — $TGT status '$STATUS': $REASON"
              exit 1
            fi
          done
          if [ "$PROOF_PRESENT" != "1" ]; then
            echo "channel-publish-gate: matrix marks $CHANNEL supported but the phase-zero proof workflow is absent — refusing (fail closed)"
            exit 1
          fi
          echo "channel-publish-gate: $CHANNEL cleared for publication"
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1
