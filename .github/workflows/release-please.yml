# THE PROPOSAL KEEPS UP; THE RELEASE WAITS TO BE ASKED FOR.
#
# - PROPOSAL. Every commit that lands on main refreshes the release pull
#   request. `always-update` in the config rebuilds its branch on main's newest
#   head every time, so the proposal is never behind main. This path never
#   creates a release, a tag or a publication, and merging the proposal by hand
#   does not release it either.
# - CUT. A maintainer dispatches this workflow when a release is wanted. It
#   requires the merge gate's passing verdict on the proposal's exact head,
#   squash-merges that head, and has Release Please force the tag and create
#   the draft release seconds later, then starts the release orchestrator. The
#   draft is published last, by the orchestrator, once everything it claims is
#   attached and proved.
#
# The proof comes before the merge because a release tag cannot be deleted: a
# release commit that fails its gate after its tag exists stays a permanent tag
# of a commit nobody can ship.
#
# The tag follows the merge with nothing in between because the default token
# cannot create a tag on a commit whose `.github/workflows` differ from main's
# head. A workflow change that lands between a merge and its tag leaves the
# release untaggable by any later run.
#
# TWO IDENTITIES. The release pull request is written by the fleet's release
# GitHub App, so it is a pull request like any other: its own `pull_request`
# events start the merge gate, whose verdict is the check the ruleset requires.
# A pull request the default token writes starts no runs at all. The App holds
# contents and pull-request write only, never `workflows`. The engine lock moves
# with the version inside Release Please's own commit (`extra-files`), so the
# proposal has one head and one gate run. Tags and releases stay on the default
# token, whose refs and releases wake no other workflow.
#
# RELEASE CHAINING IS AN EXPLICIT DISPATCH, keyed by tag. A tag created by a
# workflow raises no `push: tags` event for other workflows to react to, so
# nothing downstream listens for one. The orchestrator is dispatched with
# `--ref <tag>`, which pins every checkout it and its reusable workflows make to
# the tagged tree, and it refuses a run whose ref is anything else.

name: Dashboard Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per path. A proposal refresh still waiting for a runner is
  # superseded by the next push: Release Please reads main's head, so the newest
  # refresh does the work of every one it replaces. A cut never waits behind a
  # proposal, and a second cut queues behind the first. Nothing cancels: a
  # cancelled release job reports `cancelled`, which nothing reads as red.
  group: release-please-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: "Build: Release proposal (Linux)"
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 30
    runs-on: [self-hosted, Linux, X64]
    # The App token opens and rewrites the release pull request; this job's own
    # token writes nothing.
    permissions:
      contents: read
    steps:
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Releases are cut on dispatch only.
          skip-github-release: true

  candidate:
    name: "Check: Release candidate (Linux)"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.find.outputs.number }}
      sha: ${{ steps.find.outputs.sha }}
      merged: ${{ steps.find.outputs.merged }}
    steps:
      # A proposal merged by hand and not yet tagged is finished first: Release
      # Please opens no new proposal while one is pending, so it is the only
      # candidate there can be. An open proposal is cut only on the merge
      # gate's passing verdict for its exact head, which the proposal's own
      # pull request events produced.
      - name: Find the release pull request and the commit to prove
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: "autorelease: pending"
          GATE_NAME: "Check: Merge gate (Linux)"
        run: |
          set -euo pipefail
          merged=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
            --label "$PENDING" --json number,mergeCommit \
            --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --label "$PENDING" --json number,headRefOid \
            --jq '.[] | "\(.number) \(.headRefOid)"')
          if [ -n "${merged}" ]; then
            [ "$(printf '%s\n' "${merged}" | wc -l)" -eq 1 ] || {
              echo "::error::more than one merged release pull request awaits a tag: ${merged}"; exit 1;
            }
            read -r number sha <<<"${merged}"
            state=true
          elif [ -n "${open}" ]; then
            [ "$(printf '%s\n' "${open}" | wc -l)" -eq 1 ] || {
              echo "::error::more than one open release pull request: ${open}"; exit 1;
            }
            read -r number sha <<<"${open}"
            state=false
            behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...${sha}" --jq '.behind_by')
            if [ "${behind}" != "0" ]; then
              echo "::error::release pull request #${number} is ${behind} commit(s) behind main. Release Please rebuilds it on main's next push; dispatch again after that."
              exit 1
            fi
            # The newest gate run on the head decides, as it does for the
            # ruleset: an older green verdict never outlives a newer red or
            # unfinished one.
            verdict=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/${sha}/check-runs" \
              -f check_name="$GATE_NAME" -f filter=all -f per_page=100 \
              --jq '.check_runs | sort_by(.started_at) | last | if . == null then "none" else "\(.status)/\(.conclusion // "")" end')
            if [ "${verdict}" != "completed/success" ]; then
              echo "::error::release pull request #${number} has no passing '${GATE_NAME}' on ${sha} (newest: ${verdict}). Its own pull request events run the gate; dispatch again once it has passed."
              exit 1
            fi
          else
            echo "::error::there is no release pull request to cut"
            exit 1
          fi
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release pull request #${number} resolved to no commit"
            exit 1
          fi
          {
            echo "number=${number}"
            echo "sha=${sha}"
            echo "merged=${state}"
          } >> "$GITHUB_OUTPUT"
          echo "cutting #${number} at ${sha} (merged=${state})"

  # Reached only when the candidate found a proven head: a job's default
  # condition is the success of everything it needs.
  cut:
    name: "Build: Release cut (Linux)"
    needs: candidate
    timeout-minutes: 30
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ needs.candidate.outputs.number }}
      SHA: ${{ needs.candidate.outputs.sha }}
      MERGED: ${{ needs.candidate.outputs.merged }}
    # Merges the proposal, creates the tag and draft, and dispatches the
    # release orchestrator.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # A squash of a head that is not behind main is exactly the proven tree;
      # the comparison below refuses to tag anything else.
      - name: Merge the proven release pull request
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${MERGED}" = "true" ]; then
            echo "commit=${SHA}" >> "$GITHUB_OUTPUT"
            echo "#${NUMBER} was merged by hand at ${SHA}"
            exit 0
          fi
          head=$(gh pr view "${NUMBER}" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')
          if [ "${head}" != "OPEN ${SHA}" ]; then
            echo "::error::release pull request #${NUMBER} is now '${head}', not the proven ${SHA}; dispatch again"
            exit 1
          fi
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...${SHA}" --jq '.behind_by')
          if [ "${behind}" != "0" ]; then
            echo "::error::main moved while ${SHA} was proven; dispatch again once Release Please has rebuilt the proposal"
            exit 1
          fi
          gh pr merge "${NUMBER}" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "${SHA}" || {
            echo "::error::could not merge #${NUMBER} at the proven ${SHA}; the ruleset refused it or the head moved"
            exit 1
          }
          commit=$(gh pr view "${NUMBER}" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')
          proven=$(gh api "repos/$GITHUB_REPOSITORY/commits/${SHA}" --jq '.commit.tree.sha')
          landed=$(gh api "repos/$GITHUB_REPOSITORY/commits/${commit}" --jq '.commit.tree.sha')
          if [ "${proven}" != "${landed}" ]; then
            echo "::error::merged commit ${commit} does not carry the proven tree of ${SHA}; dispatch again to prove and tag ${commit}"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "merged #${NUMBER} as ${commit}"

      - name: Create the release for the merged proposal
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # The workflow token never holds the `workflows` permission, and without
      # it GitHub refuses any tag or release that targets a commit whose
      # workflow files differ from the branch head, even once the tag exists.
      # When a workflow change lands between a release commit's merge and its
      # tag, release-please fails "Resource not accessible by integration" on
      # every later run. The API error names neither the tag nor the cause, so
      # this step does.
      - name: Name a release this token cannot tag
        if: ${{ failure() && steps.release.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNBOOK: CONTRIBUTING.md
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          tip=$(gh api "${repo}/commits/${GITHUB_REF_NAME}" --jq .sha)
          gh pr list --repo "${GITHUB_REPOSITORY}" --base "${GITHUB_REF_NAME}" \
            --state merged --label "autorelease: pending" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"' |
            while read -r number sha; do
              # `include-component-in-tag` is false here, so the tag is the bare
              # version and the package name is not part of it.
              version=$(gh api "${repo}/contents/.release-please-manifest.json?ref=${sha}" \
                --jq '.content | @base64d | fromjson | ."."')
              tag="v${version}"
              if gh api "${repo}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                continue
              fi
              changed=$(gh api "${repo}/compare/${sha}...${tip}" \
                --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | join(", ")')
              if [ -n "${changed}" ]; then
                echo "::error::${tag} cannot be created by this job: #${number} merged it at ${sha}, and ${GITHUB_REF_NAME} has since changed ${changed}. Rerunning cannot finish it; release it with maintainer credentials as ${RUNBOOK} describes."
              fi
            done

      # The draft creates no tag of its own; `force-tag-creation` does, and the
      # whole orchestrator builds from it. Refuse a tag on anything but the
      # proven tree.
      - name: Require the tag on the proven commit
        shell: bash
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          COMMIT: ${{ steps.merge.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "${CREATED}" != "true" ] || [ -z "${TAG}" ]; then
            echo "::error::Release Please created no release for ${COMMIT}"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${TAG}")
          tagged=$(awk -v ref="refs/tags/${TAG}" '$2 == ref "^{}" { print $1; exit }' <<<"${refs}")
          [ -n "${tagged}" ] || tagged=$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1; exit }' <<<"${refs}")
          if [ "${tagged}" != "${COMMIT}" ]; then
            echo "::error::${TAG} points at ${tagged}, not the proven ${COMMIT}"
            exit 1
          fi

      # ONE consumer. The orchestrator measures the tagged tree, builds and
      # verifies every artifact, publishes the draft as a prerelease, proves
      # acquisition, promotes to latest and only then bumps the channels.
      #
      # `--ref "${TAG}"`, because the orchestrator refuses a run whose ref is
      # anything else: its every checkout and every reusable workflow it calls
      # resolves from the run's ref, and that is how the tagged tree is the only
      # tree a release is built from.
      - name: Dispatch the release orchestrator for the new tag
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run product-release.yml --repo "${REPO}" --ref "${TAG}" -f tag="${TAG}" -f validation_only=false
