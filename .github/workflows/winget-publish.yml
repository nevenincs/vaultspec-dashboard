# The WinGet publication path.
#
# Publishes the composite-product WinGet manifests (packaging/winget/*.yaml) to
# the community repository microsoft/winget-pkgs. This is a DELIBERATE,
# manually-dispatched act — cross-repo publication is never automatic — and it
# is FAIL-CLOSED behind the shared channel-publish-gate: the submission step
# cannot run unless the WinGet channel has earned publication per the support
# matrix + phase-zero reversibility proof.
#
# WHAT IT WOULD SUBMIT. The manifests install the composed product archive
# `vaultspec-<version>-x86_64-pc-windows-msvc.zip` as `InstallerType: zip` +
# `NestedInstallerType: portable`, exposing one command (`vaultspec`). They no
# longer reference an MSI: `engine/crates/vaultspec-cli/wix/main.wxs` `<?error?>`s
# on an undefined `ProductTreeDir` and expects heat-harvested fragments nothing
# generates, no CI step invokes candle/light, and `dist-workspace.toml` sets
# `installers = []` — that MSI has never been built and cannot be. The zip is
# the artefact the product actually ships, and is the one Scoop installs too.
#
# TWO STANDING DEPENDENCIES, both authored-pending:
#
#   1. THE COMPOSED ARCHIVE IS NOT ON A RELEASE YET. `product-release.yml`
#      composes `vaultspec-<version>-<target>.zip` + a bare-digest `.sha256`,
#      but no published release carries it — v0.1.10 attaches only the Dist
#      per-package archives (`vaultspec-cli-*`, `vaultspec-product-*`,
#      `vaultspec-updater-*`, `vaultspec-release-verify-*`). Until that lands,
#      `InstallerUrl` names a file that 404s and `InstallerSha256` stays the
#      64-zero sentinel that `a2a-channel-feasibility.yml` matches to fail the
#      channel closed. See packaging/winget/README.md.
#
#   2. CROSS-REPO PUBLISH (#46/#50 class). Submission targets
#      microsoft/winget-pkgs via a fork + PR (komac/wingetcreate). That requires
#      a fork and a token with access to it; the submission step below is
#      authored but the actual push is the cross-repo coordination point.
#
# Even once both land, the gate still refuses until the phase-zero clean-machine
# WinGet proof flips the matrix entry to `supported`. Today it
# fails closed at the gate (matrix marks winget `feasibility_gated`).

name: winget-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (without the leading v).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The fail-closed gate. No submission runs unless WinGet is
  # matrix-`supported` AND the phase-zero proof workflow exists.
  gate:
    uses: ./.github/workflows/channel-publish-gate.yml
    with:
      channel: winget

  submit:
    needs: gate
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v6
      - name: Submit the composite-product manifests to winget-pkgs
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # AUTHORED-PENDING (see header): a release must actually carry the
          # composed product archive, and the winget-pkgs fork/token
          # (cross-repo) must exist, before this submits. The gate has already
          # proven the channel is publishable, so reaching here means the matrix
          # marks winget `supported`.
          #
          # Report which of the two dependencies is still outstanding rather
          # than a single flat refusal, so the failure names the actual blocker.
          $manifest = 'packaging/winget/vaultspec.vaultspec.installer.yaml'
          $installer = Get-Content $manifest -Raw
          $blockers = @()
          if ($installer -match 'InstallerSha256:\s*"?0{64}') {
            $blockers += "InstallerSha256 in $manifest is still the 64-zero sentinel: no release has attached vaultspec-$env:VERSION-x86_64-pc-windows-msvc.zip, so there is no digest to publish"
          }
          $blockers += 'winget-pkgs fork + token (cross-repo submission) is not wired; komac/wingetcreate has no target to push to'
          #
          # When the blockers above are cleared, replace this refusal with the
          # komac/wingetcreate submission against packaging/winget/.
          Write-Error ("winget-publish: refusing to submit — " + ($blockers -join '; '))
          exit 1
      - name: Reclaim runner disk (always)
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
          Remove-Item -Recurse -Force $env:TEMP\vaultspec-* -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used } | Format-Table -AutoSize
