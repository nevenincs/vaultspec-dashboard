# The cheap lane: minimal code health on every pull-request push.
#
# Every push to a branch under review pays for this workflow, so it answers
# only the static questions that need neither a Rust build nor a live engine:
# the workflows and the CI/justfile contract, the dev harness, the README and
# spelling. The full tier lives in merge-gate.yml and reports the one check
# the ruleset requires; this lane is fast feedback, not the merge verdict.
#
# Nothing runs on a push to `main`: the merge gate already measured that tree.
name: Dashboard CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: "Check: Lint (Linux)"
    # A fork's pull request never starts a job: a step-level refusal would still
    # have handed the fork's workflow file a runner. The merge gate's verdict is
    # what turns a fork into a red, unmergeable check.
    #
    # Nor does any author who is neither the owner nor a collaborator. They push
    # branches of THIS repository, so the fork clause never stops them and the
    # approval requirement for outside contributors does not cover them;
    # Dependabot is the one that arrives daily. This lane has no label door -
    # it runs on every push by design - so an untrusted author's change reaches
    # the fleet through the merge gate's `ci:full` label, once a collaborator
    # has read it, and not before.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR')) }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      # INLINE AND SELF-CONTAINED, because nothing under the workspace may
      # execute before a job's own checkout. A job the runner is shut down
      # under never reaches its trailing reclaim, so its whole tree is still
      # there when the next job starts - and a script read out of that tree is
      # the previous branch's code running with this job's credentials. This
      # step therefore reads no repository file, and drops `.git/hooks`, which
      # survives `git clean` and would otherwise run a previous job's hook.
      - name: Reclaim the workspace before checkout
        shell: bash
        run: |
          set -uo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          if [ -z "${workspace}" ] || [ ! -d "${workspace}" ]; then
            echo "reclaim: no workspace yet - nothing to do"
            exit 0
          fi
          rm -rf "${workspace}/.git/hooks" 2>/dev/null || true
          # The live suite spawns a real `vaultspec serve` from the built
          # binary, which a killed job leaves holding files under
          # engine/target. Matched on the executable path under THIS
          # workspace: three runners share the machine, and a pattern broad
          # enough to catch "a vaultspec engine" would kill another
          # repository's in-flight test.
          # Unquoted on purpose below: word splitting is how the newline-
          # separated pid list becomes kill's arguments.
          left=$(pgrep -f "${workspace}/engine/target/[^ ]*/vaultspec" 2>/dev/null || true)
          if [ -n "${left}" ]; then
            echo "reclaim: stopping engine processes left from a previous job: ${left}"
            # shellcheck disable=SC2086
            kill ${left} 2>/dev/null || true
            sleep 2
            # shellcheck disable=SC2086
            kill -9 ${left} 2>/dev/null || true
          fi
          # Removing the build directory every time would throw away the
          # incremental cache, so the test is whether the file the EACCES
          # actually lands on is writable.
          probe="${workspace}/engine/target/.rustc_info.json"
          if [ -e "${probe}" ] && [ ! -w "${probe}" ]; then
            echo "reclaim: ${probe} is not writable - removing the build directory"
            rm -rf "${workspace}/engine/target" 2>/dev/null || true
          fi
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          exit 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      # Developers get typos from mise; the fleet runners do not carry mise.
      - name: Set up the pinned lint tools
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: typos@1.47.2
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The runners already share UV_CACHE_DIR; the action's own cache save
          # hung the post step on the fleet.
          prune-cache: false
          enable-cache: false
      # `dev.init` probes node and npm before any phase, so they must be on
      # PATH even though this lane installs only Python and the pinned tools.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: ''
          cache-dependency-path: frontend/package-lock.json
      - name: Provision the Python environment
        id: init-python
        run: just init-python
      - name: Provision the pinned tools
        id: init-tools
        run: just init-tools
      # Each check runs whatever the one before it concluded, so a single push
      # reports every red dimension rather than the first.
      - name: Workflows and the CI contract (just check-workflow)
        if: ${{ !cancelled() && steps.init-python.outcome == 'success' }}
        run: just check-workflow
      - name: Dev harness (just check-python)
        if: ${{ !cancelled() && steps.init-python.outcome == 'success' }}
        run: just check-python
      - name: README (just check-markdown)
        if: ${{ !cancelled() && steps.init-python.outcome == 'success' }}
        run: just check-markdown
      - name: Spelling (just check-typos)
        if: ${{ !cancelled() && steps.init-tools.outcome == 'success' }}
        run: just check-typos
