# Quality gates — the polyglot verification pipeline. Rust build/clippy/test
# live in engine-ci.yml; this workflow covers Python, the frontend SPA, repo-wide
# spell check, and the cross-language supply-chain audits. Each job is
# independent so one failure does not mask the others.
#
# Where a gate exists as a `just` verb, this workflow INVOKES it rather than
# restating its steps. It previously described itself as "mirroring" the local
# gate and re-listed the steps by hand, and the mirror was not faithful: three
# of nine frontend gates ran here, so localization, px, domain-fence, module
# size, token drift and figma-name checks never ran on a pull request. A gate
# reimplemented in YAML cannot be verified to match the gate it claims to
# mirror; calling the same entry point is the only thing that can.
name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  # Superseding a run is right on a branch and wrong on the default one.
  #
  # `main` takes direct pushes, so for such a push this workflow IS the gate.
  # Cancelling it on the next push destroys that gate, and the damage is silent:
  # a cancelled run reports as `cancelled`, not `failed`, so it is not red in
  # the Actions list and nothing downstream reacts to it. FIFTY of the last
  # hundred `main` runs ended that way - half the default branch's history
  # carries no verdict at all, which is most of why this workflow's condition
  # went unnoticed for six weeks.
  #
  # On any other ref a newer commit really does make the in-flight run
  # obsolete, so keep cancelling there.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  spellcheck:
    name: Spell check (typos)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  workflow-lint:
    # actionlint over .github/workflows — the only thing that reads these files
    # before GitHub itself does. It exists mainly for one failure class this
    # fleet is uniquely exposed to: a `runs-on:` label no registered runner
    # carries. That does not error at dispatch, it queues forever, producing no
    # logs and no failure — the most expensive way this pipeline can break. The
    # set of labels the fleet can actually schedule onto is enumerated in
    # .github/actionlint.yaml, which actionlint picks up automatically.
    #
    # Installed as the pinned upstream release binary rather than the
    # `docker://rhysd/actionlint` container action the sibling repos use. The
    # container is the stronger linter — it bundles shellcheck, and a bare binary
    # on a box without shellcheck silently skips every `run:` script check. But
    # this runner cannot carry that dependency: Docker here is Docker Desktop's
    # WSL integration, so the daemon exists only while a GUI application on the
    # Windows host happens to be running, and the credential helper is
    # `desktop.exe`. The fleet has already been bitten by exactly this — the
    # Docker-based cargo-deny action failed on that helper and was replaced with
    # a native install (see the supply-chain job below). "Docker responds right
    # now" is not the same property as "this gate runs on every push", and a lint
    # gate that goes red because nobody opened Docker Desktop is a gate people
    # learn to ignore. A tarball plus a checksum needs no daemon, no registry
    # auth, and no Docker Desktop.
    #
    # The cost of that choice is paid honestly rather than hidden: shellcheck and
    # pyflakes are disabled EXPLICITLY below. Leaving them implicit would mean
    # that installing shellcheck on this runner for any unrelated reason silently
    # turns this gate red. The eight shellcheck findings the container did surface
    # have all been fixed in the tree, so enabling shellcheck here is a
    # provisioning task (put shellcheck on the runner, drop the `-shellcheck=`
    # flag) and not a cleanup one.
    #
    # Pinned to an exact version rather than `latest` for the usual reason a
    # linter is pinned: a new upstream release adds checks, and a gate that can
    # go red without anything in this repository changing is a gate people learn
    # to ignore. Bump deliberately, fixing whatever the new version finds in the
    # same commit.
    #
    # One coordination note: release.yml is hand-managed (dist-workspace.toml
    # sets `allow-dirty = ["ci"]`), and some of the findings this gate caught
    # were fixed there. If `dist generate-ci` ever regenerates that file, those
    # shellcheck fixes must be re-applied along with the fleet `runs-on` labels.
    name: Workflow lint (actionlint)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        shell: bash
        env:
          # Pinned by version AND digest: this step downloads an executable and
          # runs it, so the release archive is verified before it is unpacked.
          #
          # The digest is pinned PER ARCHITECTURE, and that is the whole point
          # rather than a tidiness measure. This previously named
          # `linux_amd64.tar.gz` unconditionally with a single digest. On an
          # ARM64 runner that does not fail the check — it PASSES it, because
          # the downloaded file really is the amd64 archive the digest names —
          # and then dies at `Exec format error` one line later. A verification
          # step that reports success while handing back an unusable binary is
          # worse than none, because it reads as assurance. The digest has to
          # prove "the right binary for THIS machine", not "the file I asked
          # for". Both digests are the ones published in the upstream checksums
          # file for this exact version; bump the version and all digests
          # together.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          # Refuse anything unpinned by NAME rather than falling through to a
          # default. A default here is how the original defect would return:
          # silently downloading the wrong thing and verifying it successfully.
          kernel="$(uname -s)"
          if [ "$kernel" != "Linux" ]; then
            echo "::error::this step pins only Linux actionlint archives; runner reports '$kernel'" >&2
            exit 1
          fi
          machine="$(uname -m)"
          case "$machine" in
            x86_64|amd64)  goarch=amd64; want="$ACTIONLINT_SHA256_AMD64" ;;
            aarch64|arm64) goarch=arm64; want="$ACTIONLINT_SHA256_ARM64" ;;
            *)
              echo "::error::no pinned actionlint digest for architecture '$machine'; refusing to run an unverified binary" >&2
              exit 1
              ;;
          esac
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${goarch}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${want}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # Prove the binary EXECUTES on this machine before trusting the gate.
          # This is the check the digest cannot make: a correct digest for the
          # wrong architecture passes verification and fails here instead, which
          # is where an architecture mismatch should surface.
          "$RUNNER_TEMP/actionlint" --version
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "${RUNNER_TEMP:-/tmp}"/actionlint "${RUNNER_TEMP:-/tmp}"/actionlint_*.tar.gz 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  guards:
    # The repository-health guards under `dev/guards` — and, until this job
    # existed, the one part of the local gate that CI never ran. They are
    # reachable as `just lint guards` and `just test guards`, both of which
    # expand to the same pytest invocation, and NO workflow in .github/ invoked
    # either: a grep of this directory for `pytest`, `dev/guards`, `just lint`
    # and `just test` returned the frontend job and nothing else. So the
    # invariants they assert — that every justfile recipe dispatches into
    # `dev/`, that the recipes and `dev/toolchain.py`'s target table describe
    # the same commands, that the src/dev/harness import fence holds, that
    # dependencies are declared and tooling lives in its stated home — held
    # only on a machine where somebody had typed the command. On every push and
    # every pull request they asserted nothing.
    #
    # That is worse than not having them, because the tree cites them as
    # settled. The justfile's own header tells a reader that a shell branch
    # reintroduced into a recipe body "fails the build rather than quietly
    # working on one machine"; no build was checking, so the sentence was an
    # assurance nothing backed. A guard that runs nowhere is a test file.
    #
    # The gate is INVOKED through `just`, never restated as a bare
    # `pytest dev/guards` — the same rule as the frontend job below, and here
    # it is load-bearing twice over. test_dispatch_conformance.py asserts that
    # the justfile and the toolchain table agree, so a step reaching past both
    # to call pytest directly would be verifying a dispatch layer it had just
    # gone around, and would keep reporting success after the recipe it claims
    # to exercise was renamed or deleted.
    #
    # `just bootstrap` is required rather than defensive: the guards run under
    # `uv run --no-sync`, which deliberately will not provision `.venv`, so
    # without the sync there is no pytest to spawn and the step dies at
    # "program not found" instead of reporting on a guard. Nothing here builds
    # — the guards read the tree and import `dev.*` — so this job needs neither
    # Node nor a Rust toolchain and stays one of the cheap ones.
    name: Repo guards (just lint guards · pytest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v6
      - name: Provision the dev toolchain
        run: just bootstrap
      - name: Guards (just lint guards)
        run: just lint guards
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  frontend:
    name: Frontend (just lint frontend · vitest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # The gate is INVOKED, never re-listed. This job previously named three
      # npm scripts by hand while `just lint frontend` ran nine, so six gates —
      # localization, px, domains, module size, token drift, and figma names —
      # never ran on a pull request at all. A gate reimplemented in YAML cannot
      # be verified to match the gate; only calling the same entry point can.
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v6
      - name: Provision the dev toolchain
        run: just bootstrap
      - name: Lint (just lint frontend)
        run: just lint frontend
      # The frontend suite is online-live by design (no in-memory doubles): its
      # vitest global setup spawns a REAL `vaultspec serve` and runs
      # `vaultspec-core install` against a scratch vault. Provision both — the
      # built engine binary and vaultspec-core on PATH — before vitest, or the
      # whole suite errors at global setup.
      # Pin to the repo toolchain (the action's RUSTUP_TOOLCHAIN export
      # overrides engine/rust-toolchain.toml, so pass the pin explicitly).
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Resolve where the build actually lands BEFORE building, so every
      # reference to a built binary below is right in both configurations: the
      # runners share one persistent cargo target directory outside the
      # workspace (a checkout cleans the workspace-local one), while a plain
      # checkout builds into `engine/target`. Read-side only — this never
      # redirects the build, it names the directory the build used.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Build engine binary (live-engine test backend)
        run: cargo build --bin vaultspec
        working-directory: engine
      - name: Install vaultspec-core (live-engine declared-tier dependency)
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      # Captured to a file rather than piped, so the suite's OWN exit code is
      # what fails the step, and so the classifier below has the output to read
      # even when the job is killed before anything else can inspect it.
      - name: Unit tests (just test frontend)
        shell: bash
        run: |
          set +e
          just test frontend > "${RUNNER_TEMP}/frontend-suite.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/frontend-suite.log"
          exit $status
        env:
          # Pin the exact binary the live suite spawns. Its own fallback probes
          # `engine/target/{release,debug}`, which does not exist when the build
          # landed in the shared directory — the suite would then fail at global
          # setup with "no vaultspec engine binary found" rather than running.
          VAULTSPEC_TEST_ENGINE_BIN: ${{ env.ENGINE_TARGET_DIR }}/debug/vaultspec
      # A red here means one of two unrelated things and, until now, looked
      # identical either way: an assertion failed, or the runner died. vitest
      # prints its summary only after running to completion, so its ABSENCE is
      # what separates them - a signature only names a known fault, and never
      # decides, so an unrecognised infrastructure failure is still not reported
      # as a test verdict.
      - name: Say which kind of red this is
        if: failure()
        shell: bash
        run: |
          log="${RUNNER_TEMP}/frontend-suite.log"
          uv run --no-sync python -m dev.classify_failure "$log" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Unused code (just lint knip — advisory)
        run: just lint knip
        continue-on-error: true
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  engine-conformance:
    # Consumer-typed conformance: boot a
    # live vaultspec serve binary against a two-commit fixture and drive
    # EngineClient against it so wire-vs-TypeScript-type drift fails CI.
    # This closes the seam the Rust conformance.rs cannot reach (c812371).
    name: Engine TS conformance (live serve · EngineClient)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # Pin to the repo toolchain (see the frontend job's note).
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # See the frontend job: resolve the build output directory before the
      # build so the `serve` invocation below names the binary that was built.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Build engine binary
        run: cargo build --bin vaultspec
        working-directory: engine
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: astral-sh/setup-uv@v6
      - name: Install vaultspec-core (live-engine declared-tier dependency)
        # The engine startup gate probes vaultspec-core on PATH (floor 0.1.36);
        # without it `vaultspec serve` fails and the conformance test errors with
        # "executable not found on PATH: vaultspec-core". Mirror the frontend job.
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Create fixture and start serve
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE=$(mktemp -d)
          cd "$FIXTURE"
          git init -b main .
          git config user.email "ci@test"
          git config user.name "CI"
          git config core.autocrlf false
          mkdir -p .vault/adr
          printf '%s\n' '---' 'tags:' "  - '#adr'" "  - '#engine-conformance'" \
            "date: '2026-06-13'" '---' '' '# conformance adr' '' 'CI fixture.' \
            > .vault/adr/2026-06-13-conformance-adr.md
          # Commit at fixed PAST dates relative to now: the conformance test's
          # graph/diff window is `corpusTs(now) - 14d .. now`, so the root commit
          # must predate it (else the engine 400s "timestamp predates the root
          # commit"). T1 at 30d ago anchors the root behind the window; T2 at 7d
          # ago lands inside it so the diff carries a real delta.
          T1_DATE="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%S')"
          T2_DATE="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%S')"
          git add .
          GIT_AUTHOR_DATE="$T1_DATE" GIT_COMMITTER_DATE="$T1_DATE" git commit -m "T1: adr"
          printf 'update\n' >> .vault/adr/2026-06-13-conformance-adr.md
          git add .
          GIT_AUTHOR_DATE="$T2_DATE" GIT_COMMITTER_DATE="$T2_DATE" git commit -m "T2: update"

          # Start serve on an OS-assigned port; service.json carries the real
          # port + token (same pattern as conformance.rs start_serve).
          "$ENGINE_TARGET_DIR/debug/vaultspec" serve --port 0 &
          SERVE_PID=$!
          echo "SERVE_PID=$SERVE_PID" >> "$GITHUB_ENV"

          SERVICE_JSON="$FIXTURE/.vault/data/engine-data/service.json"
          for _ in $(seq 30); do
            if [ -f "$SERVICE_JSON" ]; then
              PORT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['port'])" "$SERVICE_JSON")
              TOKEN=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['service_token'])" "$SERVICE_JSON")
              if [ "$PORT" != "0" ] && [ -n "$TOKEN" ]; then break; fi
            fi
            sleep 1
          done

          echo "ENGINE_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "ENGINE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run TS conformance test
        run: npx vitest run src/testing/engineConformance.test.ts --reporter=verbose
        working-directory: frontend
        env:
          ENGINE_BASE_URL: ${{ env.ENGINE_BASE_URL }}
          ENGINE_TOKEN: ${{ env.ENGINE_TOKEN }}
      - name: Stop serve
        if: always()
        run: kill "$SERVE_PID" 2>/dev/null || true
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  scoop-bucket-guard:
    name: Scoop bucket version guard
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard the committed Scoop manifest
        shell: bash
        run: |
          set -euo pipefail
          # The manifest is a release POINTER: it names a version and pins a
          # digest that `scoop install` acts on. This guard protects two
          # properties of it, and the second was added because the first alone
          # let a broken pointer sit here for four releases.
          #
          # No manifest is committed until the bump job first succeeds, so
          # "absent" is a real and expected state on both sides. `jq` on a
          # missing file is a hard failure under `set -e`, which is what the
          # version-only form of this guard did.
          base_json="$(git show "origin/${{ github.base_ref }}:bucket/vaultspec.json" 2>/dev/null || true)"
          head_json=""
          [ -f bucket/vaultspec.json ] && head_json="$(cat bucket/vaultspec.json)"

          # Returns 0 when the manifest's url is definitely absent. A network
          # fault is NOT treated as absent: only a 404/410 counts, so a flaky
          # runner cannot turn this gate into a false accusation.
          url_is_gone() {
            local url code
            url=$(printf '%s' "$1" | jq -r '.url')
            [ -n "$url" ] && [ "$url" != "null" ] || return 1
            code=$(curl --proto '=https' --tlsv1.2 -sS -o /dev/null -w '%{http_code}' \
                     -I -L --max-time 30 "$url" 2>/dev/null || echo 000)
            echo "  ${url} -> HTTP ${code}"
            [ "$code" = "404" ] || [ "$code" = "410" ]
          }

          if [ -z "$head_json" ]; then
            if [ -z "$base_json" ]; then
              echo "no manifest on either side — nothing to publish yet, OK"
              exit 0
            fi
            # Removing a WORKING pointer un-publishes the product. Removing one
            # that resolves to nothing only deletes a false claim, which is the
            # honest fix and must stay possible.
            echo "manifest removed; checking whether the base pointer resolved"
            if url_is_gone "$base_json"; then
              echo "base manifest pointed at a non-existent asset — removal OK"
              exit 0
            fi
            echo "ERROR: refusing to remove a manifest whose url still resolves." >&2
            echo "Removing it would un-publish the product for Scoop users." >&2
            exit 1
          fi

          # A committed manifest must point at something real. This is the
          # property whose absence let 0.1.2 ship with a 404 url and a
          # placeholder digest, install-breaking, out of a green run.
          echo "manifest present; checking its url resolves"
          if url_is_gone "$head_json"; then
            echo "ERROR: bucket/vaultspec.json points at an asset that does not exist." >&2
            echo "A manifest is a claim a user acts on; do not commit one that 404s." >&2
            exit 1
          fi

          HEAD_VERSION=$(printf '%s' "$head_json" | jq -r '.version')
          if [ -z "$base_json" ]; then
            echo "first published manifest (${HEAD_VERSION}) — OK"
            exit 0
          fi
          BASE_VERSION=$(printf '%s' "$base_json" | jq -r '.version')
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "bucket version unchanged (${HEAD_VERSION}) — OK"
            exit 0
          fi
          HIGHER=$(printf '%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -1)
          if [ "$HIGHER" != "$HEAD_VERSION" ]; then
            echo "ERROR: bucket/vaultspec.json would decrease from ${BASE_VERSION} to ${HEAD_VERSION}" >&2
            echo "Update the bucket to a version >= ${BASE_VERSION} before merging." >&2
            exit 1
          fi
          echo "bucket version ${BASE_VERSION} -> ${HEAD_VERSION} — forward, OK"
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  supply-chain:
    name: Supply chain (cargo-deny · uv audit · npm audit)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny (native — no Docker on the self-hosted runner)
        shell: bash
        run: |
          # Install cargo-deny into the shared CARGO_HOME/bin so it is reused
          # across runs (built once); the Docker-based action fails on the
          # self-hosted runner's credential helper.
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
          cargo deny --manifest-path engine/Cargo.toml check
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: uv audit (runtime surface; dev-only torch excluded per wheel-purity)
        run: uv audit --no-dev --preview-features audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # Gate on the SHIPPED surface, mirroring the uv step above: what reaches a
      # user is the built SPA embedded in the engine binary, so the runtime
      # dependency tree is the one that must be clean. Build-time tooling is
      # audited too, one step below, but advisories there are a maintenance
      # signal about our own build box — not a reason to refuse a release.
      - name: npm audit (runtime surface)
        run: npm --prefix frontend audit --omit=dev
      - name: npm audit (build tooling — advisory)
        run: npm --prefix frontend audit
        continue-on-error: true
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  release-inputs-gate:
    # The release-inputs gate: validate the
    # component lock, the release-set-manifest schema, and the product builder +
    # its manifest verifiers BEFORE any release job may run. The vaultspec-product
    # suite composes + self-verifies real product trees against the committed lock
    # and exercises the lock/capsule/release-manifest verifiers, so a drift between
    # the pins, the schema, and the builder fails here rather than at release.
    name: Release inputs (lock · schema · product builder)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Component lock + release-set-manifest schema are well-formed
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('packaging/a2a-component.lock.json'))"
          python3 -c "import json; json.load(open('schemas/release-set-manifest.json'))"
      # The committed lock must agree with the manifest. Nothing else in this
      # file passes `--locked`, so without this step cargo silently refreshes
      # the lock in memory and every build succeeds over a tree that is not
      # reproducible. That is how the drift became recurring: release-please
      # bumps `[workspace.package] version` in engine/Cargo.toml and does not
      # regenerate engine/Cargo.lock, and no instrument was positioned to see
      # it. `cargo metadata` resolves without building, so this is cheap and
      # fails fast, on the release PR itself.
      - name: The committed Cargo.lock agrees with Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null
        working-directory: engine
      - name: Product builder, manifest verifiers, and lock/capsule/release pins
        run: cargo test -p vaultspec-product
        working-directory: engine
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
