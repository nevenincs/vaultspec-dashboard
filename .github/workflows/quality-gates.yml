name: Dashboard correctness

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      uv_cache_mode:
        description: uv namespace for controlled validation
        type: choice
        required: true
        default: ordinary
        options: [ordinary, isolated-cold]
      run_supply_chain:
        description: run the scheduled supply-chain diagnostic
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.repository, github.event.pull_request.number) || github.event_name == 'push' && format('{0}-main-correctness-{1}', github.repository, github.ref) || format('{0}-{1}-{2}', github.repository, github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: PR fast checks
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Reclaim workspace
        shell: bash
        run: bash .github/scripts/reclaim-workspace.sh || true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select isolated cold uv namespace
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.uv_cache_mode == 'isolated-cold') ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-isolated-cold'))
        shell: bash
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/vaultspec-dashboard-uv-cold-$GITHUB_RUN_ID-fast" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68
        with:
          tool: just@1.38.0
      - name: Install spell checker
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68
        with:
          tool: typos-cli@1.47.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - name: Initialize once
        run: just init
      - name: Workflow and CI contract
        run: just check-workflow
      - name: Spelling
        run: just check-typos
      - name: Repository guards
        run: just check-guards
      - name: Release inputs and lock metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('packaging/a2a-component.lock.json'))"
          python3 -c "import json; json.load(open('schemas/release-set-manifest.json'))"
          cargo metadata --locked --format-version 1 --manifest-path engine/Cargo.toml >/dev/null
      - name: Scoop manifest governance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_json="$(git show "$BASE_SHA:bucket/vaultspec.json" 2>/dev/null || true)"
          head_json=""
          [ -f bucket/vaultspec.json ] && head_json="$(cat bucket/vaultspec.json)"
          url_is_gone() {
            local url code
            url=$(printf '%s' "$1" | jq -r '.url')
            [ -n "$url" ] && [ "$url" != "null" ] || return 1
            code=$(curl --proto '=https' --tlsv1.2 -sS -o /dev/null -w '%{http_code}' \
                     -I -L --max-time 30 "$url" 2>/dev/null || echo 000)
            [ "$code" = "404" ] || [ "$code" = "410" ]
          }
          if [ -z "$head_json" ]; then
            [ -z "$base_json" ] && exit 0
            url_is_gone "$base_json" && exit 0
            echo "::error::refusing to remove a Scoop manifest whose URL still resolves" >&2
            exit 1
          fi
          url_is_gone "$head_json" && { echo "::error::Scoop manifest URL does not exist" >&2; exit 1; }
          HEAD_VERSION=$(printf '%s' "$head_json" | jq -r '.version')
          [ -z "$base_json" ] && exit 0
          BASE_VERSION=$(printf '%s' "$base_json" | jq -r '.version')
          [ "$BASE_VERSION" = "$HEAD_VERSION" ] && exit 0
          HIGHER=$(printf '%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -1)
          [ "$HIGHER" = "$HEAD_VERSION" ] || { echo "::error::Scoop version would decrease" >&2; exit 1; }

  linux:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: PR Linux correctness
    needs: fast
    timeout-minutes: 75
    runs-on: [self-hosted, Linux, X64]
    steps: &correctness
      - name: Reclaim workspace
        shell: bash
        run: bash .github/scripts/reclaim-workspace.sh || true
      - uses: actions/checkout@v4
      - name: Select isolated cold uv namespace
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.uv_cache_mode == 'isolated-cold') ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-isolated-cold'))
        shell: bash
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/vaultspec-dashboard-uv-cold-$GITHUB_RUN_ID-linux" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68
        with:
          tool: just@1.38.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Initialize once
        run: just init
      - name: Put vaultspec-core on PATH
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Resolve engine output
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Rust checks
        run: just check-rust
      - name: Frontend checks
        run: just check-frontend
      - name: Build engine once
        run: just build-rust
      - name: Engine TS conformance (live serve · EngineClient)
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE=$(mktemp -d)
          cd "$FIXTURE"
          git init -b main .
          git config user.email "ci@test"
          git config user.name "CI"
          git config core.autocrlf false
          mkdir -p .vault/adr
          printf '%s\n' '---' 'tags:' "  - '#adr'" "  - '#engine-conformance'" \
            "date: '2026-06-13'" '---' '' '# conformance adr' '' 'CI fixture.' \
            > .vault/adr/2026-06-13-conformance-adr.md
          T1_DATE="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%S')"
          T2_DATE="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%S')"
          git add .
          GIT_AUTHOR_DATE="$T1_DATE" GIT_COMMITTER_DATE="$T1_DATE" git commit -m "T1: adr"
          printf 'update\n' >> .vault/adr/2026-06-13-conformance-adr.md
          git add .
          GIT_AUTHOR_DATE="$T2_DATE" GIT_COMMITTER_DATE="$T2_DATE" git commit -m "T2: update"
          "$ENGINE_TARGET_DIR/release/vaultspec" serve --port 0 &
          SERVE_PID=$!
          echo "SERVE_PID=$SERVE_PID" >> "$GITHUB_ENV"
          SERVICE_JSON="$FIXTURE/.vault/data/engine-data/service.json"
          for _ in $(seq 1 30); do
            if [ -f "$SERVICE_JSON" ]; then
              PORT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['port'])" "$SERVICE_JSON")
              TOKEN=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['service_token'])" "$SERVICE_JSON")
              if [ "$PORT" != "0" ] && [ -n "$TOKEN" ]; then break; fi
            fi
            sleep 1
          done
          echo "ENGINE_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "ENGINE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run focused TS conformance assertion
        run: npx vitest run src/testing/engineConformance.test.ts --reporter=verbose
        working-directory: frontend
        env:
          ENGINE_BASE_URL: ${{ env.ENGINE_BASE_URL }}
          ENGINE_TOKEN: ${{ env.ENGINE_TOKEN }}
      - name: Stop focused conformance serve
        if: always()
        shell: bash
        run: kill "$SERVE_PID" 2>/dev/null || true
      - name: Full frontend tests
        run: just test-frontend
        env:
          VAULTSPEC_TEST_ENGINE_BIN: ${{ env.ENGINE_TARGET_DIR }}/release/vaultspec
      - name: Full Rust tests
        run: just test-rust
      - name: Reclaim runner disk
        if: always()
        shell: bash
        run: |
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true

  main-linux:
    if: github.event_name == 'push'
    name: Main Linux correctness
    timeout-minutes: 75
    runs-on: [self-hosted, Linux, X64]
    steps: *correctness

  supply-chain:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_supply_chain)
    name: Supply-chain diagnostic
    timeout-minutes: 45
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68
        with:
          tool: just@1.38.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: just init
      - run: just audit-deps
      - run: just audit-rust
      - run: just audit-node-tooling
        continue-on-error: true
