# Quality gates — the polyglot verification pipeline that mirrors `just dev lint`
# and `just dev audit`. Rust build/clippy/test live in engine-ci.yml; this
# workflow covers Python, the frontend SPA, repo-wide spell check, and the
# cross-language supply-chain audits. Each job is independent so one failure
# does not mask the others.
name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    name: Spell check (typos)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  workflow-lint:
    # actionlint over .github/workflows — the only thing that reads these files
    # before GitHub itself does. It exists mainly for one failure class this
    # fleet is uniquely exposed to: a `runs-on:` label no registered runner
    # carries. That does not error at dispatch, it queues forever, producing no
    # logs and no failure — the most expensive way this pipeline can break. The
    # set of labels the fleet can actually schedule onto is enumerated in
    # .github/actionlint.yaml, which actionlint picks up automatically.
    #
    # Installed as the pinned upstream release binary rather than the
    # `docker://rhysd/actionlint` container action the sibling repos use. The
    # container is the stronger linter — it bundles shellcheck, and a bare binary
    # on a box without shellcheck silently skips every `run:` script check. But
    # this runner cannot carry that dependency: Docker here is Docker Desktop's
    # WSL integration, so the daemon exists only while a GUI application on the
    # Windows host happens to be running, and the credential helper is
    # `desktop.exe`. The fleet has already been bitten by exactly this — the
    # Docker-based cargo-deny action failed on that helper and was replaced with
    # a native install (see the supply-chain job below). "Docker responds right
    # now" is not the same property as "this gate runs on every push", and a lint
    # gate that goes red because nobody opened Docker Desktop is a gate people
    # learn to ignore. A tarball plus a checksum needs no daemon, no registry
    # auth, and no Docker Desktop.
    #
    # The cost of that choice is paid honestly rather than hidden: shellcheck and
    # pyflakes are disabled EXPLICITLY below. Leaving them implicit would mean
    # that installing shellcheck on this runner for any unrelated reason silently
    # turns this gate red. The eight shellcheck findings the container did surface
    # have all been fixed in the tree, so enabling shellcheck here is a
    # provisioning task (put shellcheck on the runner, drop the `-shellcheck=`
    # flag) and not a cleanup one.
    #
    # Pinned to an exact version rather than `latest` for the usual reason a
    # linter is pinned: a new upstream release adds checks, and a gate that can
    # go red without anything in this repository changing is a gate people learn
    # to ignore. Bump deliberately, fixing whatever the new version finds in the
    # same commit.
    #
    # One coordination note: release.yml is hand-managed (dist-workspace.toml
    # sets `allow-dirty = ["ci"]`), and some of the findings this gate caught
    # were fixed there. If `dist generate-ci` ever regenerates that file, those
    # shellcheck fixes must be re-applied along with the fleet `runs-on` labels.
    name: Workflow lint (actionlint)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        shell: bash
        env:
          # Pinned by version AND digest: this step downloads an executable and
          # runs it, so the release archive is verified before it is unpacked.
          # The digest is the one published in the upstream checksums file for
          # this exact version; bump both together.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "${RUNNER_TEMP:-/tmp}"/actionlint "${RUNNER_TEMP:-/tmp}"/actionlint_*.tar.gz 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  frontend:
    name: Frontend (eslint · prettier · tsc · vitest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: ESLint
        run: npm --prefix frontend run lint
      - name: Prettier check
        run: npm --prefix frontend run format:check
      - name: Type check (tsc)
        run: npm --prefix frontend run typecheck
      # The frontend suite is online-live by design (no in-memory doubles): its
      # vitest global setup spawns a REAL `vaultspec serve` and runs
      # `vaultspec-core install` against a scratch vault. Provision both — the
      # built engine binary and vaultspec-core on PATH — before vitest, or the
      # whole suite errors at global setup.
      # Pin to the repo toolchain (the action's RUSTUP_TOOLCHAIN export
      # overrides engine/rust-toolchain.toml, so pass the pin explicitly).
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Resolve where the build actually lands BEFORE building, so every
      # reference to a built binary below is right in both configurations: the
      # runners share one persistent cargo target directory outside the
      # workspace (a checkout cleans the workspace-local one), while a plain
      # checkout builds into `engine/target`. Read-side only — this never
      # redirects the build, it names the directory the build used.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Build engine binary (live-engine test backend)
        run: cargo build --bin vaultspec
        working-directory: engine
      - uses: astral-sh/setup-uv@v6
      - name: Install vaultspec-core (live-engine declared-tier dependency)
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Unit tests (vitest)
        run: npm --prefix frontend run test
        env:
          # Pin the exact binary the live suite spawns. Its own fallback probes
          # `engine/target/{release,debug}`, which does not exist when the build
          # landed in the shared directory — the suite would then fail at global
          # setup with "no vaultspec engine binary found" rather than running.
          VAULTSPEC_TEST_ENGINE_BIN: ${{ env.ENGINE_TARGET_DIR }}/debug/vaultspec
      - name: Unused code (knip — advisory)
        run: npx --yes knip@5 --directory frontend
        continue-on-error: true
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  engine-conformance:
    # Consumer-typed conformance: boot a
    # live vaultspec serve binary against a two-commit fixture and drive
    # EngineClient against it so wire-vs-TypeScript-type drift fails CI.
    # This closes the seam the Rust conformance.rs cannot reach (c812371).
    name: Engine TS conformance (live serve · EngineClient)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # Pin to the repo toolchain (see the frontend job's note).
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # See the frontend job: resolve the build output directory before the
      # build so the `serve` invocation below names the binary that was built.
      - name: Resolve the engine build output directory
        shell: bash
        run: echo "ENGINE_TARGET_DIR=${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/engine/target}" >> "$GITHUB_ENV"
      - name: Build engine binary
        run: cargo build --bin vaultspec
        working-directory: engine
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: astral-sh/setup-uv@v6
      - name: Install vaultspec-core (live-engine declared-tier dependency)
        # The engine startup gate probes vaultspec-core on PATH (floor 0.1.36);
        # without it `vaultspec serve` fails and the conformance test errors with
        # "executable not found on PATH: vaultspec-core". Mirror the frontend job.
        shell: bash
        run: |
          uv tool install vaultspec-core
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Create fixture and start serve
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE=$(mktemp -d)
          cd "$FIXTURE"
          git init -b main .
          git config user.email "ci@test"
          git config user.name "CI"
          git config core.autocrlf false
          mkdir -p .vault/adr
          printf '%s\n' '---' 'tags:' "  - '#adr'" "  - '#engine-conformance'" \
            "date: '2026-06-13'" '---' '' '# conformance adr' '' 'CI fixture.' \
            > .vault/adr/2026-06-13-conformance-adr.md
          # Commit at fixed PAST dates relative to now: the conformance test's
          # graph/diff window is `corpusTs(now) - 14d .. now`, so the root commit
          # must predate it (else the engine 400s "timestamp predates the root
          # commit"). T1 at 30d ago anchors the root behind the window; T2 at 7d
          # ago lands inside it so the diff carries a real delta.
          T1_DATE="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%S')"
          T2_DATE="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%S')"
          git add .
          GIT_AUTHOR_DATE="$T1_DATE" GIT_COMMITTER_DATE="$T1_DATE" git commit -m "T1: adr"
          printf 'update\n' >> .vault/adr/2026-06-13-conformance-adr.md
          git add .
          GIT_AUTHOR_DATE="$T2_DATE" GIT_COMMITTER_DATE="$T2_DATE" git commit -m "T2: update"

          # Start serve on an OS-assigned port; service.json carries the real
          # port + token (same pattern as conformance.rs start_serve).
          "$ENGINE_TARGET_DIR/debug/vaultspec" serve --port 0 &
          SERVE_PID=$!
          echo "SERVE_PID=$SERVE_PID" >> "$GITHUB_ENV"

          SERVICE_JSON="$FIXTURE/.vault/data/engine-data/service.json"
          for _ in $(seq 30); do
            if [ -f "$SERVICE_JSON" ]; then
              PORT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['port'])" "$SERVICE_JSON")
              TOKEN=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['service_token'])" "$SERVICE_JSON")
              if [ "$PORT" != "0" ] && [ -n "$TOKEN" ]; then break; fi
            fi
            sleep 1
          done

          echo "ENGINE_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "ENGINE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run TS conformance test
        run: npx vitest run src/testing/engineConformance.test.ts --reporter=verbose
        working-directory: frontend
        env:
          ENGINE_BASE_URL: ${{ env.ENGINE_BASE_URL }}
          ENGINE_TOKEN: ${{ env.ENGINE_TOKEN }}
      - name: Stop serve
        if: always()
        run: kill "$SERVE_PID" 2>/dev/null || true
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  scoop-bucket-guard:
    name: Scoop bucket version guard
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject version decrease in bucket/vaultspec.json
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:bucket/vaultspec.json" | jq -r '.version')
          HEAD_VERSION=$(jq -r '.version' bucket/vaultspec.json)
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "bucket version unchanged (${HEAD_VERSION}) — OK"
            exit 0
          fi
          HIGHER=$(printf '%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -1)
          if [ "$HIGHER" != "$HEAD_VERSION" ]; then
            echo "ERROR: bucket/vaultspec.json would decrease from ${BASE_VERSION} to ${HEAD_VERSION}" >&2
            echo "Update the bucket to a version >= ${BASE_VERSION} before merging." >&2
            exit 1
          fi
          echo "bucket version ${BASE_VERSION} -> ${HEAD_VERSION} — forward, OK"
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          rm -rf "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          df -h . 2>/dev/null | tail -1

  supply-chain:
    name: Supply chain (cargo-deny · uv audit · npm audit)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny (native — no Docker on the self-hosted runner)
        shell: bash
        run: |
          # Install cargo-deny into the shared CARGO_HOME/bin so it is reused
          # across runs (built once); the Docker-based action fails on the
          # self-hosted runner's credential helper.
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
          cargo deny --manifest-path engine/Cargo.toml check
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: uv audit (runtime surface; dev-only torch excluded per wheel-purity)
        run: uv audit --no-dev --preview-features audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # Gate on the SHIPPED surface, mirroring the uv step above: what reaches a
      # user is the built SPA embedded in the engine binary, so the runtime
      # dependency tree is the one that must be clean. Build-time tooling is
      # audited too, one step below, but advisories there are a maintenance
      # signal about our own build box — not a reason to refuse a release.
      - name: npm audit (runtime surface)
        run: npm --prefix frontend audit --omit=dev
      - name: npm audit (build tooling — advisory)
        run: npm --prefix frontend audit
        continue-on-error: true
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1

  release-inputs-gate:
    # The release-inputs gate: validate the
    # component lock, the release-set-manifest schema, and the product builder +
    # its manifest verifiers BEFORE any release job may run. The vaultspec-product
    # suite composes + self-verifies real product trees against the committed lock
    # and exercises the lock/capsule/release-manifest verifiers, so a drift between
    # the pins, the schema, and the builder fails here rather than at release.
    name: Release inputs (lock · schema · product builder)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' engine/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Component lock + release-set-manifest schema are well-formed
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('packaging/a2a-component.lock.json'))"
          python3 -c "import json; json.load(open('schemas/release-set-manifest.json'))"
      - name: Product builder, manifest verifiers, and lock/capsule/release pins
        run: cargo test -p vaultspec-product
        working-directory: engine
      - name: Reclaim runner disk (always)
        if: always()
        shell: bash
        run: |
          set +e
          df -h . 2>/dev/null | tail -1
          pkill -f 'vaultspec .*serve' 2>/dev/null || true
          pkill -f '/debug/vaultspec' 2>/dev/null || true
          rm -rf "${TMPDIR:-/tmp}"/vaultspec-livetest-* "${RUNNER_TEMP:-/tmp}"/vaultspec-* 2>/dev/null || true
          if [ "${{ job.status }}" = "failure" ]; then
            rm -rf engine/target frontend/node_modules 2>/dev/null || true
          fi
          df -h . 2>/dev/null | tail -1
