# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json
# The WinGet en-US locale manifest. PackageVersion must match the installer and
# version manifests exactly — winget validation rejects a manifest set whose
# three PackageVersion values disagree.
PackageIdentifier: vaultspec.vaultspec
PackageVersion: 0.1.10
PackageLocale: en-US
Publisher: vaultspec
PublisherUrl: https://github.com/nevenincs/vaultspec-dashboard
PackageName: vaultspec
PackageUrl: https://github.com/nevenincs/vaultspec-dashboard
License: MIT
LicenseUrl: https://github.com/nevenincs/vaultspec-dashboard/blob/main/LICENSE
ShortDescription: The complete vaultspec dashboard product — dashboard, copied updater, release manifest, licenses, and SBOM as one offline-complete tree.
Description: >-
  vaultspec installs the whole offline product tree from the composed release
  archive and verifies it against its release manifest with the shipped bounded
  authority. WinGet extracts that archive and puts a single command, vaultspec,
  on PATH; the updater, licenses, release manifest and SBOM stay beside it in
  the extracted tree, which is what lets vaultspec verify-release check the tree
  it is actually running from. Only the composite install/update/removal
  channels are supported; a bare cargo install is not.
Moniker: vaultspec
Tags:
  - dashboard
  - vaultspec
  - developer-tools
ManifestType: defaultLocale
ManifestVersion: 1.6.0
