[workspace]
members = ["cargo:engine"]
# WHAT THE RELEASE IS ALLOWED TO PUBLISH. Without this list dist walks the whole
# engine workspace and archives every crate that produces a binary, which is how
# v0.1.8 came to carry 36 assets covering four separate "products":
#
#   vaultspec-cli             the dashboard itself - the only one a user wants
#   vaultspec-updater         a COMPONENT of the product tree, not a product;
#                             the installers place it out of the tree, and
#                             shipping it loose invites installing it alone
#   vaultspec-release-verify  a wrapper whose main() discards its result and
#                             exits 2 printing REFUSED, for every input, by
#                             design while signed distribution is deferred
#   vaultspec-product         product_build, product_certify and cohort_digest -
#                             the MAINTAINER TOOLING THAT COMPOSES A RELEASE,
#                             published under a name that reads like the product
#
# The last one is the reason this list exists. `vaultspec-product` is the crate
# that builds the product, so its archive was named `vaultspec-product-<target>`
# and sat on the release looking like the thing itself, ~800KB of build tooling
# beside an 8-12MB dashboard. Nobody chose to publish it; nobody excluded it
# either, because the default is to publish everything that compiles.
#
# An allowlist rather than `dist = false` on each crate: it states the release
# surface in ONE place a reader can check against the release page, and it lands
# above both `dist = true` and Cargo's `publish = false` in dist's precedence, so
# a new binary crate is unpublished until this line says otherwise. Verified
# against the pinned 0.32.0 binary in both directions - the allowlist suppresses
# a crate carrying `dist = true`, and admits one carrying `publish = false`.
packages = ["vaultspec-cli"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No Cargo Dist installers: Dist's generated shell/PowerShell/MSI installers are
# BINARY-ONLY — they place the `vaultspec` binary but not the complete offline
# product tree (dashboard + external updater + the bundled A2A runtime onedir +
# manifests + licenses + SBOM + receipt). The product-owned installers replace
# them: `packaging/install.sh`, `packaging/install.ps1`, and the complete MSI
# built from `engine/crates/vaultspec-cli/wix/main.wxs`. Dist is retained ONLY
# for target planning, checksums, and GitHub release hosting.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Per-artifact checksums are RETAINED and explicit: the product-owned installers
# fetch `<artifact>.sha256` beside each release archive and refuse a mismatch
# before they place anything, so the digest algorithm is part of the release
# contract rather than an implicit default.
checksum = "sha256"
# No Dist updater: Dist's axoupdater is retired in favour of the product-owned
# copied external updater (`vaultspec-updater`), which replaces the release
# outside the active seat under the installation lock. The product installers
# place it; Dist must not.
install-updater = false
# Features to pass to cargo build
features = ["embed-spa"]
# Steps injected into every build job BEFORE cargo runs: the embed-spa build
# compiles frontend/dist into the binary, so the SPA bundle must exist first
# (build order, dashboard-packaging D2). The same hook restores the pinned A2A
# source checkout and locked freeze environment the bundled runtime is built
# from, so composition needs no network at install time.
github-build-setup = "../release-build-setup.yml"
# release.yml is hand-managed and dist must not re-verify it. Two things live in
# that file which dist cannot express and would therefore delete on regeneration:
# the `runs-on` labels for the non-target jobs (plan, host, announce — they have
# no target, so dist emits ubuntu-22.04, and this fleet has no such runner), and
# the per-job disk-reclaim steps this shared workstation needs (dist's only build
# hook, github-build-setup, runs BEFORE the build, not after it).
#
# Without this, `dist plan` fails the whole Release workflow at its first job with
# "release.yml has out of date contents and needs to be regenerated" — which is
# what it did. The trade is real and deliberate: dist no longer checks this file,
# so a dist upgrade can silently diverge from what it would generate. Re-diff
# release.yml against `dist generate-ci` output whenever cargo-dist-version moves.
allow-dirty = ["ci"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether dist should create a Github Release or use an existing draft
create-release = false
# Post-announce jobs to run in CI
post-announce-jobs = ["./scoop-bump"]

  # Artifact builds run on the shared self-hosted fleet. Each target selects a
  # runner of its OWN architecture, which is not a preference: the freeze step
  # RUNS the interpreter it bundles, so there is no cross-compile path for the
  # bundled runtime and a target built elsewhere would be mislabelled rather than
  # merely slow.
  #
  # Two of these are auto-assigned OS labels, and two are custom labels, which is
  # an asymmetry worth explaining rather than tidying away. The fleet registers ONE
  # Windows machine and ONE macOS machine, so `Windows` and `macOS` each identify
  # exactly one runner. It registers TWO Linux machines — one x86-64, one ARM64 —
  # and the Actions runner gives both the auto-assigned `Linux` label, so `Linux`
  # identifies neither. Architecture has to be part of the selection.
  #
  # Everywhere else in this repository that is written as a label LIST, e.g.
  # `runs-on: [self-hosted, Linux, ARM64]`, using only auto-assigned labels. That
  # is not available here: dist's value for a target is a single label string
  # (`GithubRunner`, a String newtype, in both the short and the expanded table
  # form), and it is emitted verbatim into `runs-on: ${{ matrix.runner }}` in the
  # generated release workflow. A TOML array here does not error — dist accepts it
  # and silently keeps only the FIRST element, which was verified against the
  # pinned 0.32.0 binary: `= ["self-hosted", "Linux", "X64"]` planned as
  # `runner: "self-hosted"`, a label every machine in the fleet carries. So the
  # only way to express one architecture in one string is a custom label, and the
  # two Linux runners carry `linux-x64` and `linux-arm64` in addition to their
  # auto-assigned labels.
  #
  # Those two labels must exist on the runners before this file names them. A
  # label no registered runner carries does not fail the release — it queues it,
  # silently and forever.
  # The two non-Linux targets keep the short form: one label, no container.
  [dist.github-custom-runners]
  aarch64-apple-darwin = "macOS"
  x86_64-pc-windows-msvc = "Windows"

  # THE LINUX LEGS BUILD INSIDE A DIGEST-PINNED manylinux IMAGE, so their glibc
  # floor is something the build environment enforces rather than something the
  # build host happens to satisfy. Before this, neither Linux target declared a
  # container, so each binary inherited whatever its runner provided: v0.1.8
  # shipped a `vaultspec` requiring glibc 2.39 from a host running 2.43, and
  # nothing in the repository stated a floor or would have noticed it moving.
  # 2.39 excludes every current enterprise LTS - Ubuntu 22.04, Debian 12,
  # RHEL 8 and 9, Rocky, Alma, Amazon Linux 2023 - while the README promised
  # "glibc-based Linux" without qualification.
  #
  # Same image and digest vaultspec-rag pins, so the products share one
  # baseline rather than each discovering their own. Pinned by digest because a
  # mutable tag is not an acceptable input to a release, and pinned to the same
  # manylinux RELEASE on both arches, not merely the same floor: the build
  # environment is a downloaded, executed input, and two builds of one toolchain
  # can differ in ways a floor check does not measure.
  #
  # THE SPA BUILD RUNS IN HERE TOO, and it fits with nothing to spare. The
  # build hook installs Node 22 and runs `npm ci` inside this image, and every
  # JavaScript action the job uses is executed by the runner's own bundled node.
  # Measured by running all of them in both images: Node 20, 22 and 24, and the
  # runner's node20 and node24, each report a maximum requirement of exactly
  # GLIBC_2.28 and load cleanly. That is the image's ceiling met precisely -
  # there is NO headroom. A future Node release that moves to a 2.31 floor stops
  # working here with no warning and no config change on our side, and the
  # failure will look like a broken runner rather than an expired baseline.
  # Moving to a newer manylinux is the fix when that happens; the floor guard
  # will hold the README to whatever is chosen.
  #
  # `host` is set EXPLICITLY on both, and is not decoration. It defaults to a
  # hardcoded x86_64-unknown-linux-musl, and dist prefers the container's host
  # over the runner's when it decides what the build machine is - so an aarch64
  # leg that omits it plans a cargo-zigbuild cross-compile instead of a native
  # build, and produces an artifact labelled for a machine it was not built on.
  # Verified against the pinned 0.32.0 binary: omitting `host` puts
  # `pip3 install cargo-zigbuild` into the leg's install step, and setting it
  # clears that step to null.
  [dist.github-custom-runners.x86_64-unknown-linux-gnu]
  runner = "linux-x64"
  host = "x86_64-unknown-linux-gnu"
  container = { image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb", host = "x86_64-unknown-linux-gnu" }

  # HOSTED, and the only leg that is. The fleet's ARM64 Linux runner is itself a
  # colima container with no reachable docker daemon, so a container job there
  # dies in `Initialize containers` with
  # `Value cannot be null. (Parameter 'network')` before any step runs, and
  # building natively there inherits the guest's glibc. `ubuntu-24.04-arm` is a
  # GitHub-hosted ARM64 runner with a working docker daemon, free for public
  # repositories, which this one is. No hardware was needed - the blocker was
  # the assumption that hosted runners were not an option here.
  [dist.github-custom-runners.aarch64-unknown-linux-gnu]
  runner = "ubuntu-24.04-arm"
  host = "aarch64-unknown-linux-gnu"
  container = { image = "quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1", host = "aarch64-unknown-linux-gnu" }
